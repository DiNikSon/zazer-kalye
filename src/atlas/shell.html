<title>Атлас Зазеркалья</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alice&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Mono&display=swap">
<style>
/* Лист посеребрённого зеркала: граф слева как отражение, справа — карточка-справка */
:root{
  --bg:#eceef3; --panel:#f8f9fb; --ink:#23222e; --muted:#676577; --line:#c9ccd8; --accent:#5b4bb7;
  --t-person:#b5476b; --t-kind:#2f7d6d; --t-place:#3c66b0; --t-thing:#b07a1f; --t-force:#7a4cc2; --t-group:#5f6b76;
  --edge:#a8abbb; --edge-hi:#5b4bb7; --halo:#eceef3; --ok:#2f7d4f; --bad:#b4312b; --warn:#a8741a;
  --f-display:"Alice",Georgia,serif; --f-body:"PT Sans",system-ui,sans-serif; --f-mono:"PT Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16161d; --panel:#1e1e27; --ink:#e7e5f0; --muted:#9d9ab0; --line:#34343f; --accent:#a99bff;
  --t-person:#ea7fa2; --t-kind:#5fc6ae; --t-place:#7ea6f0; --t-thing:#e2b25a; --t-force:#b996f5; --t-group:#9aa6b2;
  --edge:#4a4a58; --edge-hi:#a99bff; --halo:#16161d; --ok:#6fd398; --bad:#f07a72; --warn:#e5b45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16161d; --panel:#1e1e27; --ink:#e7e5f0; --muted:#9d9ab0; --line:#34343f; --accent:#a99bff;
  --t-person:#ea7fa2; --t-kind:#5fc6ae; --t-place:#7ea6f0; --t-thing:#e2b25a; --t-force:#b996f5; --t-group:#9aa6b2;
  --edge:#4a4a58; --edge-hi:#a99bff; --halo:#16161d; --ok:#6fd398; --bad:#f07a72; --warn:#e5b45a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font:400 26px/1 var(--f-display);margin:0;letter-spacing:.01em}
h1 span{display:inline-block;transform:scaleX(-1);opacity:.35;margin-left:2px}
.search{flex:1 1 220px;min-width:0;max-width:360px;position:relative}
.search input{width:100%;box-sizing:border-box;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.sugg{position:absolute;z-index:5;left:0;right:0;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:6px;max-height:300px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.sugg a{display:block;padding:6px 10px;color:var(--ink);text-decoration:none}
.sugg a:hover,.sugg a.on{background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:12px var(--f-mono);letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--ink);cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.4}
.chip:focus-visible{outline:2px solid var(--accent)}
main{flex:1;display:flex;min-height:0}
#graph{flex:1;min-width:0;position:relative}
svg{width:100%;height:100%;display:block;cursor:grab}
.hint{position:absolute;left:12px;bottom:10px;font:12px var(--f-mono);color:var(--muted);pointer-events:none}
aside{width:400px;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;font:13px var(--f-mono);padding:9px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{overflow:auto;padding:18px 20px 28px;flex:1;min-height:0}
.type{font:11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--c)}
.card h2{font:400 30px/1.15 var(--f-display);margin:4px 0 10px;text-wrap:balance}
.card p{margin:0 0 14px;max-width:65ch}
.portrait{display:block;width:100%;max-height:340px;object-fit:cover;object-position:center top;border-radius:8px;margin:0 0 14px;background:var(--bg)}
a.ent.av::before{display:none}
a.ent.av img{width:20px;height:20px;border-radius:50%;object-fit:cover;object-position:center top;vertical-align:-5px;margin-right:6px;box-shadow:0 0 0 1.5px var(--c)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin:4px 0 14px}
.tile{display:grid;gap:4px;text-decoration:none;color:var(--ink);font-size:12px;line-height:1.25;text-align:center}
.tile img{width:100%;aspect-ratio:1;object-fit:cover;object-position:center top;border-radius:8px;box-shadow:0 0 0 1.5px var(--t-person)}
.tile:hover span{color:var(--t-person)}
.alias{font:12px var(--f-mono);color:var(--muted);margin:-4px 0 16px}
.card h3{font:11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 0 8px;font-weight:400}
.rel{list-style:none;padding:0;margin:0;display:grid;gap:5px}
.rel li{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.rel .lbl{color:var(--muted);font-size:13px}
a.ent{color:var(--ink);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--c) 60%,transparent);}
a.ent:hover{color:var(--c)}
a.ent::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
.idx h4{font:400 20px var(--f-display);margin:16px 0 6px}
.idx ul{list-style:none;padding:0;margin:0;columns:2;column-gap:16px}
.idx li{break-inside:avoid;margin:0 0 4px;font-size:14px}
.empty{color:var(--muted)}
.txt-filter{position:sticky;top:-18px;background:var(--panel);padding:4px 0 10px;margin-top:-4px}
.orig{display:flex;align-items:center;gap:6px;font:12px var(--f-mono);color:var(--muted);margin-top:6px;cursor:pointer;width:max-content}
.orig input{width:auto;margin:0;accent-color:var(--accent)}
.txt-filter input[type=search]{width:100%;box-sizing:border-box;font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.para{scroll-margin-top:56px;display:grid;grid-template-columns:2.4em 1fr;gap:6px;margin:0 0 12px;max-width:65ch}
.para b{font:400 11px/1.9 var(--f-mono);color:var(--muted);text-align:right}
.para p{margin:0}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:2px}
.stats{font:12px var(--f-mono);color:var(--muted);margin-left:auto}

/* карточка зазеркальца */
.npc{margin:0 0 6px}
.npc figure,.npcfig{margin:0 0 14px}.npcfig .portrait{margin:0}.npcfig figcaption{font:12px var(--f-mono);color:var(--muted);margin-top:4px}.npc figure .portrait{margin:0}
.npc figcaption{font:12px var(--f-mono);color:var(--muted);margin-top:4px}
.rankrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 12px}
.rank{font:12px var(--f-mono);padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.r-обычный{color:var(--t-place);border-color:var(--t-place)}.r-сильный{color:var(--warn);border-color:var(--warn)}.r-легендарный{color:var(--t-force);border-color:var(--t-force);font-weight:700}
.face{display:flex;flex-wrap:wrap;align-items:center;gap:3px}.face .lbl{font:12px var(--f-mono);color:var(--muted);margin-right:4px}
.face i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink)}
.traits{margin:0 0 12px;display:grid;gap:6px}
.tr{display:grid;grid-template-columns:118px 1fr auto;gap:8px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:5px}
.tr dt{font:11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.tr dd{margin:0;font-weight:700}
.bar{display:flex;gap:3px}.bar i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.fr .bar i.on{background:var(--fc)}.f0{--fc:var(--bad)}.f1{--fc:var(--warn)}.f2{--fc:var(--muted)}.f3,.f4{--fc:var(--ok)}
.fr dd{color:var(--fc)}.rz i.on{background:var(--accent)}
.tr dd small{font-weight:400;color:var(--muted)}
.where{display:grid;gap:4px;margin:0 0 12px;font-size:14px}.where div{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.nh{font:11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;min-width:96px}
.where .nh{display:inline-block}
.mut{color:var(--muted)}
.ns{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:4px 0}
.ns div{border:1px solid var(--line);border-radius:6px;text-align:center;padding:4px 0 3px}
.ns span{display:block;font:10px var(--f-mono);color:var(--muted)}.ns b{font:400 20px/1.1 var(--f-display)}
.npc h3{margin:14px 0 6px}
.skills{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.skills li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:14px}
.dia{display:flex;gap:4px}.dia b{width:8px;height:8px;border:1.5px solid var(--ink);transform:rotate(45deg)}.dia b.on{background:var(--accent);border-color:var(--accent)}
.pool{font:12px var(--f-mono);color:var(--muted);white-space:nowrap}
.tiny{font-size:12px;color:var(--muted);margin:4px 0 0}
.plain{margin:0;padding-left:1.1em;font-size:14px;display:grid;gap:3px}
.st{font:11px var(--f-mono);padding:1px 7px;border-radius:99px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);white-space:nowrap;cursor:help}
.two,.three{display:grid;gap:10px;font-size:14px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}
.nh.ok{color:var(--ok)}.nh.bad{color:var(--bad)}
.npc blockquote{margin:16px 0 0;padding:10px 14px;border-left:3px solid var(--t-person);font:400 15px/1.45 var(--f-display);background:color-mix(in srgb,var(--t-person) 6%,transparent);border-radius:0 6px 6px 0}
.npc cite{display:block;font:11px var(--f-mono);font-style:normal;color:var(--muted);margin-top:4px}
.npc cite a{color:inherit}
.excl{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;color:var(--muted);font-size:14px;margin:0 0 14px}
.lore{margin-top:22px;padding-top:4px;border-top:1px solid var(--line)}
.ncount{font:11px var(--f-mono);color:var(--accent);margin-left:6px}
@media (max-width:420px){.three{grid-template-columns:1fr}.tr{grid-template-columns:1fr auto}.tr dd{grid-row:2}}
@media (max-width:820px){
  main{flex-direction:column}
  #graph{flex:none;height:55vh}
  aside{width:auto;border-left:0;border-top:1px solid var(--line)}
  body{height:auto}
  .stats{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <h1>Атлас Зазеркалья<span>Я</span></h1>
  <div class="search"><input id="q" type="search" placeholder="Найти: Пахомий, бобыли, хлев…" autocomplete="off" aria-label="Поиск"><div class="sugg" id="sugg" hidden></div></div>
  <div class="chips" id="chips"></div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <div id="graph"><svg id="svg" aria-label="Граф связей"></svg><div class="hint">колесо — масштаб · тяните фон · клик по узлу — карточка</div></div>
  <aside>
    <div class="tabs" role="tablist">
      <button id="t-card" role="tab" aria-selected="true">Карточка</button>
      <button id="t-idx" role="tab" aria-selected="false">Указатель</button>
      <button id="t-txt" role="tab" aria-selected="false">Текст</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
/*DATA*/
</script>
<script>
const TYPES={person:"Персонажи",kind:"Виды и народы",place:"Места",thing:"Предметы и еда",force:"Силы и явления",group:"Сообщества и события"};
const TYPE1={person:"персонаж",kind:"вид / народ",place:"место",thing:"предмет",force:"сила / явление",group:"сообщество / событие"};
const IMGSET=new Set(typeof IMGS!=='undefined'?IMGS:[]);
const REP=typeof NPC!=='undefined'?NPC:{};
const nodes=NODES.map(([id,name,type,desc,alias])=>{const own=IMGSET.has(id),r=!own&&REP[id]&&REP[id].img&&IMGSET.has(REP[id].img[0])?REP[id].img:null;
  return {id,name,type,desc,alias,img:own?'img/'+id+'.webp':r?'img/'+r[0]+'.webp':null,repCap:r?(r[1]||''):null,out:[],inc:[]}});
const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
const links=EDGES.map(([s,l,t])=>{const e={source:s,target:t,label:l};byId[s].out.push(e);byId[t].inc.push(e);return e});
nodes.forEach(n=>n.deg=n.out.length+n.inc.length);
const col=t=>`var(--t-${t})`;
const shown=new Set(Object.keys(TYPES));
let sel=null;
document.getElementById('stats').textContent=`${nodes.length} записей · ${links.length} связей · ${Object.values(typeof NPC!=='undefined'?NPC:{}).filter(c=>!c.x).length} карточек`;

// chips
const chips=document.getElementById('chips');
for(const [k,v] of Object.entries(TYPES)){
  const b=document.createElement('button');b.className='chip';b.style.setProperty('--c',col(k));
  b.setAttribute('aria-pressed','true');b.innerHTML=`<i></i>${v}`;
  b.onclick=()=>{shown.has(k)?shown.delete(k):shown.add(k);b.setAttribute('aria-pressed',shown.has(k));applyVis()};
  chips.appendChild(b);
}

// graph
const svg=d3.select('#svg'), g=svg.append('g');
const defs=svg.append('defs');
['n','h'].forEach(k=>defs.append('marker').attr('id','ar-'+k).attr('viewBox','0 -4 8 8').attr('refX',8).attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
  .append('path').attr('d','M0,-4L8,0L0,4').attr('fill',k==='n'?'var(--edge)':'var(--edge-hi)'));
const r0=n=>4+Math.sqrt(n.deg)*2.2;
const r=n=>n.img?Math.max(11,r0(n)+3):r0(n);
const linkSel=g.append('g').selectAll('path').data(links).join('path').attr('fill','none').attr('stroke','var(--edge)').attr('stroke-width',1).attr('marker-end','url(#ar-n)');
const lblSel=g.append('g').selectAll('text').data(links).join('text').attr('font-size',9).attr('font-family','PT Mono, monospace').attr('fill','var(--edge-hi)').attr('text-anchor','middle').attr('display','none').attr('paint-order','stroke').attr('stroke','var(--halo)').attr('stroke-width',3).text(d=>d.label);
const nodeSel=g.append('g').selectAll('g').data(nodes).join('g').style('cursor','pointer')
  .on('click',(e,d)=>{e.stopPropagation();go(d.id)});
nodeSel.append('circle').attr('class','base').attr('r',r).attr('fill',d=>col(d.type));
const imgN=nodeSel.filter(d=>d.img);
imgN.each(d=>defs.append('clipPath').attr('id','cp-'+d.id).append('circle').attr('r',r(d)));
imgN.append('image').attr('href',d=>d.img).attr('x',d=>-r(d)).attr('y',d=>-r(d)).attr('width',d=>2*r(d)).attr('height',d=>2*r(d))
  .attr('preserveAspectRatio','xMidYMin slice').attr('clip-path',d=>`url(#cp-${d.id})`);
nodeSel.append('circle').attr('class','ring').attr('r',r).attr('fill','none');
const ringDef=d=>d.img?col(d.type):'var(--halo)', ringW=d=>d.img?2:1.5;
nodeSel.select('circle.ring').attr('stroke',ringDef).attr('stroke-width',ringW);
nodeSel.append('text').attr('x',d=>r(d)+3).attr('y',3.5).attr('font-size',d=>d.deg>12?13:11).attr('font-family','PT Sans, sans-serif')
  .attr('fill','var(--ink)').attr('paint-order','stroke').attr('stroke','var(--halo)').attr('stroke-width',3).text(d=>d.name);
nodeSel.append('title').text(d=>d.name);

const W=()=>document.getElementById('graph').clientWidth, H=()=>document.getElementById('graph').clientHeight;
const sim=d3.forceSimulation(nodes)
  .force('link',d3.forceLink(links).id(d=>d.id).distance(l=>40+Math.min(l.source.deg,l.target.deg)*2).strength(.35))
  .force('charge',d3.forceManyBody().strength(-170))
  .force('collide',d3.forceCollide(d=>r(d)+6))
  .force('x',d3.forceX(0).strength(.04)).force('y',d3.forceY(0).strength(.05));
nodeSel.call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y})
  .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
function ends(d){const dx=d.target.x-d.source.x,dy=d.target.y-d.source.y,L=Math.hypot(dx,dy)||1,rt=r(d.target)+2,rs=r(d.source);
  return [d.source.x+dx*rs/L,d.source.y+dy*rs/L,d.target.x-dx*rt/L,d.target.y-dy*rt/L]}
sim.on('tick',()=>{
  linkSel.attr('d',d=>{const [a,b,c,e]=ends(d);return `M${a},${b}L${c},${e}`});
  lblSel.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2-3);
  nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`);
});
let k=1;
const zoom=d3.zoom().scaleExtent([.2,4]).on('zoom',e=>{g.attr('transform',e.transform);k=e.transform.k;labels()});
svg.call(zoom).on('dblclick.zoom',null);
svg.call(zoom.transform,d3.zoomIdentity.translate(W()/2,H()/2).scale(.55));
svg.on('click',()=>select(null));

function labels(){
  const nb=sel?new Set([sel.id,...sel.out.map(e=>e.target.id),...sel.inc.map(e=>e.source.id)]):null;
  nodeSel.select('text').attr('display',d=>(nb?nb.has(d.id):(d.deg>=9||k>1.3||(k>.85&&d.deg>=5)))?null:'none');
}
function applyVis(){
  nodeSel.attr('display',d=>shown.has(d.type)?null:'none');
  linkSel.attr('display',d=>shown.has(d.source.type)&&shown.has(d.target.type)?null:'none');
  sim.alpha(.15).restart();
}
function select(n){
  sel=n;
  const nb=n?new Set([n.id,...n.out.map(e=>e.target.id),...n.inc.map(e=>e.source.id)]):null;
  nodeSel.attr('opacity',d=>!nb||nb.has(d.id)?1:.12);
  nodeSel.select('circle.ring').attr('stroke',d=>n&&d.id===n.id?'var(--ink)':ringDef(d)).attr('stroke-width',d=>n&&d.id===n.id?3:ringW(d));
  const on=d=>n&&(d.source.id===n.id||d.target.id===n.id);
  linkSel.attr('stroke',d=>on(d)?'var(--edge-hi)':'var(--edge)').attr('stroke-width',d=>on(d)?1.6:1)
    .attr('opacity',d=>!n||on(d)?1:.06).attr('marker-end',d=>on(d)?'url(#ar-h)':'url(#ar-n)');
  lblSel.attr('display',d=>on(d)?null:'none');
  labels();
  render();
  if(n&&n.x!=null){svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity.translate(W()/2,H()/2).scale(Math.max(k,1.1)).translate(-n.x,-n.y))}
}

// panel
const pane=document.getElementById('pane');let tab='card';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const A=n=>n.img?`<a class="ent av" href="#${n.id}" style="--c:${col(n.type)}"><img src="${n.img}" alt="" loading="lazy">${esc(n.name)}</a>`:`<a class="ent" href="#${n.id}" style="--c:${col(n.type)}">${esc(n.name)}</a>`;

// ── карточки зазеркальцев ──
const NPCS=typeof NPC!=='undefined'?NPC:{};
const RULES='https://claude.ai/artifact/AmASUy51PbjhvngTJCasdg';
const SKST={"Коканье":"КР","Колупание":"СМ","Механика":"СМ","Кукичество":"ЧУ","Сыворотка общества":"ОБ","Шепоток":"СТ","Лицедейство":"СТ","Хождение в копытах":"ЧУ","Знахарство":"ЧУ","Варево":"СТ","Бобылеведение":"ОБ","Трубоведение":"СМ","Летопись":"ОБ","Чак-чак":"ПР","Сноходчество":"СТ","Щекотка":"ПР"};
const SAB=["КР","ПР","СМ","ЧУ","ОБ","СТ"];
const STE={"Разварен":"Противник: −1 кубик ко всем броскам, копится до −2. Путник: +1 Разваристость","Колосится":"−1 кубик ко всем броскам до конца сцены","Неуклюж":"−1 кубик к Прыти и навыкам на Прыти","Кислый":"−1 кубик к навыкам на Обаянии; никто не съест — до отдыха (до следующего обеда)","Красные уши":"проступки в темноте замечены без броска; −1 кубик к обману","Влажный":"громики отстают; огонь не горит, бумага раскисает","Заполиплен":"нельзя применять странности; говоришь только то, что велит наложивший","Опутан":"нет движения; −1 кубик к атакам и защите; вырваться — Крепость против Колупания","Опрокинут":"встать — это движение; атаки по тебе с ближней +1 кубик","Ошарашен":"в следующий ход нет основного действия и реакции","Напуган":"нельзя приблизиться к источнику страха; −1 кубик к атакам по нему","В петле":"пропускаешь ходы, пока не выбросишь успех","Пуча":"−1 кубик к Чутью; лечит жимпаж","Простуда":"говоришь волнисто; −1 кубик к навыкам на Обаянии","Ангина ламантинов":"как простуда, но заразна","Икота":"−1 кубик к Хождению в копытах","Подготовлен":"+1 к уровню навыка на одну проверку","Воодушевлён":"+1 кубик к следующему броску","Раскрепощён":"+1 кубик к атакам на ближней","Гуттаперчив":"подготовка к Прыти и Чак-чаку; падения без урона","Вывернут":"нельзя схватить, связать или колупнуть","В раковине":"броня 2 (берётся лучшая); Коканье не действует","Парит":"достать можно только со средней или дальней","Свой":"подготовка к общению с зазеркальцами","Светится":"темнота не даёт противникам +1 кубик","С двойником":"первая атака приходится в двойника"};
const FRW={m:["враждебен","насторожен","безразличен","доброжелателен","друг"],f:["враждебна","насторожена","безразлична","доброжелательна","подруга"],n:["враждебно","настороженно","безразлично","доброжелательно","дружелюбно"],p:["враждебны","насторожены","безразличны","доброжелательны","друзья"]};
const RZW={m:["неразумен","простодушен","разумен","мудр"],f:["неразумна","простодушна","разумна","мудра"],n:["неразумно","простодушно","разумно","мудро"],p:["неразумны","простодушны","разумны","мудры"]};
const BRW={m:["трусливый","нормальный","храбрый"],f:["трусливая","нормальная","храбрая"],n:["трусливое","нормальное","храброе"],p:["трусливые","нормальные","храбрые"]};
const BRH={s:["бежит, когда повержена половина своих; меньше трёх — не нападает","бежит, оставшись один или отпугнутый; в одиночку не нападает","не бежит — уходит только сам"],p:["бегут, когда повержена половина своих; меньше трёх — не нападают","бегут, оставшись в одиночку или отпугнутые; в одиночку не нападают","не бегут — уходят только сами"]};
const TKW={s:["не общается","звуками","письменно","говорит"],p:["не общаются","звуками","письменно","говорят"]};
const cap=w=>w[0].toUpperCase()+w.slice(1);
function rich(t){ // [[id|текст]] → ссылка, {Состояние|форма} → метка
  return esc(t).replace(/\[\[([^|\]]+)(?:\|([^\]]+))?\]\]/g,(m,id,tx)=>{const n=byId[id];if(!n)return esc(tx||id);
      return tx?`<a class="ent" href="#${id}" style="--c:${col(n.type)}">${tx}</a>`:A(n)})
    .replace(/\{([^|}]+)(?:\|([^}]+))?\}/g,(m,k,f)=>`<span class="st" title="${esc(STE[k]||'')}">${f||k}</span>`)}
const tok=t=>/^[a-z_0-9]+$/.test(t)&&byId[t]?A(byId[t]):rich(t);
const pool=(v,l)=>`${v}к6 на ${l===1?'5+':'4+'}${l===3?' · 6 = два':''}`;
function npcHTML(n){
  const c=NPCS[n.id];if(!c)return '';
  if(c.x)return `<div class="excl">${esc(c.x)} <a href="${RULES}" target="_blank" rel="noopener">Свод правил</a></div>`;
  const g=c.g,bar=(k,cnt,cls)=>`<span class="bar ${cls||''}">${Array.from({length:cnt},(_,i)=>`<i class="${i===k?'on':''}${cls==='rz'&&i<=k?' on':''}"></i>`).join('')}</span>`;
  const tr=[];
  if(c.fr!=null)tr.push(`<div class="tr fr f${c.fr}"><dt>Дружелюбность</dt><dd>${cap(FRW[g][c.fr])}</dd>${bar(c.fr,5)}</div>`);
  if(c.rz!=null)tr.push(`<div class="tr"><dt>Разумность</dt><dd>${cap(RZW[g][c.rz])}</dd>${bar(c.rz,4,'rz')}</div>`);
  if(c.br!=null)tr.push(`<div class="tr"><dt>Храбрость</dt><dd>${cap(BRW[g][c.br])} <small>— ${BRH[g==='p'?'p':'s'][c.br]}</small></dd>${bar(c.br,3,'rz')}</div>`);
  if(c.talk!=null)tr.push(`<div class="tr"><dt>Общение</dt><dd>${cap(TKW[g==='p'?'p':'s'][c.talk])}${c.tn?` <small>— ${esc(c.tn)}</small>`:''}</dd></div>`);
  const face=c.face?`<span class="face"><span class="lbl">Лицо ${c.face}</span>${'<i></i>'.repeat(c.face)}</span>`:`<span class="face"><span class="lbl">Лица нет</span></span>`;
  const rank=c.rank!=='—'?`<span class="rank r-${c.rank}">${c.rank}</span>`:`<span class="rank">${esc(c.k)}</span>`;
  const list=a=>a&&a.length?a.map(tok).join(''):'<span class="mut">—</span>';
  const v=x=>x&&x!=='—'?rich(x):'<span class="mut">—</span>';
  let h='';
  if(!n.img&&c.img&&byId[c.img[0]]&&byId[c.img[0]].img)h+=`<figure><img class="portrait" src="${byId[c.img[0]].img}" alt="">${c.img[1]?`<figcaption>${esc(c.img[1])}</figcaption>`:''}</figure>`;
  h+=`<div class="rankrow">${rank}${face}</div>`;
  if(tr.length)h+=`<dl class="traits">${tr.join('')}</dl>`;
  h+=`<div class="where"><div><span class="nh">Обитает</span>${list(c.lives)}</div><div><span class="nh">Принадлежит</span>${list(c.bel)}</div></div>`;
  if(c.stats){h+=`<div class="ns">${c.stats.map((x,i)=>`<div><span>${SAB[i]}</span><b>${x}</b></div>`).join('')}</div>`;
    h+=`<h3>Навыки</h3>`+(c.skills.length?`<ul class="skills">${c.skills.map(([nm,l])=>`<li><span>${esc(nm)}</span><span class="dia">${[1,2,3].map(i=>`<b class="${i<=l?'on':''}"></b>`).join('')}</span><span class="pool">${pool(c.stats[SAB.indexOf(SKST[nm])],l)}</span></li>`).join('')}</ul><p class="tiny">Остальные — уровень 0.</p>`:`<p class="tiny">Все навыки — уровень 0: голая характеристика, успех на 5+.</p>`)}
  if(c.props.length)h+=`<h3>Свойства</h3><ul class="plain">${c.props.map(p=>`<li>${rich(p)}</li>`).join('')}</ul>`;
  if(c.moves.length)h+=`<h3>Приёмы</h3><ul class="plain">${c.moves.map(([t,x])=>`<li><b>${esc(t)}.</b> ${rich(x)}</li>`).join('')}</ul>`;
  h+=`<h3>Без боя</h3><div class="two"><div><span class="nh ok">Любит · задобрить</span>${v(c.likes)}</div><div><span class="nh bad">Боится · отпугнуть</span>${v(c.fears)}</div></div>`;
  h+=`<h3>Что можно получить</h3><div class="three"><div><span class="nh">Учит</span>${v(c.teach)}</div><div><span class="nh">Торгует</span>${v(c.trade)}</div><div><span class="nh">Добыча</span>${v(c.loot)}</div></div>`;
  if(c.q)h+=`<blockquote>«${esc(c.q[1])}»<cite>абзац ${c.q[0].split(',').map(x=>`<a href="#" data-par="${x.trim()}">${x.trim()}</a>`).join(', ')}</cite></blockquote>`;
  return `<section class="npc">${h}</section>`;
}
function render(){
  document.getElementById('t-card').setAttribute('aria-selected',tab==='card');
  document.getElementById('t-idx').setAttribute('aria-selected',tab==='idx');
  document.getElementById('t-txt').setAttribute('aria-selected',tab==='txt');
  if(tab==='txt'){renderTxt();return}
  if(tab==='idx'){
    const srt=a=>a.sort((x,y)=>x.name.localeCompare(y.name,'ru'));
    pane.innerHTML='<div class="idx">'+Object.entries(TYPES).map(([t,v])=>{const ns=srt(nodes.filter(n=>n.type===t)),wi=ns.filter(n=>n.img),wo=ns.filter(n=>!n.img);
      return `<h4>${v}</h4>`+(wi.length?`<div class="gallery">${wi.map(n=>`<a class="tile" href="#${n.id}"><img src="${n.img}" alt="" loading="lazy"><span>${esc(n.name)}</span></a>`).join('')}</div>`:'')+(wo.length?`<ul>${wo.map(n=>`<li>${A(n)}</li>`).join('')}</ul>`:'')}).join('')+'</div>';
    return;
  }
  const n=sel;
  if(!n){pane.innerHTML=`<div class="card"><div class="type" style="--c:var(--accent)">база знаний</div><h2>Атлас Зазеркалья</h2>
    <p>Справочник по серии видео «Зазеркалье»: ${nodes.length} записей и ${links.length} направленных связей. Выберите узел на графе, найдите имя в поиске или откройте указатель.</p>
    <p class="empty">Под названием каждой записи — написания, встретившиеся в расшифровке.</p>
    <h3>С чего начать</h3><ul class="rel">${['zazerkalye','ono','ona','istukanus','geroy','kvest','bobyli','fantasmogor'].map(i=>`<li>${A(byId[i])}</li>`).join('')}</ul></div>`;return}
  const grp=(arr,f)=>{const m=new Map();arr.forEach(e=>{const k=e.label;m.has(k)||m.set(k,[]);m.get(k).push(f(e))});return m};
  const list=(m,dir)=>[...m].map(([l,ns])=>`<li>${dir==='in'?ns.map(A).join(', ')+` <span class="lbl">${esc(l)}</span>`:`<span class="lbl">${esc(l)}</span> `+ns.map(A).join(', ')}</li>`).join('');
  const out=grp(n.out,e=>e.target), inc=grp(n.inc,e=>e.source);
  pane.innerHTML=`<article class="card">${n.img?(n.repCap!=null?`<figure class="npcfig"><img class="portrait" src="${n.img}" alt="">${n.repCap?`<figcaption>${esc(n.repCap)}</figcaption>`:''}</figure>`:`<img class="portrait" src="${n.img}" alt="${esc(n.name)}">`):''}<div class="type" style="--c:${col(n.type)}">${TYPE1[n.type]}${NPCS[n.id]&&!NPCS[n.id].x?' · карточка зазеркальца':''}</div><h2>${esc(n.name)}</h2>
    ${n.alias?`<div class="alias">в расшифровке: ${esc(n.alias)}</div>`:''}
    ${npcHTML(n)}
    ${NPCS[n.id]&&!NPCS[n.id].x?'<h3 class="lore">Из атласа</h3>':''}<p>${esc(n.desc)}</p>
    ${n.out.length?`<h3>${esc(n.name)} →</h3><ul class="rel">${list(out,'out')}</ul>`:''}
    ${n.inc.length?`<h3>→ ${esc(n.name)}</h3><ul class="rel">${list(inc,'in')}</ul>`:''}</article>`;
  pane.scrollTop=0;
}
document.getElementById('t-card').onclick=()=>{tab='card';render()};
document.getElementById('t-idx').onclick=()=>{tab='idx';render()};
document.getElementById('t-txt').onclick=()=>{tab='txt';render()};
let txtQ='',parJump=0,txtOrig=false;
const TXT=()=>txtOrig||typeof CLEAN==='undefined'?PARAS:CLEAN;
function renderTxt(){
  pane.innerHTML=`<div class="txt-filter"><input id="tq" type="search" placeholder="Найти в тексте…" aria-label="Поиск по тексту" value="${esc(txtQ)}"><label class="orig"><input type="checkbox" id="torig" ${txtOrig?'checked':''}> оригинальный текст</label></div><div id="paras"></div>`;
  const tq=document.getElementById('tq');
  document.getElementById('torig').addEventListener('change',e=>{txtOrig=e.target.checked;draw()});
  const draw=()=>{const v=txtQ.trim(),nv=v.toLowerCase().replace(/ё/g,'е');
    const rx=v?new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[её]/gi,'[её]'),'gi'):null;
    const html=TXT().map((t,i)=>[t,i]).filter(([t])=>!v||t.toLowerCase().replace(/ё/g,'е').includes(nv))
      .map(([t,i])=>`<div class="para"><b>${i+1}</b><p>${rx?esc(t).replace(rx,m=>'<mark>'+m+'</mark>'):esc(t)}</p></div>`).join('');
    document.getElementById('paras').innerHTML=(html||'<p class="empty">Ничего не найдено.</p>')+'<p class="empty" style="margin-top:18px;font:12px var(--f-mono)">Текст вписан вплоть до '+PARAS.length+' выпуска.</p>'};
  tq.addEventListener('input',()=>{txtQ=tq.value;draw()});
  draw();
  if(parJump){const el=document.getElementById('paras').children[parJump-1];parJump=0;if(el){el.scrollIntoView({block:'start'});el.querySelector('p').style.background='color-mix(in srgb,var(--accent) 14%,transparent)'}}
}

function go(id){const n=byId[id];if(!n)return;tab='card';
  if(!shown.has(n.type)){shown.add(n.type);[...chips.children][Object.keys(TYPES).indexOf(n.type)].setAttribute('aria-pressed','true');applyVis()}
  select(n);try{history.replaceState(null,'','#'+id)}catch(e){}}
document.addEventListener('click',e=>{const pa=e.target.closest('a[data-par]');if(pa){e.preventDefault();parJump=+pa.dataset.par;tab='txt';txtQ='';render();return}const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();sugg.hidden=true;q.value='';go(decodeURIComponent(a.getAttribute('href').slice(1)))});
function route(){let id='',par=0;
  try{const q=new URLSearchParams(location.search);id=q.get('card')||'';par=+(q.get('p')||0)}catch(e){}
  try{const h=decodeURIComponent(location.hash.slice(1));const m=h.match(/^(?:p|text-?)(\d+)$/);if(m)par=+m[1];else if(h)id=h}catch(e){}
  if(par){select(null);parJump=par;tab='txt';txtQ='';render();return}
  if(byId[id])go(id);else select(null)}
addEventListener('hashchange',route);

// search
const q=document.getElementById('q'),sugg=document.getElementById('sugg');let hits=[],hi=0;
const norm=s=>s.toLowerCase().replace(/ё/g,'е');
q.addEventListener('input',()=>{const v=norm(q.value.trim());
  hits=v?nodes.filter(n=>norm(n.name+' '+n.alias).includes(v)).slice(0,12):[];hi=0;
  sugg.hidden=!hits.length;sugg.innerHTML=hits.map((n,i)=>`<a href="#${n.id}" class="${i?'':'on'}" style="--c:${col(n.type)}">${esc(n.name)}</a>`).join('')});
q.addEventListener('keydown',e=>{if(!hits.length)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hi=(hi+(e.key==='ArrowDown'?1:hits.length-1))%hits.length;[...sugg.children].forEach((a,i)=>a.classList.toggle('on',i===hi))}
  if(e.key==='Enter'){go(hits[hi].id);sugg.hidden=true;q.blur()}
  if(e.key==='Escape'){sugg.hidden=true}});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))sugg.hidden=true});

route();
setTimeout(()=>{if(sel)select(sel)},1800);
</script>
