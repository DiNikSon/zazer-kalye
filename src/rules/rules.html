<p><b>Помогающему не нужен навык</b> — нужна логичная заявка: держать фонарь, пока друг вскрывает замок, — да; «помогу ему песней» — нет. Решает ведущий.</p>
<p>Сильнее всего подготовка помогает тем, у кого навыка нет:</p>
<div class="tbl"><table><tr><th>Пул</th><th>0 → 1</th><th>1 → 2</th></tr><tr><td>1к6</td><td>17% → 33%</td><td>33% → 50%</td></tr><tr><td>2к6</td><td>31% → 56%</td><td>56% → 75%</td></tr><tr><td>3к6</td><td>42% → 70%</td><td>70% → 88%</td></tr></table></div>
<h3>Ограничения</h3>
<ul><li><b>Не складывается.</b> Сколько бы источников ни было (предмет, подготовка, помощь), бонус всегда +1.</li>
<li><b>Мастер.</b> Если навык уже на уровне 3, подготовка вместо уровня даёт +1 кубик к пулу.</li></ul>`},

{id:"opposed",sec:"check",st:"ok",t:"Встречный бросок",lead:"Когда против персонажа действует кто-то другой, бросают обе стороны.",b:`
<div class="rule"><p>Побеждает тот, у кого больше успехов. При ничьей побеждает защищающийся.</p></div>
<p>Примеры: украсть ложку у Казимира, переспорить болотного скрипача, спрятаться от Сатора Арепыча. Для противника достаточно пула и порога: «бобыль — 3к6 на 5+». Как устроены противники — [[q-foes]].</p>
<p>Встречный бросок лежит в основе [[damage|урона]].</p>`},

{id:"reroll",sec:"check",st:"ok",t:"Переброс за Усталость",lead:"После броска можно взять 1 Усталость и перебросить все неудачные кубики.",b:`
<div class="rule"><p>Один раз за бросок. В Зазеркалье платят Разваристостью.</p></div>
<p>Это общий способ исправить провал, доступный каждому; особые — [[q-bitubis|битубисас]] и «Повторить шаг» (см. [[outcome]]). Чем больше Усталость, тем меньше кубиков в следующих бросках — см. [[fatigue]].</p>`},

{id:"odds",sec:"check",st:"ok",t:"Таблица шансов",lead:"Вероятность набрать 1 / 2 / 3 успеха в зависимости от пула и уровня.",b:`
<div class="tbl nw"><table><tr><th>Пул</th><th>Уровень 0</th><th>Уровень 1</th><th>Уровень 2</th><th>Уровень 3</th></tr>
<tr><td>1к6</td><td>17 / – / –</td><td>33 / – / –</td><td>50 / – / –</td><td>50 / 17 / –</td></tr>
<tr><td>2к6</td><td>31 / 3 / –</td><td>56 / 11 / –</td><td>75 / 25 / –</td><td>75 / 42 / 14</td></tr>
<tr><td>3к6</td><td>42 / 7 / –</td><td>70 / 26 / 4</td><td>88 / 50 / 12</td><td>88 / 62 / 33</td></tr>
<tr><td>4к6</td><td>52 / 13 / 2</td><td>80 / 41 / 11</td><td>94 / 69 / 31</td><td>94 / 77 / 52</td></tr>
<tr><td>5к6</td><td>60 / 20 / 4</td><td>87 / 54 / 21</td><td>97 / 81 / 50</td><td>97 / 86 / 67</td></tr></table></div>
<p>Значения в процентах, без [[reroll|переброса]]. [[bare|Голая характеристика]] считается как уровень 1.</p>`},

{id:"damage",sec:"fight",st:"ok",t:"Урон",lead:"Атака — это встречный бросок. Каждый лишний успех атакующего наносит 1 урон.",b:`
<div class="rule"><p>Урон = успехи атакующего − успехи защищающегося (если больше нуля).</p></div>
<p>Защищающийся бросает Прыть + [[act-defense|броню]]; защита — не действие, её бросают всегда.</p>
<p>Урон в реальном мире идёт по [[health|Здоровью]], в Зазеркалье — по [[face|Лицу]]. Общего бонуса к урону у оружия нет — см. [[weapons]].</p>`},

{id:"distance",sec:"fight",st:"ok",t:"Дистанции",lead:"Расстояния в игре — три дистанции: ближняя, средняя и дальняя. Без клеток и метров.",b:`
<div class="tbl"><table><tr><th>Дистанция</th><th>Что это</th><th>Что достаёт</th></tr>
<tr><td><b>Ближняя</b></td><td>рукой подать: можно коснуться, схватить, ударить</td><td>Драка, Коканье, касания</td></tr>
<tr><td><b>Средняя</b></td><td>несколько шагов, через комнату или поляну; докинуть камень</td><td>броски, палка от круглого Толика, большинство [[odd-rules|странностей]]</td></tr>
<tr><td><b>Дальняя</b></td><td>докуда видно и докричаться; пересечь — два-три движения</td><td>особые странности, стрельба, если найдётся чем</td></tr></table></div>
<p>Атака или странность действует только на указанной дистанции и ближе, если в описании не сказано иное. Сменить дистанцию на одну ступень — это [[act-move|движение]].</p>
<p>Используется в [[weapons|свойствах оружия]] и [[odd-fight|каталоге странностей]].</p>`},
{id:"weapons",sec:"fight",st:"ok",t:"Оружие и его свойства",lead:"У каждого оружия своё свойство вместо общего бонуса к урону.",b:`
<p>Свойство может быть любым: дальность, помощь в другом навыке, перенос лишнего урона и так далее. </p>
<p>Все виды оружия с ценами и свойствами — [[gear-weapons]].</p>`},

{id:"act-turn",sec:"act",st:"ok",t:"Ход и раунд",lead:"За ход у персонажа три действия: основное, движение и реакция — по одному каждого вида.",b:`
<div class="tbl"><table><tr><th>Вид</th><th>Что это</th><th>Когда</th></tr>
<tr><td><i class="atype at-main">основное</i></td><td>то, ради чего ход: атака, странность, помощь, предмет — [[act-main]]</td><td>в свой ход</td></tr>
<tr><td><i class="atype at-move">движение</i></td><td>сменить дистанцию на ступень, встать, удрать — [[act-move]]</td><td>в свой ход, до или после основного</td></tr>
<tr><td><i class="atype at-react">реакция</i></td><td>ответ на чужое действие — [[act-react]]</td><td>один раз до начала своего следующего хода</td></tr></table></div>
<p><b>Раунд</b> — каждый участник делает по ходу. Первой ходит сторона, начавшая конфликт; внутри стороны — в любом порядке.</p>
<p><b>Засада.</b> Подкрасться — встречный Хождение в копытах против Чутья. Удалось — в первом раунде ходят только нападающие, и их первая атака [[prep|подготовлена]].</p>
<p>Неиспользованное не копится: нельзя взять два основных действия вместо основного и движения. Обменять основное на второе движение — можно.</p>
<p>Реплика, жест, взгляд — бесплатно. Защита от атаки — не действие: её бросают всегда ([[act-defense]]).</p>`},

{id:"act-main",sec:"act",st:"ok",t:"Основные действия",lead:"Одно за ход. Атака — встречный бросок, урон — лишние успехи.",b:`
<div class="tbl"><table><tr><th>Действие</th><th>Бросок</th><th>Против</th><th>Итог</th></tr>
<tr><td><b>Кокнуть</b> — ударить</td><td>Коканье (наяву Драка)</td><td>Прыть + броня</td><td>урон по Лицу (наяву по Здоровью); бобыля — кокает ([[kokanye]])</td></tr>
<tr><td><b>Колупнуть</b> — схватить</td><td>Колупание (наяву Мастеровитость)</td><td>Прыть + броня</td><td>урона нет; одно на выбор: цель [[cond-bind|Опутана]], отобрать предмет, обшарить — см. [[act-kok]]</td></tr>
<tr><td><b>Кинуть</b></td><td>Чак-чак (наяву Спорт)</td><td>Прыть + броня</td><td>урон или эффект брошенного, до средней дистанции</td></tr>
<tr><td><b>Пощекотать</b></td><td>Щекотка (наяву Соблазнение)</td><td>Крепость</td><td>цель [[cond-weak|Колосится]]; в темноте — проступок перед Ею</td></tr>
<tr><td><b>Странность</b></td><td>Странность</td><td>по описанию</td><td>если у странности тип «основное» — [[odd-rules]]</td></tr>
<tr><td><b>Помочь</b></td><td>—</td><td>—</td><td>союзник [[prep|подготовлен]] к следующей проверке</td></tr>
<tr><td><b>Глухая оборона</b></td><td>—</td><td>—</td><td>до своего следующего хода защищаешься с [[prep|подготовкой]]</td></tr>
<tr><td><b>Предмет</b></td><td>—</td><td>—</td><td>выпить зелье, съесть гычу, применить вещь</td></tr>
<tr><td><b>Вырваться</b></td><td>Крепость</td><td>Колупание держащего</td><td>снять Опутан</td></tr>
<tr><td><b>Задобрить</b></td><td>Бобылеведение или Шепоток</td><td>сложность 1–2</td><td>дал то, что существо любит: оно не нападает до конца сцены</td></tr>
<tr><td><b>Отпугнуть</b></td><td>чаще без броска</td><td>—</td><td>показал то, чего существо боится (строка «Боится» в карточке атласа)</td></tr>
<tr><td><b>Заболтать</b></td><td>Лицедейство</td><td>Чутьё</td><td>цель поверила до конца сцены</td></tr>
<tr><td><b>Спрятаться</b></td><td>Хождение в копытах</td><td>Чутьё</td><td>тебя не видят, пока не выдашь себя</td></tr></table></div>
<p>Вне конфликта это просто [[roll|проверки]]: очерёдность нужна, только когда кто-то противится.</p>`},

{id:"act-kok",sec:"act",st:"ok",t:"Кокнуть и колупнуть",lead:"Коканье бьёт, колупание держит. Первое ранит, второе — нет.",b:`
<div class="tbl"><table><tr><th></th><th>Кокнуть</th><th>Колупнуть</th></tr>
<tr><td><b>Суть</b></td><td>удар</td><td>взять в руки, держать, выковырять, разобрать</td></tr>
<tr><td><b>Навык</b></td><td>Коканье (Крепость); наяву Драка</td><td>Колупание (Смекалка); наяву Мастеровитость</td></tr>
<tr><td><b>Итог</b></td><td>урон — лишние успехи</td><td>без урона: Опутан, или отнял предмет, или обшарил</td></tr>
<tr><td><b>Пока держишь</b></td><td>—</td><td>ты тоже без движения; отпустить — бесплатно</td></tr>
<tr><td><b>Кого нельзя</b></td><td>Реутеня и прочих в непробиваемой скорлупе</td><td>бобылей — выскальзывают; мопсосвинов — только за брылю</td></tr>
<tr><td><b>Кого легко</b></td><td>бобыля: любой урон кокает его</td><td>грязунов, особенно задобренных хамоном; кожника — если не выскользнет</td></tr>
<tr><td><b>Вне боя</b></td><td>—</td><td>собрать лицо (как Епень), чинить руками, вскрыть, вытащить</td></tr></table></div>
<p>Пустынный бобыль сначала пытается кокнуть, а если не вышло — колупает.</p>`},

{id:"act-move",sec:"act",st:"ok",t:"Движение",lead:"Одно за ход: сменить дистанцию на ступень — или потратить движение на что-то из списка.",b:`
<div class="tbl"><table><tr><th>Движение</th><th>Итог</th></tr>
<tr><td><b>Сблизиться или отойти</b></td><td>на одну ступень [[distance|дистанции]]</td></tr>
<tr><td><b>Встать</b></td><td>снять [[cond-bind|Опрокинут]]</td></tr>
<tr><td><b>Удрать</b></td><td>начинается [[q-chase|погоня]]; если догонять некому — ты вне сцены без броска</td></tr>
<tr><td><b>Достать или убрать вещь</b></td><td>вместо шага; выпить или применить — уже основное</td></tr>
<tr><td><b>Странность-движение</b></td><td>Прыжки с кротами, Зависнуть в воздухе, Ходьба на руках, Сальто природы</td></tr></table></div>
<p>Уходя с ближней дистанции от противника, ты даёшь ему [[act-react|удар вдогонку]].</p>
<p>[[cond-bind|Опутанный]] не двигается.</p>`},

{id:"q-chase",sec:"act",st:"ok",t:"Погоня",lead:"Догнать или убежать — раундами встречной Прыти. Кто первым наберёт 3 перевеса, тот оторвался или догнал.",b:`
<p>Когда нужно: {{almazy|алмазы}} разбегаются, {{kazimir|Казимир}} уносит ложку, за вами {{glaz_pizza|глазастая пицца}}, от {{gleb|пыльного Глеба}} надо уйти к выходу ({{p228|абзац 228}}), {{mednyi_nozh|медный нож}} сбегает.</p>
<ul><li><b>Раунд погони.</b> Каждая сторона бросает Прыть — или навык по обстановке — и сравнивает успехи.</li>
<li><b>Шкала.</b> Перевес в раунде — +1 к шкале своей стороны, ничья — никому. Кто первым набрал 3, тот победил: беглец оторвался и ушёл из сцены — или преследователь догнал и в том же раунде может атаковать или колупнуть.</li>
<li><b>Несколько бегущих.</b> Каждый ведёт свою шкалу против преследователя. Держаться вместе — бросает самый медленный за всех.</li>
<li><b>Препятствия.</b> Ведущий может объявить препятствие на раунд — тогда обе стороны бросают другой навык: заросли и темнота — Хождение в копытах, прыжок и лазанье — Чак-чак, трубы — Трубоведение, толпа — Сыворотка общества.</li>
<li><b>Странности и предметы.</b> Удачная [[odd-move|странность-движение]] или подходящий предмет — сразу +1 к шкале.</li>
<li><b>Живые вещи.</b> Пойманную живую вещь — алмаз, нож, сбежавший сыр — удерживают [[act-kok|колупанием]]. Не удержал — она снова убегает, и шкалы обнуляются.</li>
<li><b>Из боя.</b> Погоня начинается, когда кто-то тратит движение, чтобы [[act-move|удрать]].</li></ul>
<p>См. также: [[distance]], [[q-morale]].</p>`},
{id:"act-react",sec:"act",st:"ok",t:"Реакции",lead:"Одна реакция до начала твоего следующего хода — в ответ на чужое действие.",b:`
<div class="tbl"><table><tr><th>Реакция</th><th>Когда</th><th>Итог</th></tr>
<tr><td><b>Удар вдогонку</b></td><td>противник уходит с ближней дистанции от тебя</td><td>кокнуть или колупнуть его</td></tr>
<tr><td><b>Прикрыть</b></td><td>атакуют союзника на ближней дистанции от тебя</td><td>атака приходится в тебя</td></tr>
<tr><td><b>Странность-реакция</b></td><td>по описанию</td><td>Сократить вершины, Провалиться сквозь землю, Выворачивание, Окумекиться, Быть себе битубисасом, Повторить шаг</td></tr></table></div>
<p>[[cond-bind|Ошарашенный]] теряет реакцию вместе с основным действием.</p>`},

{id:"act-defense",sec:"act",st:"ok",t:"Защита и броня",lead:"От атаки защищаются Прытью + броня. Это не действие — защиту бросают всегда.",b:`
<div class="rule"><p>Пул защиты = Прыть + броня. Порог — как у голой характеристики: 5–6.</p></div>
<p>Броня — число кубиков. Не складывается: берётся лучшая. Максимум 3. Против [[act-main|щекотки]] и большинства странностей не помогает: там защищаются характеристикой из описания.</p>
<div class="tbl"><table><tr><th>Броня</th><th>Что это</th><th>Аналог наяву</th><th>Кукичи</th><th>Минус</th></tr>
<tr><td>1</td><td><b>Войлочный тулуп</b></td><td>пуховик, плотная куртка</td><td>8</td><td>—</td></tr>
<tr><td>1</td><td><b>Сыпучесть</b>, толстая шкура</td><td>—</td><td>—</td><td>у существ</td></tr>
<tr><td>2</td><td><b>Скорлупный панцирь</b></td><td>каска и наколенники</td><td>25</td><td>гремит: −1 кубик к Хождению в копытах</td></tr>
<tr><td>2</td><td>[[cond-buff|В раковине]]</td><td>—</td><td>—</td><td>до конца сцены</td></tr>
<tr><td>3</td><td><b>Скорлупа Реутеня</b></td><td>—</td><td>не продаётся</td><td>мечта Эпикантуса</td></tr></table></div>
<p>[[prep|Подготовка]] к защите (глухая оборона, предмет) даёт порог 4–6. [[cond-weak|Неуклюжий]] теряет кубик Прыти — и в защите тоже.</p>`},

{id:"health",sec:"state",st:"ok",t:"Здоровье",lead:"Трек урона в реальном мире. Максимум — 3 + Крепость.",b:`
<p>Здоровье и [[face|Лицо]] — два отдельных трека: урон наяву не трогает Лицо, урон в Зазеркалье не трогает Здоровье.</p>
<p>На нуле — [[ko]]. Восстанавливается [[rest|отдыхом]].</p>`},

{id:"face",sec:"state",st:"ok",t:"Лицо",lead:"Трек урона в Зазеркалье. Максимум — 3 + Крепость.",b:`
<p>Отдельный от [[health|Здоровья]] трек. На нуле персонаж теряет лицо — см. [[faceless]].</p>
<p>Пока Лицо выше нуля, оно восстанавливается [[rest|отдыхом]]. Потерянное лицо отдых не возвращает.</p>`},

{id:"fatigue",sec:"state",st:"ok",t:"Усталость и Разваристость",lead:"Шкала от 0 до 6. Наяву — Усталость, в Зазеркалье — Разваристость.",b:`
<div class="tbl"><table><tr><th>Значение</th><th>Эффект</th></tr><tr><td>0–3</td><td>нет штрафа</td></tr><tr><td>4–5</td><td>на кубик меньше во всех бросках (не меньше одного)</td></tr><tr><td>6</td><td>бросаете только один кубик; [[reroll|переброс]] недоступен</td></tr></table></div>
<p>Растёт от [[reroll|перебросов]] и по ситуации. Снимается [[rest|отдыхом]].</p>`},

{id:"ko",sec:"state",st:"ok",t:"Без сознания",lead:"Ноль Здоровья в реальном мире — персонаж теряет сознание.",b:`
<p>Смерти в реальном мире нет. Если без сознания вся группа, персонажи приходят в себя в больнице.</p>
<p>Аналог для Зазеркалья — [[all-down]].</p>`},

{id:"faceless",sec:"state",st:"ok",t:"Потеря лица",lead:"Ноль Лица в Зазеркалье — персонаж безлик, пока не найдёт новое лицо.",b:`
<h3>Последствия</h3>
<ol><li><b>Тебя не узнают.</b> Знакомые зазеркальцы забывают персонажа, договорённости и долги перед ним стираются. Навыки на Обаянии бросаются как уровень 0 — успех только на шестёрке, [[prep|подготовка]] не помогает.</li>
<li><b>Не проснуться.</b> Сон безликого не отражает: он не может [[wake|вернуться]] в реальный мир — разве что через [[q-exit|выход]].</li>
<li><b>Надзор слеп.</b> Оно и Она не узнают безликого: [[oversight|метки надзора]] ему не ставятся. Можно безнаказанно совершать [[misdeeds|проступки]] — но домой не попасть.</li></ol>
<h3>Как найти лицо</h3>
<div class="tbl"><table><tr><th>Способ</th><th>Что нужно</th><th>Что даёт</th><th>Чем плох</th></tr>
<tr><td>Собрать самому, как Епень</td><td>три предмета под глаза, нос и рот; Колупание, 2 успеха</td><td>лицо сразу</td><td>[[face-quirks|странность из таблицы к6]]</td></tr>
<tr><td>Маска с острова лавового озера</td><td>пройти мимо Лавана и камнюков</td><td>надёжна, проснуться можно</td><td>лицо чужое: знакомые по-прежнему не узнают (последствие 1 остаётся)</td></tr>
<tr><td>Портрет от Алевтины</td><td>кукичи; не рассыпать её бисер</td><td>красивое: [[prep|подготовка]] к Сыворотке общества</td><td>смывается водой</td></tr>
<tr><td>Лицо от Истукануса</td><td>предстать и ответить на его вопрос</td><td>надёжное</td><td>новое зазеркальное имя и +1 Странность (сумма характеристик станет 19)</td></tr>
<tr><td>Отобрать своё у многоликого Филиппа</td><td>старый лабиринт; подводный Гоша или маска</td><td>родное лицо, все последствия сняты</td><td>—</td></tr></table></div>
<h3>Лицо после находки</h3>
<p>Любое новое лицо даёт 1 клетку [[face|Лица]], остальное восстанавливается [[rest|отдыхом]]. Родное лицо возвращается полностью.</p>`},

{id:"face-quirks",sec:"state",st:"ok",t:"Странности самодельного лица",lead:"Бросьте к6, если лицо собрано из подручных средств.",b:`
<div class="tbl"><table><tr><th>к6</th><th>Лицо</th></tr>
<tr><td>1</td><td>Из скорлупок — Михаил смотрит голодными глазами</td></tr>
<tr><td>2</td><td>Из бахромки — Идибикс ходит следом</td></tr>
<tr><td>3</td><td>Из сыра — Оно раздражается, если ты на виду днём</td></tr>
<tr><td>4</td><td>Перекошенное — майонезные тётеньки сразу считают тебя странным</td></tr>
<tr><td>5</td><td>Перевёрнутое — говоришь задом наперёд, понимают не сразу</td></tr>
<tr><td>6</td><td>Чужое — однажды хозяин придёт за ним</td></tr></table></div>
<p>Относится к способу «собрать самому» из [[faceless]].</p>`},

{id:"all-down",sec:"state",st:"ok",t:"Все легли в Зазеркалье",lead:"Если в Зазеркалье повержена вся группа, персонажи приходят в себя в сладком хлеву.",b:`
<p>Сладкий хлев — место ссылки, куда Оно отправляет провинившихся. Он движется высоко в небе, рядом кожник, коровы и чан молока. Сбежать удалось только Птозному Эдгару: он спрыгнул над медными скалами. Выбраться оттуда — готовое приключение.</p>
<p>Аналог для реального мира — [[ko]].</p><p>Как оттуда выйти — [[q-hlev]].</p>`},

{id:"rest",sec:"state",st:"ok",t:"Отдых",lead:"Отдых полностью восстанавливает Здоровье, Лицо, Усталость и Разваристость. В безопасном месте — без броска, в остальных — под дозором.",b:`
<div class="rule"><p>Отдых и сон-возвращение — разные вещи. В Зазеркалье можно отдохнуть и остаться там; чтобы вернуться, нужен отдельный [[wake|сон с намерением проснуться]].</p></div>
<ul><li><b>Безопасное место</b> — отдых без броска: дом наяву, у Акакия Куролесова, у бабы Жули, в дупле Пахомия, в имении Кривина по приглашению.</li>
<li><b>Остальные места</b> — нужен [[rest-watch|дозор]].</li>
<li><b>Сколько раз</b> — сколько угодно. В безопасном месте отдых ничем не ограничен; в опасном каждый отдых — это дозор и риск события.</li>
<li>Потерянное лицо отдых не возвращает — нужен один из способов из [[faceless]].</li></ul>`},

{id:"rest-watch",sec:"state",st:"ok",t:"Дозор",lead:"Вне безопасного места часть группы стоит в дозоре. Дозорные бросают, остальные отдыхают.",b:`
<ol><li><b>Кто в дозоре</b> — решают игроки. Дозорные не получают ничего из отдыха.</li>
<li><b>Бросок:</b> каждый дозорный бросает Хождение в копытах (наяву — Скрытность): не только смотреть, но и не выдать стоянку. Успехи всех дозорных <b>складываются</b>.</li>
<li><b>Набрали сложность</b> — для остальных всё как в безопасном месте.</li>
<li><b>Не набрали</b> — случается событие из списка области. Когда с ним разобрались, не-дозорные всё равно отдыхают.</li></ol>
<div class="tbl"><table><tr><th>Сложность</th><th>Где</th></tr>
<tr><td>1</td><td>тихо: лабиринт у имения Кривина, грязевые угодья, сумеречная роща днём</td></tr>
<tr><td>2</td><td>опасно: болото, запретная пустыня, подземные трубы, лавовое озеро</td></tr>
<tr><td>3</td><td>очень опасно: осколок ещё того Зазеркалья, старый лабиринт</td></tr></table></div>
<ul><li><b>Темнота</b> — сложность +1 ([[night]]).</li>
<li><b>Ноль успехов</b> — событие застаёт врасплох: если это нападение, первый раунд у противника ([[act-turn]]).</li>
<li><b>Хотя бы один успех</b> — дозор заметил вовремя, засады нет.</li></ul>
<p><b>Какой список событий:</b> обширные области (роща, болото, пустыня, осколок) — 2к6, сумма от 2 до 12: 7 случается чаще всего, 2 и 12 — редко ([[sh-ev-wide]]). Узкие области (трубы, лабиринты, озеро, угодья) — к6 ([[sh-ev-narrow]]). Совсем конкретные места, например лаборатория Эпикантуса, получают свои события по ходу кампании.</p>`},

{id:"sheet",sec:"char",st:"ok",t:"Лист путника",lead:"Двусторонний лист: сторона А — реальный мир, сторона Я — Зазеркалье.",b:`
<p>Ведущий вписывает имя, [[stats|характеристики]] и [[levels|уровни навыков]]; пулы навыков на обеих сторонах считаются сами. Здоровье, Усталость, деньги и вещи игроки заполняют ручкой после печати.</p>
<p>На стороне Я есть блок «Спутник» — кто, к какому навыку подготовка, особое свойство и его Лицо ([[q-companions]]). У каждой строки пожитков — клетка для отметки: битубисас использован в сессии, варево испорчено.</p>
<p>Под характеристиками — поле «Код из теста». Код [[test-skills|теста навыков]] вписывается в уровни 1 к 1, код [[test-stats|теста характеристик]] переводится по правилу [[statmap]]. Если у нескольких характеристик равные остатки, лист даёт игроку выбрать, какая получит очко. «Вернуть как было» отменяет вставку.</p>
<p>Лист печатается PDF по две страницы А4 на персонажа: <a class="ref" href="https://claude.ai/artifact/3pfFpJ5XBXeQC9YmwMiw4u" target="_blank" rel="noopener">открыть Лист путника ↗</a>.</p>`},

{id:"creation",sec:"char",st:"ok",t:"Создание персонажа",lead:"Игрок не распределяет очки сам: он проходит два теста и отдаёт ведущему коды результатов.",b:`
<ol><li><b>[[test-stats|Абсолютно не подозрительный тест]]</b> — 20 бытовых ситуаций. Определяет [[stats|характеристики]].</li>
<li><b>[[test-skills|Супер подозрительный тест]]</b> — 16 ситуаций. Определяет [[levels|уровни навыков]].</li></ol>
<p>Навыки переносятся 1 к 1, характеристики переводятся по правилу [[statmap]]. Результат вписывается в [[sheet|Лист путника]]: проще всего вставить коды в поле «Код из теста» — лист сам узнает тест и всё впишет. Зазеркальное имя остаётся пустым до встречи с Истуканусом.</p>
<p>Итог для всех персонажей одинаков по сумме: характеристики в сумме дают 18, уровни навыков — 16. Различается только распределение.</p>`},

{id:"test-stats",sec:"char",st:"ok",t:"Тест характеристик",lead:"«Абсолютно не подозрительный тест»: 20 вопросов, в каждом три варианта, каждый вариант — одна из шести характеристик.",b:`
<p>Тест сбалансирован: каждая характеристика встречается ровно в 10 вопросах, а каждая пара характеристик сталкивается в одном вопросе ровно 4 раза. Поэтому ни одна характеристика не получает преимущества от состава вопросов.</p>
<div class="tbl"><table><tr><th>Что выдаёт тест</th><th>Что нужно на листе</th></tr><tr><td>шесть чисел от 0 до 10, в сумме 20</td><td>шесть чисел от 1 до 5, в сумме 18</td></tr></table></div>
<p>Сырые результаты не переносятся в лист 1 к 1: их переводят по правилу [[statmap]].</p>
<p>Порядок в коде: Крепость, Прыть, Смекалка, Чутьё, Обаяние, Странность. Код — JSON-массив в base64.</p>
<p><a class="ref" href="https://claude.ai/artifact/LuRvpFgFFgWDr8cUcjThuF" target="_blank" rel="noopener">Открыть тест ↗</a></p>`},

{id:"test-skills",sec:"char",st:"ok",t:"Тест навыков",lead:"«Супер подозрительный тест»: 16 вопросов, в каждом три варианта, каждый вариант — один навык.",b:`
<p>Каждый навык встречается ровно в трёх вопросах. Число выборов навыка и есть его [[levels|уровень]] — от 0 до 3, перенос 1 к 1. Всего выборов 16, поэтому сумма уровней всегда 16.</p>
<p>Варианты ответов описывают навыки в реальном мире; в Зазеркалье уровень переходит к парному навыку ([[skills]]).</p>
<p>Порядок в коде совпадает с порядком в [[skills|таблице навыков]]: Драка, Мастеровитость, … Соблазнение. Код — JSON-массив в base64.</p>
<p><a class="ref" href="https://claude.ai/artifact/35kvTHF2td82eAeYxc2ueK" target="_blank" rel="noopener">Открыть тест ↗</a></p>`},

{id:"statmap",sec:"char",st:"ok",t:"Перевод теста в характеристики",lead:"Каждой характеристике по 1, остальные 12 очков делятся пропорционально результатам теста. Сумма всегда 18.",b:`
<div class="rule"><p>Вход — шесть сырых чисел из [[test-stats|теста характеристик]] (0–10, в сумме 20). Выход — шесть [[stats|характеристик]] от 1 до 5, в сумме ровно 18.</p></div>
<h3>Порядок перевода</h3>
<ol><li>Каждая характеристика получает базовую 1.</li>
<li>Доля каждой = 0,6 × сырое значение (12 очков на 20 выборов).</li>
<li>Если доля больше 4, характеристика сразу получает 5, а её лишек делится между остальными пропорционально их сырым значениям. Повторять, пока ни одна доля не превышает 4.</li>
<li>Каждая характеристика получает целую часть своей доли.</li>
<li>Недостающие до 12 очки раздаются по одному — тем, у кого больше дробный остаток доли.</li>
<li>При равных остатках очко получает тот, у кого больше сырое значение. Если равны и они, игрок сам выбирает, какая из равных характеристик получит очко.</li></ol>
<h3>Пример</h3>
<div class="tbl nw"><table><tr><th></th><th>КР</th><th>ПР</th><th>СМ</th><th>ЧУ</th><th>ОБ</th><th>СТ</th><th>Сумма</th></tr>
<tr><td>Сырое</td><td>4</td><td>4</td><td>4</td><td>3</td><td>3</td><td>2</td><td>20</td></tr>
<tr><td>Доля</td><td>2,4</td><td>2,4</td><td>2,4</td><td>1,8</td><td>1,8</td><td>1,2</td><td>12</td></tr>
<tr><td>Целые</td><td>2</td><td>2</td><td>2</td><td>1</td><td>1</td><td>1</td><td>9</td></tr>
<tr><td>Остатки</td><td colspan="7" style="white-space:normal">3 очка: ЧУ и ОБ (остаток 0,8), затем одна из КР / ПР / СМ (0,4) — на выбор игрока</td></tr>
<tr><td>Итог</td><td>4</td><td>3</td><td>3</td><td>3</td><td>3</td><td>2</td><td>18</td></tr></table></div>
<p>Пример с потолком: сырое 10, 5, 5, 0, 0, 0 → доля первой 6 > 4, она получает 5; оставшиеся 8 очков делятся поровну между двумя пятёрками → итог 5, 5, 5, 1, 1, 1.</p>
<h3>Известные свойства</h3>
<ul><li>Порядок сохраняется всегда: большее сырое значение никогда не даёт меньшую характеристику (проверено на всех 41 118 возможных результатах теста).</li>
<li>Равные сырые значения могут дать разные характеристики — это цена точной суммы 18 (см. шаг 6).</li>
<li>Всё, что выше 6–7 сырых выборов, упирается в 5.</li></ul>
<p>Вручную считать не нужно: [[sheet|Лист путника]] переводит код теста сам.</p>`},

{id:"q-exit",sec:"mirror",st:"ok",t:"Выход из Зазеркалья",lead:"Путники уходят из Зазеркалья через сон. Всем остальным нужен выход — ключ от него хранит куб запретной пустыни.",b:`
<p>Сон-[[wake|возвращение]] работает только для путников: их отражает сон. Через сон не могут уйти:</p>
<ul><li><b>существа Зазеркалья</b> — в том числе [[q-companions|спутники]];</li>
<li><b>безликие</b> — потерявшие лицо и не нашедшие нового ([[faceless]]);</li>
<li><b>ставшие зазеркальцами</b> — как {{sator|Сатор Арепыч}}: в миру офицер Крукопацкий, он забыл прежнюю личность и остался здесь.</li></ul>
<p>Для них нужен <b>выход</b>. Ключ от него хранит {{kub|куб запретной пустыни}}: проход в куб распечатывает только эссенция {{kolodec|спектрального колодца}}, а от пустынных бобылей куб охраняет {{rimma|Костяная Римма}}. Как устроен выход и чего он стоит — решает кампания.</p>`},
{id:"q-pvz",sec:"mirror",st:"ok",t:"Подозрения работника ПВЗ",lead:"У группы на каждый ПВЗ своя шкала подозрения: 0–8 очков, ступень — каждые 2 очка.",b:`
<div class="tbl"><table><tr><th>Очки</th><th>Что думает</th><th>Что делает</th></tr>
<tr><td>0–1</td><td>ничего</td><td>обычная выдача заказов</td></tr>
<tr><td>2–3</td><td>«показалось»</td><td>косится на примерочную, когда кто-то заходит</td></tr>
<tr><td>4–5</td><td>«странные клиенты»</td><td>задаёт вопросы, просит оставить сумку у стойки</td></tr>
<tr><td>6–7</td><td>«что-то нечисто»</td><td>заглядывает за ширму через минуту: войти незаметно — Скрытность, 1 успех</td></tr>
<tr><td>8</td><td>«я их вычислил»</td><td>ведущий бросает к6 по таблице исходов</td></tr></table></div>
<div class="tbl"><table><tr><th>Что меняет шкалу</th><th>Очки</th></tr>
<tr><td>вечером кто-то ушёл в зеркало без отражения</td><td>+1</td></tr>
<tr><td>утром кто-то вышел из примерочной, куда не входил</td><td>+1</td></tr>
<tr><td>странность или другая чертовщина наяву на глазах работника</td><td>+1</td></tr>
<tr><td>путник с [[q-reflection|отражением]] — визит не замечен</td><td>0</td></tr>
<tr><td>Обман против Чутья работника («я переодевался») — успех</td><td>в этот раз 0</td></tr>
<tr><td>днём зайти как нормальный клиент: Этикет, 1 успех, не чаще раза в день</td><td>−1</td></tr></table></div>
<h3>Исход на 8 очках — к6</h3>
<div class="tbl"><table><tr><th>к6</th><th>Исход</th><th>Потом</th></tr>
<tr><td>1</td><td><b>Закрыл примерочную «на ремонт».</b> ПВЗ недоступен до конца следующей сессии</td><td>6 очков</td></tr>
<tr><td>2</td><td><b>Повесил камеру над ширмой.</b> Войти — только с отражением или Скрытность на 2 успеха</td><td>8, исход держится</td></tr>
<tr><td>3</td><td><b>Позвал охрану.</b> Сцена наяву: объясниться (Этикет или Обман, 2 успеха) или убегать</td><td>6 очков</td></tr>
<tr><td>4</td><td><b>Написал в чат сотрудников.</b> Соседние ПВЗ этой сети тоже настороже</td><td>здесь 6, у соседних +2</td></tr>
<tr><td>5</td><td><b>Сам полез в зеркало</b> — и Поленыч его пустил. Работник пропал в Зазеркалье: найти и вернуть — приключение</td><td>вернули — 0</td></tr>
<tr><td>6</td><td><b>Хочет в долю.</b> Будет молчать за услугу: принести что-то «оттуда»</td><td>4, пока сделка соблюдается</td></tr></table></div>
<p>Работник — сквозной персонаж реального мира: Чутьё 3 (3к6 на 5+), без навыков. У каждого ПВЗ свой, имя — на первой встрече. Зазеркальные вещи наяву становятся обычными, поэтому выдать группу могут только сами путники ([[items]]).</p>`},
{id:"q-group",sec:"check",st:"ok",t:"Групповая проверка",lead:"Когда группа делает одно дело вместе, успехи всех складываются, а сложность умножается на число участников.",b:`
<div class="rule"><p>Нужно успехов = сложность × число участников. Каждый бросает свой навык со своим порогом, успехи суммируются.</p></div>
<p>Пример: трое крадутся мимо Смоломаза, сложность 1 — нужно 3 успеха на всех. Ловкий может вытянуть неуклюжего.</p>
<ul><li>Кто не участвует — не бросает и не считается. Остаться позади — всегда вариант.</li>
<li>[[prep|Подготовка]] и [[reroll|переброс]] работают у каждого отдельно.</li>
<li>Встречный групповой бросок (группа против Чутья стража) — то же самое: сумма против его успехов × число участников.</li>
<li>[[rest-watch|Дозор]] — особый случай: успехи складываются, но сложность не умножается.</li></ul>`},
{id:"q-attitude",sec:"act",st:"ok",t:"Отношение зазеркальцев",lead:"Дружелюбность меняется надолго — поступками группы. Отношение общее для всей группы.",b:`
<div class="tbl"><table><tr><th>Что сделали</th><th>Сдвиг</th></tr>
<tr><td>Услуга, о которой просил; подарок из строки «Любит»; спасли от того, чего он «Боится»</td><td>+1 ступень</td></tr>
<tr><td>Обманули, и он узнал; напали; сделали то, чего он «Боится»</td><td>−1 ступень</td></tr>
<tr><td>Тяжёлая обида: украли, кокнули, выдали Оно или Ей</td><td>−2 ступени</td></tr></table></div>
<ul><li><b>Не чаще раза за сцену</b> в каждую сторону.</li>
<li><b>Ступени:</b> враждебен → насторожен → безразличен → доброжелателен → друг. Начальная — из карточки в атласе.</li>
<li><b>Друг</b> помогает сам: подсказывает, прячет, даёт подготовку. <b>Доброжелательный</b> соглашается на просьбы. <b>Безразличный</b> — только за плату. <b>Насторожен</b> и <b>враждебен</b> — только [[act-main|задобрить]], до конца сцены.</li>
<li><b>Виды и сообщества</b> — по решению ведущего: подружиться можно с конкретным бобылём, но не со всеми бобылями; с орденом ведьм как с целым — можно.</li>
<li><b>Где отмечать</b> — лист [[pr-rel]] в «Распечатках».</li></ul>`},
{id:"q-travel",sec:"order",st:"ok",t:"Переходы",lead:"Переход из одного места в другое — сцена. По тихим местам — без броска, по опасным — проверка Трубоведения; провал — заплутали.",b:`
<ul><li><b>Сцена.</b> Переход между местами атласа занимает сцену. Ведущий описывает дорогу; по пути может случиться встреча.</li>
<li><b>Бросок.</b> Ведёт один — проводник: он бросает Трубоведение (наяву — Ориентирование), остальные могут дать ему [[prep|подготовку]].</li></ul>
<div class="tbl"><table><tr><th>Куда</th><th>Сложность</th></tr>
<tr><td>тихие места: лабиринт у имения Кривина, грязевые угодья, роща днём, знакомая дорога</td><td>без броска</td></tr>
<tr><td>опасные: болото, запретная пустыня, подземные трубы, лавовое озеро</td><td>1</td></tr>
<tr><td>очень опасные: осколок ещё того Зазеркалья, старый лабиринт</td><td>2</td></tr></table></div>
<ul><li><b>Темнота</b> — сложность +1 ([[night]]).</li>
<li><b>Провал — заплутали:</b> +1 Разваристость всем, и случается событие из таблицы области — как при проваленном [[rest-watch|дозоре]] ([[sh-ev-wide]], [[sh-ev-narrow]]).</li>
<li><b>Без броска:</b> с проводником — {{knyaz|желейный князь}} в трубах, {{lesnoy_kurbak|Курбак}} ночью в лесу, {{vilki|вилки}} к логову ведьм; с {{edgar|караваном Эдгара}} между рощей и пустыней (билет — проездной из дома); по подсказке из события («утром дорога без броска»); странностью «Вихрь».</li>
<li><b>Запретная пустыня:</b> чтобы пройти через хрупкие пески, нужна вода Бутыльона — [[q-desert]].</li></ul>`},
{id:"q-desert",sec:"order",st:"ok",t:"Проход через запретную пустыню",lead:"Вместо исключённого Подмыхана проход стережёт Бутыльон: хрупкие пески держат только смоченные его водой. Воду можно выпросить — или выпить самого Бутыльона.",b:`
<p>По лору проход в {{pustynya|запретную пустыню}} охраняет {{podmyhan|Подмыхан}}, но он [[excluded|исключён]]. В кампании его место занимает {{butylon|Бутыльон}} — это обход исключённой ветки, в видео такого нет.</p>
<p><b>Пески.</b> Вокруг входа в пустыню пески слишком хрупкие, чтобы выдержать путника. Держат только смоченные водой Бутыльона — своей фляги на это не хватит.</p>
<p><b>Договориться</b> — Бутыльон одолжит воду.</p>
<ul><li>Сыворотка общества или Шепоток на 2 успеха; можно [[q-group|группой]].</li>
<li>Фляга влаги в подарок — [[prep|подготовка]]. Носителю жабьего шапца он одалживает воду без броска.</li>
<li>Жажда в глазах пугает его: путник без воды — ни фляги, ни воды Бутыльона — бросает при нём на кубик меньше.</li>
<li>Провал — Бутыльон пугается и уходит в песок до следующего дня.</li>
<li>Успех — воды хватает на один переход туда и обратно, и в этот переход жара не страшна. О {{zhemchuzhiny|потерянных жемчужинах}} он по-прежнему может рассказать.</li></ul>
<p><b>Выпить</b> — пройти силой.</p>
<ul><li>Это бой: Бутыльон обычный, Лицо 3. Урон по нему — путники пьют; на нуле он осушен.</li>
<li>Воды хватает на один переход, как и при договоре.</li>
<li>Цена: знание о жемчужинах уходит в песок вместе с ним, а [[q-attitude|отношение]] обитателей пустыни к группе −2. Метки Оно или Её это не даёт: драка — не их дело ([[misdeeds]]).</li></ul>
<p><b>Жажда и жара.</b> Жажда — это отсутствие воды: ни своей фляги влаги, ни воды Бутыльона. Каждая дневная сцена в пустыне с жаждой — +1 [[fatigue|Разваристость]].</p>`},
{id:"q-chicken",sec:"order",st:"ok",t:"Цыплёнок у Видуса",lead:"Три метки Её — и путник становится цыплёнком в чак-чаке у Видуса. Нужно выбраться.",b:`
<ol><li><b>Каждый раунд</b> — встречный бросок: Чак-чак цыплёнка против Чак-чака {{vidus|Видуса}} (5к6 на 4+, шестёрка — два).</li>
<li><b>Выиграл раунд</b> — +1 к счёту побега. <b>Проиграл</b> — −1 Лицо.</li>
<li><b>Три выигранных раунда</b> — выбрался: свободен, шкала Её обнуляется. Это печать «Стать цыплёнком у Видуса — и выбраться» ([[q-growth]]).</li>
<li><b>Лицо упало до 1</b> — Видус отпускает сам, но «ощипанным»: до следующего отдыха путник [[cond-weak|Кислый]], а одну вещь из пожитков Видус оставляет себе как трофей.</li></ol>
<p><b>Помощь:</b> друзья дают [[prep|подготовку]], если пришли в темноте и сами не боятся Её. Многократных победителей зовут курицами.</p>
<p>Связано с [[oversight]].</p>`},
{id:"q-hlev",sec:"order",st:"ok",t:"Сладкий хлев",lead:"Сюда попадают за три метки Оно и когда в Зазеркалье легла вся группа. Хлев плывёт по небу и отпускает сам.",b:`
<ul><li><b>Срок:</b> ведущий бросает к6 — столько сцен длится заключение. Отпускает Оно в светлое время, высаживая там, откуда путник попал в хлев.</li>
<li><b>Внутри:</b> отдых безопасный; каждую сцену сладковатый воздух снимает 1 Разваристость. {{kozhnik|Кожник}} играет в догонялки и за услугу учит Выворачиванию; коровы дают молоко — то самое, из чана которого вырос сырный Джо.</li>
<li><b>Отработка:</b> каждая услуга хлеву — накормить коров, развеселить кожника, вычистить чан — снимает одну оставшуюся сцену.</li>
<li><b>Побег, как у {{edgar|Птозного Эдгара}}:</b> в начале сцены к6; на 6 хлев над медными скалами. Прыгнуть — Прыть на 2 успеха; провал — падение, 2 урона по Лицу, но всё равно на свободе.</li>
<li><b>После выхода</b> шкала Оно обнуляется. Сбежавшим — остаётся на 2.</li></ul>
<p>Это печать «Побывать в сладком хлеву» ([[q-growth]]). Связано с [[oversight]] и [[all-down]].</p>`},
{id:"q-brew",sec:"gear",st:"ok",t:"Варево",lead:"Шесть ингредиентов, три в котёл — двадцать вариантов. Варят по рецепту или наугад; провалил Варево — варево испорчено, и при питье бросают 2к6.",b:`
<h3>Ингредиенты</h3>
<div class="tbl"><table><tr><th>Ингредиент</th><th>Где взять</th><th>Кукичи</th></tr>
<tr><td>{{zelenika|Зеленика}}</td><td>собрать в сумеречной роще — её собирает и Акакий</td><td>1</td></tr>
<tr><td>{{griby|Гриб}}</td><td>собрать в роще; за грибами охотится {{idiks|Идибикс}}</td><td>1</td></tr>
<tr><td>{{morkovnye|Морковные пятки}}</td><td>огород {{zhulya|бабы Жули}} — купить; воровать мешает {{tolstomyas|толстомясочка}}</td><td>2</td></tr>
<tr><td>{{hrychi|Хрычи}}</td><td>огород бабы Жули; дикие хрычи опасны</td><td>2</td></tr>
<tr><td>{{med|Мёд осов}}</td><td>только у {{osy|ос}} — это опасно; в воде мёда нет</td><td>3</td></tr>
<tr><td>{{skorlupa|Скорлупа}}</td><td>дефицит: за ней охотятся {{epikantus|Эпикантус}} и {{mikhail|Михаил}}</td><td>4</td></tr></table></div>
<p>Один ингредиент — одна строка [[q-inventory|пожитков]]; готовое варево — тоже строка.</p>
<p><b>Сбор.</b> Сцена сбора в подходящем месте — проверка Знахарства на 1 успех: каждый успех — один ингредиент того, что там растёт. Провал — ничего не нашёл.</p>
<ul><li><b>Зеленика, гриб</b> — сумеречная роща. Собирая грибы, бросьте к6: на 1 следом увязывается {{idiks|Идибикс}}.</li>
<li><b>Пятки, хрычи</b> — огород бабы Жули: купить у неё или стащить — Хождение в копытах против Чутья {{tolstomyas|толстомясочки}}.</li>
<li><b>Мёд</b> — только у ос: Хождение в копытах на 2 успеха; провал — осы нападают (событие 9 рощи).</li>
<li><b>Скорлупа</b> — в {{skorl_yama|скорлупной яме}} Эпикантуса: Чутьё на 2 успеха, а рядом может быть Михаил; или купить.</li></ul>
<h3>Как варить</h3>
<ul><li><b>Где и когда.</b> Только в Зазеркалье и только на [[rest|отдыхе]] — но сколько угодно раз, пока хватает ингредиентов. Котёл не нужен; у бабы Жули или в {{krivaya_gora|логове ведьм}} варево [[prep|подготовлено]].</li>
<li><b>Три разных ингредиента</b> — одно варево. Что получится, решает сочетание — таблица ниже.</li>
<li><b>По рецепту.</b> Рецепт узнают у учителя за услугу — Жуля учит гыче, Акакий — компоту, Вальтасар — своим зельям — или находят, например обрывок рецепта гнома Радомира.</li>
<li><b>Наугад.</b> Ведущий описывает, как выглядит варево — цвет, запах, бульканье. Что оно делает, путник узнаёт, только выпив.</li>
<li><b>Проверка Варева</b> на сложность из таблицы. Успех — варево удалось. Провал — варево испорчено: отметьте клетку у его строки в пожитках. Основной эффект у него есть, но <b>при питье</b> бросьте 2к6 по таблице побочных действий.</li>
<li><b>Выпить</b> — основное [[act-main|действие]]. Срок годности не ограничен.</li></ul>
<h3>Рецепты</h3>
<div class="tbl"><table><tr><th>№</th><th>Ингредиенты</th><th>Варево</th><th>Слож.</th><th>Эффект</th></tr><tr><td>1</td><td>{{zelenika|Зеленика}}, {{griby|Гриб}}, {{morkovnye|Пятки}}</td><td><b>Зелье парения над слизнями</b></td><td>1</td><td>Действует только на голубей — а значит, и на {{peskari|пескаря}}. Рецепт {{valtasar|Вальтасара}}.</td></tr><tr><td>2</td><td>{{zelenika|Зеленика}}, {{griby|Гриб}}, {{hrychi|Хрычи}}</td><td><b>Капли от пучи</b></td><td>2</td><td>Снимают [[cond-ill|Пучу]] вместо жимпажа.</td></tr><tr><td>3</td><td>{{zelenika|Зеленика}}, {{griby|Гриб}}, {{med|Мёд}}</td><td><b>Компот Куролесова</b></td><td>1</td><td>Снимает [[cond-bind|Напуган]] и [[cond-ill|Икоту]]; до конца сцены тебя не напугать. Рецепт {{akakiy|Акакия}}.</td></tr><tr><td>4</td><td>{{zelenika|Зеленика}}, {{griby|Гриб}}, {{skorlupa|Скорлупа}}</td><td><b>Светлячковая кашица</b></td><td>1</td><td>[[cond-buff|Светишься]] до конца сцены.</td></tr><tr><td>5</td><td>{{zelenika|Зеленика}}, {{morkovnye|Пятки}}, {{hrychi|Хрычи}}</td><td><b>Зелёный бальзам</b></td><td>3</td><td>+2 [[face|Лица]].</td></tr><tr><td>6</td><td>{{zelenika|Зеленика}}, {{morkovnye|Пятки}}, {{med|Мёд}}</td><td><b>Зелье бега</b></td><td>2</td><td>До конца сцены ты быстрее глазастой пиццы: уходишь от [[q-chase|погони]] без броска. Рецепт {{valtasar|Вальтасара}}.</td></tr><tr><td>7</td><td>{{zelenika|Зеленика}}, {{morkovnye|Пятки}}, {{skorlupa|Скорлупа}}</td><td><b>Кураж-настойка</b></td><td>2</td><td>[[cond-buff|Раскрепощён]] до конца сцены.</td></tr><tr><td>8</td><td>{{zelenika|Зеленика}}, {{hrychi|Хрычи}}, {{med|Мёд}}</td><td><b>Зелье от ангины ламантинов</b></td><td>2</td><td>До конца сессии иммунитет к [[cond-ill|Ангине ламантинов]]. Рецепт {{valtasar|Вальтасара}}.</td></tr><tr><td>9</td><td>{{zelenika|Зеленика}}, {{hrychi|Хрычи}}, {{skorlupa|Скорлупа}}</td><td><b>Кислый морс</b></td><td>1</td><td>[[cond-weak|Кислый]] до отдыха (<i>до следующего обеда</i>): тебя никто не съест, но −1 кубик к навыкам на Обаянии.</td></tr><tr><td>10</td><td>{{zelenika|Зеленика}}, {{med|Мёд}}, {{skorlupa|Скорлупа}}</td><td><b>Зелье распознавания мигунов</b></td><td>2</td><td>До конца сцены отличаешь мигуна, замаскированного под бобыля. Рецепт {{valtasar|Вальтасара}}.</td></tr><tr><td>11</td><td>{{griby|Гриб}}, {{morkovnye|Пятки}}, {{hrychi|Хрычи}}</td><td><b>Гуттаперчевая похлёбка</b></td><td>2</td><td>[[cond-buff|Гуттаперчив]] до конца сцены.</td></tr><tr><td>12</td><td>{{griby|Гриб}}, {{morkovnye|Пятки}}, {{med|Мёд}}</td><td><b>Сонный взвар</b></td><td>2</td><td>[[wake|Уснуть]] без броска — даже в опасном месте.</td></tr><tr><td>13</td><td>{{griby|Гриб}}, {{morkovnye|Пятки}}, {{skorlupa|Скорлупа}}</td><td><b>Бульон окумекивания</b></td><td>3</td><td>Один раз в эту сцену: когда Лицо падает до 0, встаёшь с 1.</td></tr><tr><td>14</td><td>{{griby|Гриб}}, {{hrychi|Хрычи}}, {{med|Мёд}}</td><td><b>Горячий хрычовник</b></td><td>2</td><td>Снимает [[cond-ill|Простуду]] — без бурлешки и отдыха.</td></tr><tr><td>15</td><td>{{griby|Гриб}}, {{hrychi|Хрычи}}, {{skorlupa|Скорлупа}}</td><td><b>Панцирный отвар</b></td><td>3</td><td>[[cond-buff|В раковине]] до конца сцены: броня 2, Коканье не действует.</td></tr><tr><td>16</td><td>{{griby|Гриб}}, {{med|Мёд}}, {{skorlupa|Скорлупа}}</td><td><b>Зелье планов синих ящеров</b></td><td>2</td><td>Ведущий раскрывает одну ближайшую шалость синих ящеров. Рецепт {{valtasar|Вальтасара}}.</td></tr><tr><td>17</td><td>{{morkovnye|Пятки}}, {{hrychi|Хрычи}}, {{med|Мёд}}</td><td><b>{{gycha|Гыча}}</b></td><td>1</td><td>Снимает 2 Разваристости. Рецепт {{zhulya|бабы Жули}}.</td></tr><tr><td>18</td><td>{{morkovnye|Пятки}}, {{hrychi|Хрычи}}, {{skorlupa|Скорлупа}}</td><td><b>Зелье дальнего коканья</b></td><td>2</td><td>Один раз — Коканье на средней дистанции. Рецепт {{valtasar|Вальтасара}}.</td></tr><tr><td>19</td><td>{{morkovnye|Пятки}}, {{med|Мёд}}, {{skorlupa|Скорлупа}}</td><td><b>Пятки в меду</b></td><td>1</td><td>[[cond-buff|Свой]] до конца сцены: подготовка к общению с зазеркальцами, майонезные не придираются.</td></tr><tr><td>20</td><td>{{hrychi|Хрычи}}, {{med|Мёд}}, {{skorlupa|Скорлупа}}</td><td><b>{{skip|Скип}}</b></td><td>2</td><td>Любимое лакомство синих ящеров: синий ящер за него выполнит одну просьбу или выдаст одну шалость сородичей.</td></tr></table></div>
<h3>Испорченное варево — 2к6 при питье</h3>
<div class="tbl"><table><tr><th>2к6</th><th>Побочное действие</th></tr><tr><td>2</td><td><b>Чужое лицо:</b> до конца сессии знакомые зазеркальцы тебя не узнают.</td></tr><tr><td>3</td><td>[[cond-ill|Ангина ламантинов]] — заразна.</td></tr><tr><td>4</td><td>Заговариваешься: до конца сцены [[cond-bind|Заполиплен]] — говоришь то, что велит ведущий.</td></tr><tr><td>5</td><td>[[cond-ill|Икота]].</td></tr><tr><td>6</td><td>[[cond-weak|Колосится]] до конца сцены.</td></tr><tr><td>7</td><td>+1 Разваристость.</td></tr><tr><td>8</td><td>[[cond-weak|Красные уши]] до конца сцены.</td></tr><tr><td>9</td><td>[[cond-weak|Неуклюж]] до отдыха.</td></tr><tr><td>10</td><td>Светишься зелёным: в темноте тебя видно с дальней дистанции, спрятаться нельзя.</td></tr><tr><td>11</td><td>[[cond-ill|Простуда]].</td></tr><tr><td>12</td><td><b>Желтеешь:</b> до конца сцены ты желтее сыра — днём Оно ставит [[oversight|метку надзора]].</td></tr></table></div>`},
{id:"q-bitubis",sec:"gear",st:"ok",t:"Битубисас",lead:"Личный показатель надёжности. Создаётся квестом группы; раз за сессию превращает провал в успех.",b:`
<p>Из лора: {{bitubis|битубисас}} — показатель надёжности; создавать его учит {{bolshoy_almaz|большой алмаз}} за кукичи; {{mikhail|Михаил}} копит на него каждый кукич; {{klaunec|Кловунец}} хочет быть сам себе битубисасом.</p>
<ul><li><b>Создание</b> — квест группы: собрать материалы (и не принять грязуна под прикрытием за бобыля) → пройти мимо {{shnekishmyak|Шнеки-Шмяка}} в трубы ({{p220|абзац 220}}) → {{knyaz|желейный князь}} → {{zelyony_tuman|зелёный туман}} (провести может {{akakiy|Акакий Куролесов}} — в благодарность за подарок, {{p237|абзац 237}}) → {{vysokoe_duplo|высокое дупло}}: попросить {{zubzubych|Зуб Зубыча}} подойти к нему и, запрыгнув на Зубыча, попасть внутрь ({{p229|абзацы 229}}, {{p237|237}}). Каждый шаг — сцена со своей проверкой по решению ведущего.</li>
<li><b>Итог.</b> Квест проходят вместе, а битубисас — у каждого свой: его получает каждый участник. За создание ставится [[q-growth|общая печать конгресса]] — цель «Создать битубисас».</li>
<li><b>Вещь.</b> Битубисас — личный, отнять или украсть его нельзя. Записывается строкой в пожитки; клетка у строки — отметка «использован в этой сессии».</li>
<li><b>Надёжность.</b> Раз за сессию — превратить свой провал в успех с минимальным перевесом.</li>
<li><b>Быть себе битубисасом.</b> С битубисасом эта [[odd-help|странность]] ничего не стоит — вместо 1 Разваристости.</li></ul>`},
{id:"q-money",sec:"gear",st:"ok",t:"Заработок кукичей",lead:"Работа — на мелочи, поручения — на серьёзные покупки, добычу можно продать за полцены.",b:`
<h3>Работа</h3>
<p>Профессии из {{p142|абзаца 142}}. Одна сцена работы, проверка навыка на 1 успех: успех — плата, каждый лишний успех +1 кукич; провал — без оплаты, зато с историей. Не чаще раза за светлое время.</p>
<div class="tbl"><table><tr><th>Работа</th><th>Навык</th><th>Кукичи</th></tr>
<tr><td>сортировщик скорлупы (у Эпикантуса)</td><td>Колупание</td><td>4</td></tr>
<tr><td>помощник выгульщика булыжников (у таинственного незнакомца — не спрашивай, как стать таким же)</td><td>Бобылеведение</td><td>3</td></tr>
<tr><td>щекотатель в подпольном клубе — в темноте, проступок перед Ею</td><td>Щекотка</td><td>8</td></tr>
<tr><td>управляющий совянами</td><td>Сыворотка общества</td><td>6</td></tr>
<tr><td>дегустатор мясного хлеба (у крепышей)</td><td>Крепость</td><td>3</td></tr>
<tr><td>наёмный едок</td><td>Крепость</td><td>3</td></tr>
<tr><td>трубочист-зубочист</td><td>Трубоведение</td><td>5</td></tr>
<tr><td>заместитель колбасного стража</td><td>Коканье</td><td>5</td></tr></table></div>
<h3>Поручения</h3>
<p>Основной источник: {{fantasmogor|Фантасмогор}} платит за доставку солений, {{panlomeo|Понполомео}} — за ложки, {{edgar|Птозный Эдгар}} — за письма. Плата 10–30 кукичей и часто +1 к [[q-attitude|отношению]].</p>
<h3>Продажа добычи</h3>
<p>Зазеркальцы покупают за половину цены каталога. Торг — встречное Кукичество: каждый лишний успех +10% цены в твою пользу, не дороже полной.</p>`},
{id:"q-real",sec:"mirror",st:"ok",t:"Реальный мир",lead:"Сессия — это вечер наяву, ночь в Зазеркалье и утро наяву. Наяву коротко, бытово и без монстров.",b:`
<h3>Вечер</h3>
<ul><li><b>Покупки</b> за рубли — это подготовка к Зазеркалью: шапка станет бурлешкой, зелёнка — склянкой ведьмы ([[gear-home]], [[items]]).</li>
<li><b>Дорога до ПВЗ</b> — по городу, иногда в другой ПВЗ, если в своём работник на взводе.</li>
<li><b>Мимо работника</b> — срабатывает [[q-pvz|шкала подозрения]].</li></ul>
<h3>Утро</h3>
<ul><li><b>Выход из примерочной</b> — снова работник и шкала.</li>
<li><b>Последствия ночи:</b> вернулось то, что держал, засыпая; остальное пропало и наяву; кукичи стали шоколадными монетами.</li>
<li>Утренний выход — всегда полный отдых. Застрявший в Зазеркалье не выходит: утро для него не наступает ([[time]]).</li></ul>
<h3>Вред наяву</h3>
<ul><li><b>Усталость:</b> странности наяву (1 за попытку, сложность +1), [[reroll|переброс]], беготня от охраны, поиски другого ПВЗ через весь город, долгий день перед входом — если персонаж так заявил.</li>
<li><b>Здоровье:</b> упал, подрался с охраной, простудился — [[cond-ill|простуда]] есть в обоих мирах. Натворившее [[q-reflection|отражение]] — к6 у ведущего.</li>
<li>Странность на глазах у людей — ещё и очко [[q-pvz|подозрения]].</li></ul>
<h3>Рубли и люди</h3>
<ul><li>В начале каждой сессии у каждого 300 ₽ на вещи. Больше — за логичную заявку: «взял подработку», «занял у соседа».</li>
<li><b>Сквозные персонажи:</b> работник ПВЗ, по желанию — соседи и знакомые. Через них Зазеркалье «просачивается»: кто-то тоже видел Поленыча в зеркале.</li></ul>`},
{id:"q-reflection",sec:"mirror",st:"ok",t:"Призыв отражения",lead:"Отражение появляется, только если его призвать странностью. Учит Поленыч.",b:`
<p>Без странности отражения нет: персонаж уходит в зеркало целиком, и работник ПВЗ видит пустую примерочную — см. [[enter]] и [[pvz-worker]].</p>
<p>Странность [[odd-special|Призвать отражение]] — сложность 2, основное действие. Её творят уже в Зазеркалье.</p>
<ul><li><b>Двойники для ПВЗ.</b> Наяву из примерочной того ПВЗ выходят двойники всех, кто вошёл через него вместе с тобой — не только твой. Они проживают за вас ночь; утром двойники заходят в примерочную, а выходите уже вы. Работник ничего не заподозрит.</li>
<li><b>Альтернативное использование</b> — двойник на раунд: ты [[cond-buff|С двойником]], первая атака приходится в него.</li>
<li><b>Отдача:</b> отражение что-то натворило — ведущий бросает к6 и решает, что именно.</li></ul>`},
{id:"q-morale",sec:"act",st:"ok",t:"Храбрость и бегство",lead:"У каждого противника в карточке есть храбрость: храбрый, нормальный или трусливый. Она решает, когда он бежит и когда не нападает.",b:`
<div class="tbl"><table><tr><th>Храбрость</th><th>Бежит</th><th>Не нападает</th></tr>
<tr><td><b>Храбрый</b></td><td>не бежит — уходит только по своей воле</td><td>—</td></tr>
<tr><td><b>Нормальный</b></td><td>если остался один из своих или его [[act-main|отпугнули]] тем, чего он «Боится»</td><td>в одиночку</td></tr>
<tr><td><b>Трусливый</b></td><td>если повержена половина его стороны или больше</td><td>если их меньше трёх</td></tr></table></div>
<ul><li><b>Бегущий</b> тратит ход на движение прочь. Догнать его — [[q-chase|погоня]].</li>
<li><b>Бобыли</b> от коканья не бегут: кокнутый бобыль окумекивается ([[kokanye]]).</li>
<li><b>Пощада.</b> Догнав беглеца, его можно не добивать, а пощадить — чтобы расспросить, договориться, взять с него услугу или обещание. Пощажённый до конца сцены не нападает.</li>
<li><b>Добыча.</b> Убегая, противник ничего не роняет. «Добычу» из карточки получают, только если догнать и добить; пощажённый может отдать её сам — по договорённости.</li></ul>
<p>См. также: [[q-foes]], [[distance]].</p>`},
{id:"kokanye",sec:"act",st:"ok",t:"Коканье и окумекивание",lead:"Бобыль — мелочь: любой урон от Коканья кокает его. Но кокнутые окумекиваются.",b:`
<p>Из лора: 68% кокнутых бобылей окумекиваются через полминуты и становятся «ещё бобылистей»; остальные 32% — через срок от 10 минут до часа, и чем дольше срок, тем они смирнее. Реутеня кокнуть нельзя.</p>
<ul><li>Любой урон от Коканья кокает бобыля.</li>
<li>После коканья к6: 3–6 — встаёт в следующем раунде с +1 кубиком (не больше +2); 1–2 — лежит до конца сцены, потом смирный.</li>
<li>Пока кокнутый лежит, от него можно уйти без броска.</li></ul>
<p>Так это правило записано в карточке бобылей в атласе. Общие правила атаки — [[act-kok]], [[damage]].</p>`},
{id:"q-foes",sec:"act",st:"ok",t:"Противники",lead:"У противников те же характеристики и навыки, что у путников, и трек Лица. Карточки — в атласе.",b:`
<p>Каждое существо из атласа — персонаж, вид, сообщество, сила — имеет карточку зазеркальца. У видов и сообществ карточка описывает обычного представителя.</p>
<div class="tbl"><table><tr><th>Ранг</th><th>Лицо</th><th>Кто это</th></tr>
<tr><td>мелочь</td><td>1</td><td>бобыль, кокша, пескарь: падает от первого успешного удара</td></tr>
<tr><td>обычный</td><td>3</td><td>крепыш, майонезная тётенька, синий ящер</td></tr>
<tr><td>сильный</td><td>5–6</td><td>Сатор Арепыч, многоликий Филипп, коленыч</td></tr>
<tr><td>легендарный</td><td>8+</td><td>Оно, Она, Видус, братья Мишеневы — обычно не для драки</td></tr></table></div>
<ul>
<li><b>Характеристики</b> обычно 1–5, но предел 5 — только для путников: сильным и легендарным ведущий при необходимости даёт больше.</li>
<li><b>Броски:</b> те же шесть характеристик и шестнадцать навыков; неуказанные навыки — уровень 0. Защита — Прыть + [[act-defense|броня]], броня указана в свойствах.</li>
<li><b>Урон</b> идёт по Лицу. На нуле противник повержен: падает или теряет лицо — по смыслу сцены. Бежать он может и раньше — по своей [[q-morale|храбрости]].</li>
<li><b>Разваристости нет:</b> [[cond-weak|Разварен]] даёт противнику −1 кубик, копится до −2.</li>
<li><b>Темнота:</b> агрессивные бросают на кубик больше во встречных — [[night]].</li>
<li><b>Без боя:</b> строки «Любит · задобрить» и «Боится · отпугнуть» — для действий [[act-main|Задобрить и Отпугнуть]]. Дружелюбность, разумность и общение подсказывают, как вести разговор.</li>
<li><b>Приёмы</b> — особые действия существа; тип действия, если не сказано иное, — основное. Приём без навыка бросают как голую характеристику: успех на 5–6.</li></ul>
<p>Бобыли — особый случай: [[kokanye]].</p>`},
{id:"q-growth",sec:"char",st:"ok",t:"Рост персонажа",lead:"Опыт — это печати конгресса путешественников. Три печати — новый уровень, всего уровней семь.",b:`
<p>Печать ставится за цель из ведомости — пережитое в Зазеркалье. Каждую печать путник получает один раз. Ведомость — общий лист на группу, с двух сторон: слева цели, сверху имена путников, клетки квадратные — под печать. Её печатают из «Распечаток»: [[pr-seals]].</p>
<div class="tbl"><table><tr><th>Уровень</th><th>Звание</th><th>Награда</th></tr>
<tr><td>1</td><td>Странник</td><td>+1 характеристика, +1 навык</td></tr>
<tr><td>2</td><td>Путник</td><td>+2 навыка</td></tr>
<tr><td>3</td><td>Бывалый</td><td>+1 характеристика, +2 навыка</td></tr>
<tr><td>4</td><td>Землепроходец</td><td>+2 характеристики, +1 навык</td></tr>
<tr><td>5</td><td>Первопроходец</td><td>+3 навыка</td></tr>
<tr><td>6</td><td>Действительный член конгресса</td><td>+1 характеристика, +2 навыка</td></tr>
<tr><td>7</td><td>Почётный член конгресса</td><td>+2 характеристики, +2 навыка</td></tr></table></div>
<ul><li><b>Когда:</b> награда применяется на ближайшем [[rest|отдыхе]].</li>
<li><b>Навык</b> за уровень поднимается не выше 2. Уровень 3 — мастерство — только у учителя за услугу, как и [[odd-learn|странности]].</li>
<li><b>Характеристика</b> — не выше 5: если одна уже на пределе, поднимают другую. Крепость поднимает максимум Здоровья и Лица, Странность — число странностей.</li>
<li><b>Общие цели</b> — те, что группа проходит вместе. На ведомости у них одна широкая клетка в рамке: туда ставят одну печать, и она засчитывается каждому путнику группы — даже тому, кто в тот раз отсутствовал. Новичок получает все общие печати, которые у группы уже есть, — и по их числу начальный уровень (3 печати — уровень, награды применяются при создании).</li>
<li><b>Список целей открытый:</b> ведущий вписывает новые в пустые строки и решает, личная цель или общая. На ведомости личные цели и пустые строки — на лицевой стороне, общие — на обороте.</li></ul>
<div class="tbl"><table><tr><th>№</th><th>Цель</th><th>Печать</th></tr>
<tr><td>1</td><td>Побывать в сладком хлеву</td><td>личная</td></tr><tr><td>2</td><td>Стать цыплёнком у Видуса — и выбраться</td><td>личная</td></tr><tr><td>3</td><td>Предстать перед Истуканусом и ответить</td><td>личная</td></tr><tr><td>4</td><td>Увидеть Оно или Её воочию</td><td>личная</td></tr><tr><td>5</td><td>Потерять лицо и найти новое</td><td>личная</td></tr><tr><td>6</td><td>Дослушать историю говорящего холма</td><td>личная</td></tr><tr><td>7</td><td>Впечатлить Магогу</td><td>личная</td></tr><tr><td>8</td><td>Приручить кокшу</td><td>личная</td></tr><tr><td>9</td><td>Совершить шалость по заданию синих ящеров</td><td>личная</td></tr><tr><td>10</td><td>Отведать гычи бабы Жули</td><td>личная</td></tr><tr><td>11</td><td>Выиграть ставку на забеге</td><td>личная</td></tr><tr><td>12</td><td>Выбраться из старого лабиринта с лицом</td><td>личная</td></tr><tr><td>13</td><td>Выучить странность у учителя</td><td>личная</td></tr><tr><td>14</td><td><i>пустая строка</i></td><td></td></tr><tr><td>15</td><td><i>пустая строка</i></td><td></td></tr><tr><td>16</td><td>Пройти за третий поворот колбасного стража</td><td>общая</td></tr><tr><td>17</td><td>Добраться до острова Лавана</td><td>общая</td></tr><tr><td>18</td><td>Увидеть спектральный колодец</td><td>общая</td></tr><tr><td>19</td><td>Побывать в осколке ещё того Зазеркалья</td><td>общая</td></tr><tr><td>20</td><td>Войти в ворота медного града</td><td>общая</td></tr><tr><td>21</td><td>Пережить темноту в сумеречной роще</td><td>общая</td></tr><tr><td>22</td><td>Пройти подземные трубы насквозь</td><td>общая</td></tr><tr><td>23</td><td>Побывать на приёме у господина Кривина</td><td>общая</td></tr><tr><td>24</td><td>Вернуть ложку, украденную Казимиром</td><td>общая</td></tr><tr><td>25</td><td>Попасть в подпольный щекоточный клуб</td><td>общая</td></tr><tr><td>26</td><td>Найти Бутыльона и не осушить его</td><td>общая</td></tr><tr><td>27</td><td>Создать битубисас</td><td>общая</td></tr></table></div>`},
{id:"q-companions",sec:"char",st:"ok",t:"Спутники",lead:"Путник может водить с собой одного спутника. Спутник всегда даёт подготовку к своему навыку и умеет что-то своё.",b:`
<ul><li><b>Кто.</b> Основные спутники — кокши, бобыли и грибы. Другие мелкие существа — если постараться; сильные — исключение.</li>
<li><b>Сколько.</b> Один спутник на путника — его вписывают в блок «Спутник» на стороне Я листа. Свой пескарь ([[gear-home]]) — не спутник: он носит записки и места не занимает.</li>
<li><b>Как заполучить.</b> Кокшу приручают; остальных — отношение «доброжелателен» или «друг» ([[q-attitude]]) и услуга. Некоторые вещи из дома за зеркалом сами оживают спутниками: органайзер — благородным пакетом, фигурка лягушки — жабцем ([[gear-home]]).</li>
<li><b>Подготовка — пассивная.</b> Пока спутник рядом, путник [[prep|подготовлен]] ко всем проверкам его навыка. С другой подготовкой не складывается.</li>
<li><b>Особое свойство</b> у каждого своё — в таблице. Если это действие, путник тратит на него своё [[act-move|движение]].</li>
<li><b>Лицо 1.</b> На нуле спутник сбегает и возвращается после [[rest|отдыха]]. Бобыли сначала окумекиваются.</li>
<li><b>Договорённость</b> держится, пока путник не отпустит спутника или не провинится перед ним: ударил, бросил в беде, сделал то, чего тот «Боится». Провинился — спутник уходит домой, [[q-attitude|отношение]] −1.</li>
<li><b>Между ночами</b> спутник ждёт там, где путник уснул. Можно отпустить его домой — тогда он ждёт в своём месте обитания (по карточке), и за ним надо зайти.</li>
<li><b>Наяву спутников нет:</b> существа Зазеркалья не уходят через сон — только через [[q-exit|выход]].</li>
<li><b>Не уживаются:</b> грязун и мигун; Кадаврик и бахромка; Вандух и Ёксель-Моксель; жабец и Акакий; грибы — рядом с Идибиксом.</li></ul>
<div class="tbl"><table><tr><th>Спутник</th><th>Подготовка</th><th>Особое</th></tr><tr><td colspan="3"><b>Кокши</b> — приручают: невыдержанный сыр Джо и чесать за ухом 20 раз в минуту — цель «Приручить кокшу».</td></tr><tr><td>{{kokshi|Кокша}}</td><td>Хождение в копытах</td><td>Приносит слюду: раз за сессию — кусочек {{slyuda|слюды}}. Пуглива: спугнули — убегает без броска.</td></tr><tr><td>{{lyonya|Лёня-Мелкозуб}}</td><td>Хождение в копытах</td><td>«Разведка»: сходит туда, куда путнику не пройти, и вернётся со сведениями.</td></tr><tr><td>{{chertiliy|Чертилий}}</td><td>Колупание</td><td>«Стащить»: раз за сцену утащит у цели мелкий предмет. Не выносит тётю Варю.</td></tr><tr><td>{{shpendel|Шпендель}}</td><td>Лицедейство</td><td>Эхо: голос хозяина слышно до дальней дистанции — можно говорить «из другого места».</td></tr><tr><td>{{kadavrik|Лесной Кадаврик}}</td><td>Знахарство</td><td>«Каламбур»: цель Ошарашена. Съест бахромку, если та рядом.</td></tr><tr><td>{{gocheetka|Гычеедка}}</td><td>Варево</td><td>Чует гычу и съестное. Но её выдаёт жареный запах: прятаться рядом с ней — на кубик меньше.</td></tr><tr><td>{{manya|Маня Понич}}</td><td>Сыворотка общества</td><td>Вхожа к Алевтине: подготовка к разговору с ней и всё о ней. Больше ни о чём не говорит.</td></tr><tr><td colspan="3"><b>Бобыли</b> — общее свойство — окумекивание: на нуле Лица бобыль не сбегает, а бросает к6 — на 3–6 встаёт через раунд.</td></tr><tr><td>{{bobyli|Лесной бобыль}}</td><td>Бобылеведение</td><td>Только окумекивание.</td></tr><tr><td>{{vanduh|Вандух}}</td><td>Бобылеведение</td><td>Только окумекивание. Не уживается с Ёкселем-Мокселем.</td></tr><tr><td>{{tsupol_zvak|Цуполь-Звак}}</td><td>Бобылеведение</td><td>Только окумекивание.</td></tr><tr><td>{{svetogar|Светогар}}</td><td>Бобылеведение</td><td>Только окумекивание.</td></tr><tr><td>{{cherny_ekler|Чёрный эклер}}</td><td>Летопись</td><td>«История вперемешку»: собеседник не уйдёт до конца сцены. Донимает историями и хозяина.</td></tr><tr><td>{{gyzlik|Гузлик}}</td><td>Лицедейство</td><td>«Анекдот»: все, кто способен смеяться, Ошарашены. Фантасмогор недоволен, что увели звезду цирка.</td></tr><tr><td>{{artyom|Летописный Артём}}</td><td>Летопись</td><td>«Новая теория»: ответ на любой вопрос — но на 1–3 по к6 перепутал.</td></tr><tr><td>{{shnekishmyak|Шнеки-Шмяк}}</td><td>Трубоведение</td><td>Свой у входа в трубы: с ним пропускают без уловок.</td></tr><tr><td>{{yoksel|Ёксель-Моксель}}</td><td>Коканье</td><td>Желейный князь уважает тех, кто его не путает: подготовка к разговору с князем.</td></tr><tr><td>{{reuten|Реутень}}</td><td>Коканье</td><td>Только если очень постараться: броня 3, разгоняет осов без броска.</td></tr><tr><td colspan="3"><b>Грибы</b> — общий риск: на всё грибное зарится {{idiks|Идибикс}}.</td></tr><tr><td>{{grib_bytovik|Гриб-бытовик}}</td><td>Сыворотка общества</td><td>Любимец майонезных: к хозяину они не придираются.</td></tr><tr><td>{{bahromka|Бахромка}}</td><td>Знахарство</td><td>Лакомство Идибикса и Кадаврика — рядом с ними её надо стеречь.</td></tr><tr><td>{{sinyachok|Синячок}}</td><td>Хождение в копытах</td><td>Следует правилам Её: в темноте первая метка Её за ночь хозяину не ставится.</td></tr><tr><td>{{gruzd|Похомистый груздь}}</td><td>Щекотка</td><td>«Похомить»: цель Колосится.</td></tr><tr><td>{{pufik|Пуфик принцессы Пармезанны}}</td><td>Кукичество</td><td>«Присесть»: раз за сессию передышка — снять 1 Разваристость.</td></tr><tr><td>{{akakiy|Акакий Куролесов}}</td><td>Знахарство</td><td>«Приют»: с ним в роще отдыхают без дозора. Пуглив: от жабьего кваканья и громких звуков уходит.</td></tr><tr><td>{{arhivarius|Грибной архивариус}}</td><td>Летопись</td><td>Подготовка и к поиску дороги (Трубоведение) — но на 1–2 по к6 лево и право перепутаны.</td></tr><tr><td colspan="3"><b>Прочие мелкие</b> — если постараться.</td></tr><tr><td>{{gryazuny|Грязун}}</td><td>Колупание</td><td>«Под прикрытием»: выдаёт себя за бобыля. Нападает на мигунов и всё на них похожее — вплоть до Диода.</td></tr><tr><td>{{megune|Мигун}}</td><td>Механика</td><td>«Вспышка»: светит в темноте, цель Ошарашена. Грязуны на него охотятся, грязь его гасит.</td></tr><tr><td>{{gromiki|Громик}}</td><td>Коканье</td><td>Если сильно постараться. Будит спящих — ночью не нужен дозор; но уснуть, чтобы вернуться, можно только вдали от него.</td></tr><tr><td>{{rudlo|Рудло}}</td><td>Хождение в копытах</td><td>Подслушивает: раз за сцену — записка с подсказкой о ближайшей опасности.</td></tr><tr><td>{{fuks|Фукс}}</td><td>Летопись</td><td>Раз за сессию — «да» или «нет» на один вопрос.</td></tr><tr><td>{{lesnoy_kurbak|Лесной Курбак}}</td><td>Хождение в копытах</td><td>Ночная тропа: ночью в лесу ведёт короткой дорогой — переход без броска.</td></tr><tr><td>{{malysh|Малыш Провансаллы}}</td><td>Сыворотка общества</td><td>Ночью майонезные тётеньки не придираются.</td></tr><tr><td>{{nikolay|Попугай Николай}}</td><td>Шепоток</td><td>«Как нельзя кстати»: раз за сцену — подготовка к любой проверке. В конце сцены к6: на 1–3 его прогнали — вернётся после отдыха.</td></tr><tr><td>{{malchik_pedal|Мальчик-педаль}}</td><td>Хождение в копытах</td><td>«Подмога»: раз за сцену — подготовка ещё к одной проверке в дороге.</td></tr><tr><td>{{vilki|Вилка}}</td><td>Трубоведение</td><td>Знает вход в логово ведьм под Кривой горой. На вилок охотится Казимир.</td></tr><tr><td>{{svetlyachki|Светлячок}}</td><td>Трубоведение</td><td>Рядом с ним все Светятся: видно и вам, и вас.</td></tr><tr><td>{{petuhi|Петух}}</td><td>Сыворотка общества</td><td>Поёт серенады носителю шапца: тот Воодушевлён.</td></tr><tr><td>{{kukushki|Кукушка}}</td><td>Летопись</td><td>Знает все слухи — и всё доносит Эдгару.</td></tr><tr><td>{{pakety|Благородный пакет}}</td><td>Сыворотка общества</td><td>«Хранение»: +3 строки пожитков; то, что лежит в нём, нельзя украсть или выбить. Наяву — органайзер для настольной игры.</td></tr><tr><td>{{zhabcy|Жабец}}</td><td>Чак-чак</td><td>Сторожит: хозяина не застать врасплох. Квакнет по команде — пугливые Напуганы (Акакий тоже). Наяву — фигурка лягушки.</td></tr><tr><td>{{laika|Лайка}}</td><td>Бобылеведение</td><td>Сторож: дозор с ней — с подготовкой. Пока Лайка с путником, жадности на лайке не на чем подъехать.</td></tr></table></div>`},

    const off=$("pr-off");off.innerHTML=d.html();const pages=[...off.querySelectorAll(".pp")];
    const pdf=new jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
    for(let i=0;i<pages.length;i++){const pg=pages[i];pg.style.boxShadow="none";const cv=await html2canvas(pg,{scale:3,backgroundColor:"#ffffff",logging:false});if(i)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",.9),"JPEG",0,0,210,297)}
    off.innerHTML="";
    await saveFile(d.file,pdf.output("blob"));note.textContent="PDF готов.";
  }catch(err){const c=err&&err.code;note.textContent=c==="declined"?"Сохранение отменено.":"Не получилось собрать PDF. Попробуйте ещё раз."}
  finally{b.disabled=false;b.textContent=lbl}});
function show(id,scroll=true){
  const a=byId[id]||order[0];cur=a.id;
  const i=order.indexOf(a),prev=order[i-1],next=order[i+1];
  $("content").innerHTML=`<article>
    <div class="crumbs"><span>${a.no}. ${SEC[a.sec]}</span></div>
    <h1>${a.t}</h1><p class="lead">${html(a.lead)}</p>${html(a.b)}
    <div class="side-inline">${sideHTML(a)}</div>
    <div class="pager">${prev?`<a href="#${prev.id}" data-go="${prev.id}"><small>← назад</small>${prev.t}</a>`:"<span></span>"}${next?`<a href="#${next.id}" data-go="${next.id}" style="text-align:right"><small>дальше →</small>${next.t}</a>`:""}</div></article>`;
  $("aside").innerHTML=sideHTML(a);
  mountPrint();
  renderNav();
  if(scroll){$("content").scrollTop=0;if(innerWidth<=760)window.scrollTo(0,0)}
  $("nav").classList.remove("open");$("navtoggle").setAttribute("aria-expanded","false");
  try{history.replaceState(null,"","#"+a.id)}catch(e){}
  try{localStorage.setItem("zz-rules-last",a.id)}catch(e){}
}
document.addEventListener("click",e=>{const l=e.target.closest("[data-go]");if(!l)return;e.preventDefault();$("sugg").hidden=true;show(l.dataset.go)});
$("navtoggle").addEventListener("click",()=>{const o=$("nav").classList.toggle("open");$("navtoggle").setAttribute("aria-expanded",o)});

// поиск
const q=$("q"),sugg=$("sugg");let hits=[],hi=0;
q.addEventListener("input",()=>{const v=q.value.trim().toLowerCase().replace(/ё/g,"е");
  hits=v?A.map(a=>[a,a.t.toLowerCase().replace(/ё/g,"е").includes(v)?2:a.text.includes(v)?1:0]).filter(x=>x[1]).sort((x,y)=>y[1]-x[1]).map(x=>x[0]).slice(0,10):[];hi=0;
  sugg.hidden=!hits.length;sugg.innerHTML=hits.map((a,i)=>`<a href="#${a.id}" data-go="${a.id}" class="${i?"":"on"}">${a.t}<small>${SEC[a.sec]}</small></a>`).join("")});
q.addEventListener("keydown",e=>{if(!hits.length)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();hi=(hi+(e.key==="ArrowDown"?1:hits.length-1))%hits.length;[...sugg.children].forEach((x,i)=>x.classList.toggle("on",i===hi))}
  if(e.key==="Enter"){show(hits[hi].id);sugg.hidden=true;q.blur()}
  if(e.key==="Escape")sugg.hidden=true});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))sugg.hidden=true});

let start=(location.hash||"").slice(1);
if(!byId[start]){try{start=localStorage.getItem("zz-rules-last")||""}catch(e){start=""}}
show(byId[start]?start:"worlds",false);
</script>
