<style>
/* Справочник ведущего: оглавление слева, статья в центре, связи справа — как картотека с перекрёстными ссылками */
:root{

}

  --ok:#6fd398; --ok-soft:#1d3327; --draft:#e5b45a; --draft-soft:#3a2f17; --open:#f08aab; --open-soft:#3d1f2a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15151b; --panel:#1d1d25; --ink:#e7e5f0; --muted:#9d9ab0; --line:#33333f; --accent:#a99bff; --accent-soft:#2a2645;
  --ok:#6fd398; --ok-soft:#1d3327; --draft:#e5b45a; --draft-soft:#3a2f17; --open:#f08aab; --open-soft:#3d1f2a; color-scheme:dark}

.pp-tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt;line-height:1.15}
.pp-tbl th,.pp-tbl td{border:.25mm solid #c3c2cf;padding:0 1.5mm}
.pp-tbl thead th{vertical-align:bottom;font:400 7.4pt/1.2 "Forum",serif;letter-spacing:.14em;text-transform:uppercase;color:#686676;text-align:left;padding-bottom:1.2mm}
.pp-tbl td.n{text-align:right;font:400 9pt/1 "Yeseva One",serif;color:#5b4bb7}
.pp-tbl tr.blank td.g{color:#c3c2cf}
.pp-set{display:flex;flex-direction:column;gap:8mm;width:210mm}
.pp-sq tbody tr{height:15mm}
.pp-sq td{vertical-align:middle}
.pp-sq td.g{font-size:11pt;line-height:1.2}
.pp-sq th.nm{border-bottom:.45mm solid #1c1b24}
.pp-sq td.c::after{width:12mm!important;height:12mm!important;border-color:#e0dfe8!important}
.pp-turn{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:6mm;font:400 7.4pt/1.3 "Forum",serif;letter-spacing:.14em;text-transform:uppercase;color:#686676}

.pp-turn i.lg-g{width:8mm;border-radius:.8mm;border:.35mm solid #5b4bb7}
.pp-sq tr.grp td.g em{display:block;font:400 6.6pt/1 "Forum",serif;letter-spacing:.2em;text-transform:uppercase;color:#5b4bb7;font-style:normal;margin-top:1.2mm}
.pp-sq td.gc{padding:0;position:relative;vertical-align:middle}
.pp-sq td.gc .gs{position:absolute;inset:1.1mm;border:.35mm solid #5b4bb7;border-radius:1.4mm;display:flex;align-items:center;justify-content:center}
.pp-sq td.gc .gs i{width:10.6mm;height:10.6mm;border:.2mm dashed #cfcfd8;border-radius:50%}
.pp-tbl td.c{position:relative}
.pp-tbl td.c::after{content:"";position:absolute;inset:0;margin:auto;width:4.6mm;height:4.6mm;border:.2mm dashed #cfcfd8;border-radius:50%}

.pp-foot{display:grid;grid-template-columns:1.25fr 1fr;gap:5mm;font-size:8.4pt;line-height:1.3}

.pp-foot td:first-child i{font:400 8.6pt/1 "Yeseva One",serif;font-style:normal;margin-right:1.2mm}

#pr-off{position:fixed;left:-10000px;top:0;pointer-events:none}

/* выдвижная карточка атласа */
.ad-back{position:fixed;inset:0;background:rgba(10,10,20,.35);z-index:40}
.ad{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 40px -20px rgba(0,0,0,.35)}
.ad-bar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font:12px var(--f-mono)}

.ad-body{overflow:auto;padding:16px 18px 30px;flex:1}
.ad-body h2{font:400 26px/1.15 var(--f-disp);margin:2px 0 6px}

.ad-body img.pt{display:block;width:100%;max-height:300px;object-fit:cover;object-position:center top;border-radius:8px}
.ad-body figure{margin:0 0 12px}.ad-body figcaption{font:12px var(--f-mono);color:var(--muted);margin-top:4px}

.ad-st{font:11px var(--f-mono);padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

.ad-rel{list-style:none!important;padding:0!important}

.atl{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor}.atl::after{content:"↗";font-size:.7em;margin-left:1px;opacity:.6}
.badge{font:11px var(--f-mono);padding:2px 8px;border-radius:99px;letter-spacing:.04em}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.draft{background:var(--draft-soft);color:var(--draft)}.badge.open{background:var(--open-soft);color:var(--open)}
article h1{font:400 36px/1.15 var(--f-disp);margin:8px 0 6px;text-wrap:balance}
.lead{font-size:18px;color:var(--muted);margin:0 0 22px}
article h3{font:400 21px/1.25 var(--f-disp);margin:28px 0 8px}
article p{margin:0 0 12px}
article ul,article ol{margin:0 0 14px;padding-left:1.3em}
article li{margin:0 0 5px}
a.ref{color:var(--accent);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}

.tbl{overflow-x:auto;margin:6px 0 16px}
.tbl.nw td{white-space:nowrap}
table{border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th{font:11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:400}
th,td{padding:6px 14px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.rule{border-left:3px solid var(--accent);background:var(--panel);padding:12px 16px;border-radius:0 8px 8px 0;margin:6px 0 16px}
.rule p:last-child{margin:0}
.note{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:20px}
aside h3{font:11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:400}
aside ul{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:4px}
aside a{color:var(--accent);text-decoration:none;font-size:15px}
aside .empty{color:var(--muted);font-size:14px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}

.navtoggle{display:none}
@media (max-width:1100px){main{grid-template-columns:250px minmax(0,1fr)}aside{display:none}.content .side-inline{display:block}}

}
</style>

/* Статьи. В тексте [[id]] или [[id|текст]] — ссылка на другую статью. Статус: ok — принято, draft — черновик, open — открытый вопрос. */
const SECTIONS=[
 ["cheat","Шпаргалки"],["print","Распечатки"],["base","Основы"],["mirror","Между мирами"],["order","Порядки Зазеркалья"],["odd","Странности"],["cond","Состояния"],["gear","Предметы"],["check","Проверки"],["fight","Конфликт и урон"],["act","Действия"],["state","Состояния и восстановление"],["char","Персонаж"],["open","Открытые вопросы"]];

const A=[
{id:"sh-roll",sec:"cheat",st:"ok",t:"Бросок",lead:"Пул — характеристика навыка в текущем мире. Успех — кубик не ниже порога.",b:`
<div class="tbl"><table><tr><th>Что бросаем</th><th>Успех на</th></tr>
<tr><td>навык 0</td><td>6</td></tr><tr><td>навык 1, голая характеристика, защита</td><td>5–6</td></tr><tr><td>навык 2</td><td>4–6</td></tr><tr><td>навык 3</td><td>4–6, шестёрка = два успеха</td></tr></table></div>
<div class="tbl"><table><tr><th>Нужно успехов</th><th>Задача</th></tr><tr><td>1</td><td>обычная</td></tr><tr><td>2</td><td>трудная</td></tr><tr><td>3</td><td>почти невозможная</td></tr></table></div>
<ul>
<li><b>Встречный:</b> бросают обе стороны, больше успехов — победа, ничья — защищающемуся. [[opposed]]</li>
<li><b>Групповая:</b> успехи всех складываются, сложность × число участников. [[q-group]]</li>

<li><b>Переброс:</b> +1 Усталость / Разваристость — перебросить все неудачные кубики, раз за бросок. [[reroll]]</li>
<li><b>Усталость / Разваристость:</b> 4–5 — −1 кубик, 6 — один кубик и без переброса. [[fatigue]]</li>
<li><b>Странность:</b> пул Странность, успех 5–6, стоит 1 Разваристость (на 6 — 1 Лицо); наяву сложность +1. [[odd-rules]]</li>
<li><b>Темнота:</b> агрессивные обитатели +1 кубик во встречных. [[night]]</li></ul>

<tr><td><i class="atype at-react">реакция</i></td><td>удар вдогонку (враг ушёл с ближней) · прикрыть союзника · странность-реакция</td></tr></table></div>
<div class="tbl"><table><tr><th>Действие</th><th>Бросок</th><th>Против</th><th>Итог</th></tr>
<tr><td>Кокнуть</td><td>Коканье</td><td>Прыть + броня</td><td>урон = лишние успехи</td></tr>
<tr><td>Колупнуть</td><td>Колупание</td><td>Прыть + броня</td><td>Опутан / отнял / обшарил</td></tr>
<tr><td>Кинуть</td><td>Чак-чак</td><td>Прыть + броня</td><td>урон, до средней</td></tr>
<tr><td>Пощекотать</td><td>Щекотка</td><td>Крепость</td><td>Колосится</td></tr>
<tr><td>Вырваться</td><td>Крепость</td><td>Колупание</td><td>снять Опутан</td></tr>
<tr><td>Удрать — [[q-chase|погоня]]</td><td>Прыть или навык по обстановке</td><td>Прыть преследователя</td><td>перевес +1 к шкале; 3 — оторвался</td></tr>
<tr><td>Заболтать / спрятаться</td><td>Лицедейство / Хождение в копытах</td><td>Чутьё</td><td>поверил / не видит</td></tr></table></div>
<p><b>Дистанции:</b> ближняя — рукой подать, средняя — докинуть камень, дальняя — докуда видно. <b>Первыми</b> ходят начавшие; засада — первый раунд только у них.</p>
<p><b>Храбрость противника:</b> храбрый не бежит; нормальный бежит, оставшись один или отпугнутый, в одиночку не нападает; трусливый бежит, когда повержена половина своих, и не нападает, если их меньше трёх. Догнал беглеца — добей (тогда добыча) или пощади. [[q-morale]]</p>
<p>Подробно — раздел «Действия»: [[act-turn]], [[act-main]], [[act-defense]].</p>`},

<div class="tbl"><table><tr><th></th><th>Наяву</th><th>В Зазеркалье</th></tr>

<tr><td><b>На нуле</b></td><td>без сознания</td><td>безлик: не узнают, Обаяние-навыки как уровень 0, не проснуться, надзор слеп</td></tr>

{id:"sh-order",sec:"cheat",st:"ok",t:"День, темнота и надзор",lead:"Днём смотрит Оно, в темноте — Она. Три метки — наказание.",b:`

<ul><li><b>Незаметно</b> совершить проступок — Хождение в копытах, 1 успех: метки нет. Красные уши — видно без броска.</li>

{id:"sh-worlds",sec:"cheat",st:"ok",t:"Между мирами",lead:"Вошёл вечером через зеркало ПВЗ — вышел утром из него же, через сон.",b:`
<ul>
<li><b>Вход:</b> только вечером, зеркало за ширмой ПВЗ; за тобой выходит Поленыч. [[enter]]</li>
<li><b>Выход:</b> уснуть с намерением проснуться. В опасном месте — Сноходчество, 1 успех. Безликий не просыпается; существам и безликим нужен [[q-exit|выход]]. [[wake]]</li>
<li><b>Время:</b> сколько ни пробыл — наяву одна ночь, просыпаешься выспавшимся. [[time]]</li>

<li><b>Деньги:</b> купюры → пакичи (1 пакич = 2 кукича у честного менялы), монеты → кукичи 1:1, обратно — только шоколадные монеты.</li>
<li><b>Работник ПВЗ:</b> ушёл без отражения +1, вышел утром +1, чертовщина на глазах +1; 8 очков — к6 по таблице. [[q-pvz]]</li>
<li><b>Отдых ≠ сон-возвращение:</b> отдыхать можно, оставаясь в Зазеркалье.</li></ul>`},

{id:"sh-brew",sec:"cheat",st:"ok",t:"Варево и сбор",lead:"Три разных ингредиента — одно варево. Варят на отдыхе и только в Зазеркалье; провал — испорчено, при питье 2к6.",b:`
<p><b>З</b> — зеленика, <b>Г</b> — гриб, <b>П</b> — морковные пятки, <b>Х</b> — хрычи, <b>М</b> — мёд осов, <b>С</b> — скорлупа.</p>
<ul><li><b>Сбор:</b> сцена, Знахарство на 1 успех — успех = ингредиент. З и Г — роща (за грибами к6: на 1 — Идибикс); П и Х — огород Жули (купить или мимо толстомясочки); М — у ос, Хождение в копытах на 2; С — скорлупная яма, Чутьё на 2.</li>
<li><b>Цены:</b> З и Г — 1, П и Х — 2, М — 3, С — 4 кукича. Ингредиент и варево — по строке пожитков.</li>
<li><b>Варка:</b> на отдыхе, сколько угодно раз. У Жули и в логове ведьм — подготовка. Наугад — ведущий описывает вид, эффект узнают, выпив.</li></ul>
<div class="tbl"><table><tr><th>№</th><th>Состав</th><th>Варево</th><th>Сл.</th><th>Что делает</th></tr><tr><td>1</td><td><b>З Г П</b></td><td>Парение над слизнями</td><td>1</td><td>только голуби и пескари</td></tr><tr><td>2</td><td><b>З Г Х</b></td><td>Капли от пучи</td><td>2</td><td>снять Пучу</td></tr><tr><td>3</td><td><b>З Г М</b></td><td>Компот Куролесова</td><td>1</td><td>снять Напуган и Икоту</td></tr><tr><td>4</td><td><b>З Г С</b></td><td>Светлячковая кашица</td><td>1</td><td>Светишься</td></tr><tr><td>5</td><td><b>З П Х</b></td><td>Зелёный бальзам</td><td>3</td><td>+2 Лица</td></tr><tr><td>6</td><td><b>З П М</b></td><td>Зелье бега</td><td>2</td><td>уйти от погони без броска</td></tr><tr><td>7</td><td><b>З П С</b></td><td>Кураж-настойка</td><td>2</td><td>Раскрепощён</td></tr><tr><td>8</td><td><b>З Х М</b></td><td>От ангины ламантинов</td><td>2</td><td>иммунитет на сессию</td></tr><tr><td>9</td><td><b>З Х С</b></td><td>Кислый морс</td><td>1</td><td>Кислый — не съедят</td></tr><tr><td>10</td><td><b>З М С</b></td><td>Распознавание мигунов</td><td>2</td><td>видишь мигуна-бобыля</td></tr><tr><td>11</td><td><b>Г П Х</b></td><td>Гуттаперчевая похлёбка</td><td>2</td><td>Гуттаперчив</td></tr><tr><td>12</td><td><b>Г П М</b></td><td>Сонный взвар</td><td>2</td><td>уснуть без броска</td></tr><tr><td>13</td><td><b>Г П С</b></td><td>Бульон окумекивания</td><td>3</td><td>0 Лица → встаёшь с 1</td></tr><tr><td>14</td><td><b>Г Х М</b></td><td>Горячий хрычовник</td><td>2</td><td>снять Простуду</td></tr><tr><td>15</td><td><b>Г Х С</b></td><td>Панцирный отвар</td><td>3</td><td>В раковине</td></tr><tr><td>16</td><td><b>Г М С</b></td><td>Планы синих ящеров</td><td>2</td><td>узнать шалость</td></tr><tr><td>17</td><td><b>П Х М</b></td><td>Гыча</td><td>1</td><td>−2 Разваристости</td></tr><tr><td>18</td><td><b>П Х С</b></td><td>Дальнее коканье</td><td>2</td><td>Коканье на средней</td></tr><tr><td>19</td><td><b>П М С</b></td><td>Пятки в меду</td><td>1</td><td>Свой</td></tr><tr><td>20</td><td><b>Х М С</b></td><td>Скип</td><td>2</td><td>ящер выполнит просьбу</td></tr></table></div>
<p><b>Испорчено — 2к6 при питье:</b> 2 чужое лицо (не узнают до конца сессии) · 3 ангина ламантинов · 4 Заполиплен · 5 икота · 6 Колосится · 7 +1 Разваристость · 8 красные уши · 9 Неуклюж до отдыха · 10 светишься зелёным · 11 простуда · 12 желтеешь — днём метка Оно.</p>
<p>Подробно — [[q-brew]].</p>`},
{id:"sh-ev-wide",sec:"cheat",st:"ok",t:"События: обширные области",lead:"Дозор не набрал сложность — бросьте 2к6 и сложите. Семь — обычное, два и двенадцать — редкость.",b:`
<p>Сложность дозора — [[rest-watch]]. В темноте +1. Когда событие разрешилось, не-дозорные всё равно отдыхают.</p>
<p class="note" style="margin-top:0;border:0;padding:0"><b>Как читать бой:</b> N — число путников. «Атака 3к6 на 5+» — пул и порог противника; «защита» — Прыть + броня, успех на 5–6; «Лицо» — сколько урона выдерживает. Ссылка ↗ открывает карточку в атласе.</p>
<h3>{{roshcha|Сумеречная роща}}</h3>
<div class="tbl"><table><tr><th>2к6</th><th>Событие</th></tr>
<tr><td>2</td><td><b>{{kolenych|Коленыч}} преклоняет полено.</b> Один, сильный: Лицо 5, полено — атака 5к6 на 5+, цель Опрокинута; защита 4к6. Можно не драться: три шага из {{p29|абзаца 29}} — кинуть войлочные катышки (Чак-чак, 1 успех — он трётся о них и забывает про вас), прислушаться к суставу, убегать зигзагами (Прыть против его Прыти 4к6).</td></tr>
<tr><td>3</td><td><b>{{sovyane|Совяне}} зовут.</b> Тихо будят одного спящего и зовут пройти с ними. Пошёл — к утру вернётся с вестью или тайной рощи; отказал — совяне обижены. Боя нет.</td></tr>
<tr><td>4</td><td><b>{{yagodniki|Ягодники}} окружают стоянку.</b> 2 на каждого путника, мелочь: Лицо 1, окружение — 2к6 на 5+ против Прыти, проиграл — Опутан; защита 2к6. Сыр от Джо (одна порция на всех) — отходят без боя.</td></tr>
<tr><td>5</td><td><b>{{gromiki|Громики}} громыхают.</b> Пара громиков, обычные: Лицо 3, «увлажнить» — 3к6 на 5+ на средней, цель Влажная (урона нет); защита 3к6. Отстают от тех, кто уже Влажный: облиться водой или прыгнуть в лужу — и они уходят ({{p193|абзац 193}}).</td></tr>
<tr><td>6</td><td><b>{{kazimir|Казимир}} у пожитков.</b> Встречный бросок: его Прыть 5к6 на 5+ против Чутья дозорных (сложить). Выиграл он — пропала ложка или мелкая вещь (ведущий выбирает строку пожитков). Поймали — убегает без боя.</td></tr>
<tr><td>7</td><td><b>{{bobyli|Бобыли}} на клокочущий запах.</b> Чаще всего. N + 1 бобыль, мелочь: Лицо 1, Коканье — 3к6 на 5+; защита 2к6. В темноте +1 кубик к атаке. Кокнутый окумекивается — [[kokanye]].</td></tr>
<tr><td>8</td><td><b>{{kukushki|Кукушки}} допрашивают.</b> Стая будит всех и заваливает вопросами. Ведущий задаёт каждому путнику по вопросу о его прошлом наяву — ответы уйдут {{edgar|Птозному Эдгару}}. Не ответил — кукушки не отстанут до утра.</td></tr>
<tr><td>9</td><td><b>{{osy|Осы}} под видом {{kalachi|калачей}}.</b> По одной на путника, обычные: Лицо 3, жало — 3к6 на 5+, урон и цель Разварена; защита 4к6. Распознать заранее — Чутьё на 1 успех: двенадцать крапинок в глазах вместо десяти ({{p114|абзац 114}}). Не лезут в болото.</td></tr>
<tr><td>10</td><td><b>{{petuhi|Петухи}} разбежались.</b> Урчат и плюхаются об землю. Если их не трогать — сами соберутся в пучок и уйдут под мох. Тронул — Ошарашен.</td></tr>
<tr><td>11</td><td><b>{{sator|Сатор Арепыч}} идёт по следу бобылей.</b> Один, сильный: Лицо 6, Коканье 5к6 на 4+ (шестёрка — два), струны — цель Опутана; защита 4к6. Нападёт на того, кто пахнет бобылём (кто дрался с бобылями или ел рядом с ними). Можно объясниться: Сыворотка общества против его Чутья.</td></tr>
<tr><td>12</td><td><b>{{akakiy|Акакий Куролесов}} на ночной прогулке.</b> Видит стоянку и зовёт к себе. Дальше — отдых как в безопасном месте для всех, включая дозорных.</td></tr></table></div>
<h3>{{boloto|Болото}}</h3>
<div class="tbl"><table><tr><th>2к6</th><th>Событие</th></tr>
<tr><td>2</td><td><b>{{knyaz|Желейный князь}} вышел на поверхность.</b> Дозорный в темноте принял его за лужу и наступил. Князь сильный (Лицо 5) и мудрый: извинения — Сыворотка общества на 2 успеха, тогда он даже подскажет дорогу в трубах. Не извинился — князь уходит, а в трубах он вам больше не помощник.</td></tr>
<tr><td>3</td><td><b>{{skrepach|Болотный скрипач}} играет.</b> Звук канифоли зовёт к себе. Каждый спящий бросает Чутьё против его Лицедейства 3к6 на 4+: проиграл — проснулся и бредёт на звук; утром его ищут в тумане.</td></tr>
<tr><td>4</td><td><b>{{muhachi|Мухачи}}.</b> Стоянка оказалась у гнезда. Рой: все до утра Неуклюжи. Можно драться: 3 роя, мелочь, Лицо 1, атака 3к6 на 5+.</td></tr>
<tr><td>5</td><td><b>{{gromiki|Громики}}.</b> Как в роще: пара, «увлажнить» 3к6 на 5+, отстают от Влажных — на болоте облиться нетрудно.</td></tr>
<tr><td>6</td><td><b>{{zubzubych|Зуб Зубыч}} ползёт мимо.</b> Медленно, всю ночь, и не может уйти от компании. Не опасен, но разговорчив — спать рядом нельзя: отдыхают только те, кто отошёл от тропы (сцена на поиск места).</td></tr>
<tr><td>7</td><td><b>{{zhvachniki|Жвачники}} жуют пожитки.</b> 2 на путника, мелочь: Лицо 1, зажевать — 2к6 на 5+, цель Опутана; защита 2к6. Если их не прогнать, к утру одна вещь из пожитков в жвачке: отлепить — Колупание на 1 успех.</td></tr>
<tr><td>8</td><td><b>{{bobyli|Бобыли}} у кромки болота.</b> N + 1, как в роще: Лицо 1, Коканье 3к6 на 5+, защита 2к6.</td></tr>
<tr><td>9</td><td><b>{{zhabcy|Жабцы}} квакают.</b> Всю ночь. Пугливые (Акакий, кокши) Напуганы, путники — нет. Боя нет.</td></tr>
<tr><td>10</td><td><b>{{svetlyachki|Светлячки}}.</b> Назойливо шутят про зеленику и врезаются в деревяшки. Не опасно, зато следующую сцену все Светятся.</td></tr>
<tr><td>11</td><td><b>{{peskari|Пескарь}} с письмом.</b> Письмо {{edgar|Птозного Эдгара}} сбилось с пути. Прочитать — узнать чужую тайну; доставить — услуга Эдгару.</td></tr>
<tr><td>12</td><td><b>{{gosha|Подводный Гоша}} выглянул.</b> Угостите мёдом — до конца сессии Гошу можно позвать один раз: он отгонит многоликого Филиппа или жадность на лайке.</td></tr></table></div>
<h3>{{pustynya|Запретная пустыня}}</h3>
<div class="tbl"><table><tr><th>2к6</th><th>Событие</th></tr>
<tr><td>2</td><td><b>{{pustynny_bobyl|Пустынные бобыли}}.</b> По одному на путника, обычные: Лицо 3, броня 1; бьют первыми — Коканье 4к6 на 4+; не вышло — Колупание 3к6 на 4+ (шестёрка — два), цель Опутана в песке и теряет 1 Лицо за раунд; защита 4к6. Непуганы — отпугнуть нельзя.</td></tr>
<tr><td>3</td><td><b>{{rimma|Костяная Римма}} проверяет.</b> Одна, сильная: Лицо 5, Коканье 4к6 на 4+ (шестёрка — два); защита 4к6. Спрашивает, не к {{kub|кубу}} ли вы. Честный ответ и мирные цели — уходит; соврали — Лицедейство против её Чутья 4к6.</td></tr>
<tr><td>4</td><td><b>{{yashchery|Синие ящеры}} шалят.</b> У спящих поменялись местами две вещи из пожитков (между разными путниками). Поймать шалуна — Чутьё на 2 успеха; пойманный выдаст одну шалость сородичей.</td></tr>
<tr><td>5</td><td><b>{{gorny_krab|Горный краб}} любезничает.</b> Притворяется путником и просится к костру. Распознать — кинуть кукич в сторону: краб ловит его без раздумий. Не распознали — утром пропали кукичи (к6).</td></tr>
<tr><td>6</td><td><b>Ветер с песком.</b> Все без двенадцатикрапинчатых стёкол бросают Крепость, 1 успех: провал — {{pucha|Пуча}}.</td></tr>
<tr><td>7</td><td><b>Жажда.</b> Самое частое. Кто без воды — своей фляги или воды Бутыльона, — отдыхает, но Разваристость не снимает.</td></tr>
<tr><td>8</td><td><b>{{almazy|Алмаз}} вылез из-под земли</b> рядом со стоянкой. Стоит 10 кукичей. Но его заметили и другие: к утру — горный краб или синий ящер (бросьте ещё раз 4 или 5).</td></tr>
<tr><td>9</td><td><b>Караван {{edgar|Птозного Эдгара}}</b> проходит мимо. Можно купить флягу влаги (3 кукича вместо 15) и пыльцу, передать письмо.</td></tr>
<tr><td>10</td><td><b>{{butylon|Бутыльон}}.</b> Пугается жаждущих глаз и уходит в песок. Если у кого-то нет жажды (есть вода), можно спросить о {{zhemchuzhiny|потерянных жемчужинах}} — один честный ответ.</td></tr>
<tr><td>11</td><td><b>{{brunyavy_marsh|Брунявый марш}}</b> перекрыл дорогу. До конца следующей сцены через него не пройти — только в обход.</td></tr>
<tr><td>12</td><td><b>{{brunya|Бруня}} греется у костра.</b> Вызывает крайне тёплые чувства: утром все Воодушевлены.</td></tr></table></div>
<h3>{{oskolok|Осколок ещё того Зазеркалья}}</h3>
<div class="tbl"><table><tr><th>2к6</th><th>Событие</th></tr>
<tr><td>2</td><td><b>Дверь выросла из земли</b> — как во {{do_istukanusa|времена до Истукануса}}. Кто откроет, попадёт в чужой сон (чей — решает ведущий) до утра.</td></tr>
<tr><td>3</td><td><b>{{palchik_medal|Пальчик-медаль}}</b> подсаживается к дозорным с {{kristall|тёмным кристаллом}} и даёт совет. Совет ложный; поверивших ждёт пакость (Лицедейство против Чутья).</td></tr>
<tr><td>4</td><td><b>{{kolenych|Коленыч}}</b> невзлюбил чью-то зелёную походку. Как в роще: Лицо 5, полено 5к6 на 5+, три шага ({{p29|абзац 29}}).</td></tr>
<tr><td>5</td><td><b>Тени уходят от хозяев.</b> До утра у всех −1 кубик к Хождению в копытах. Утром тень возвращается и что-то приносит — одну мелочь из осколка.</td></tr>
<tr><td>6</td><td><b>Местные молча наблюдают.</b> На контакт не идут. Утром у кого-то пропала одна вещь — забрали «на память».</td></tr>
<tr><td>7</td><td><b>Враждебные сущности осколка.</b> Самое частое. По одной на путника, обычные: Лицо 3, атака 3к6 на 5+, защита 3к6; у каждой одна странность (ведущий выбирает из каталога или придумывает).</td></tr>
<tr><td>8</td><td><b>Обыденная вещь тех времён</b> валяется рядом. Ведущий решает, что это и какое у неё свойство.</td></tr>
<tr><td>9</td><td><b>{{dyrki|Дырка от двери}} проснулась.</b> До утра ведёт в другое место — может, туда, куда вам нужно.</td></tr>
<tr><td>10</td><td><b>Ветер несёт сказку.</b> Кто вдохнул (Крепость, провал — вдохнул), знает, чем кончится следующая сцена — как странность «Вдохнуть сказку».</td></tr>
<tr><td>11</td><td><b>{{hrychi|Хрычи}} прилетели</b> погреть хлеб на спине и оставили уголь на память — уголь горит всю следующую ночь без дров.</td></tr>
<tr><td>12</td><td><b>{{kalachi|Калачи}} сами просятся в котелок.</b> Сытный завтрак: все +1 Лицо сверх отдыха (не выше максимума).</td></tr></table></div>`},

{id:"sh-ev-narrow",sec:"cheat",st:"ok",t:"События: узкие области",lead:"Дозор не набрал сложность — бросьте к6.",b:`
<p>Сложность дозора — [[rest-watch]]. В темноте +1. Когда событие разрешилось, не-дозорные всё равно отдыхают.</p>
<p class="note" style="margin-top:0;border:0;padding:0"><b>Как читать бой:</b> N — число путников. «Атака 3к6 на 5+» — пул и порог противника; «защита» — Прыть + броня, успех на 5–6; «Лицо» — сколько урона выдерживает. Ссылка ↗ открывает карточку в атласе.</p>
<h3>{{truby|Подземные трубы}}</h3>
<div class="tbl"><table><tr><th>к6</th><th>Событие</th></tr>
<tr><td>1</td><td><b>{{filipp|Многоликий Филипп}}</b> поднялся из старой части. Один, сильный: Лицо 6, «забрать лицо» — Странность 5к6 на 5+ против Странности цели, урон по Лицу; защита 5к6; в темноте быстр — не убежать. Отступает без броска от брошенного подводного Гоши.</td></tr>
<tr><td>2</td><td><b>{{zubcy|Зубцы}}.</b> Стая из среднего сегмента: 2 на путника, мелочь: Лицо 1, укус — 2к6 на 5+, урон и цель Разварена; защита 3к6.</td></tr>
<tr><td>3</td><td><b>Заплутали меж трёх дёсен.</b> Утром Трубоведение на 2 успеха (можно складывать с подготовкой проводника). Провал — сцена уходит на поиски выхода, +1 Разваристость всем.</td></tr>
<tr><td>4</td><td><b>{{knyaz|Желейный князь}}</b> в проходе. Прыть на 1 успех, чтобы не наступить. Наступили — обижен и уходит; не наступили и поклонились — проводит к выходу (подготовка к Трубоведению).</td></tr>
<tr><td>5</td><td><b>Записка {{rudlo|Рудло}}</b> подсунута под ногу дозорного: он что-то слышал. Ведущий даёт одну подсказку о ближайшей опасности или тайне.</td></tr>
<tr><td>6</td><td><b>Свет сверху.</b> Неподалёку выход на землю — утром выбраться без броска.</td></tr></table></div>
<h3>{{stary_labirint|Старый лабиринт}}</h3>
<div class="tbl"><table><tr><th>к6</th><th>Событие</th></tr>
<tr><td>1</td><td><b>{{filipp|Многоликий Филипп}}</b> — у себя дома. Как в трубах, но в первом раунде всегда ходит первым.</td></tr>
<tr><td>2</td><td><b>Приподнятая темнота.</b> Давит со всех сторон: до утра все Напуганы темнотой — нельзя идти вглубь, только назад.</td></tr>
<tr><td>3</td><td><b>Безликий бродяга</b> — тот, кто не сохранил лицо. Просит лицо и идёт следом. Безобиден, но отпугивает зазеркальцев: −1 кубик к Сыворотке общества, пока он рядом.</td></tr>
<tr><td>4</td><td><b>Тайник {{kazimir|Казимира}}.</b> Он прячет здесь ложки — и прихватит одну вещь у вас (его Прыть 5к6 против Чутья дозорных). Зато можно найти тайник: Чутьё на 2 успеха — 1к6 ложек.</td></tr>
<tr><td>5</td><td><b>Резервуар</b> с {{gosha|подводным Гошей}}. Угостите мёдом — Гоша пригодится против Филиппа.</td></tr>
<tr><td>6</td><td><b>Эхо из {{krepost|логова Вальтасара}}</b> — понятно, где выход к крепости. Утром дорога туда без броска.</td></tr></table></div>
<h3>{{labirint_kr|Лабиринт у имения Кривина}}</h3>
<div class="tbl"><table><tr><th>к6</th><th>Событие</th></tr>
<tr><td>1</td><td><b>{{sator|Сатор Арепыч}}</b> обходит владения. Один, сильный: Лицо 6, Коканье 5к6 на 4+ (шестёрка — два), струны — Опутан; защита 4к6. Чужаков ночью выдворяет — можно уйти, можно уговорить (Сыворотка общества против Чутья 4к6).</td></tr>
<tr><td>2</td><td><b>{{smolomas|Смоломаз}}</b> ищет {{sortirny|сортирного сатира}}. Один, сильный: Лицо 5, Коканье 5к6 на 4+; защита 2к6. Подозревает того, кто шутил при нём; убедить — Лицедейство против Чутья 4к6.</td></tr>
<tr><td>3</td><td><b>{{kolb_strazh|Колбасный страж}}</b> требует свежий укроп за ночлег. Нет укропа — выпроваживает (обычный, Лицо 3, Коканье 3к6 на 4+).</td></tr>
<tr><td>4</td><td><b>{{peskari|Пескари}}</b> с чужими письмами сворачивают на запах кухни. Чьи письма — решает ведущий.</td></tr>
<tr><td>5</td><td><b>{{vilki|Вилки}}</b> снуют мимо. За 3 кукича расскажут путь к {{orden|логову босых ведьм}}.</td></tr>
<tr><td>6</td><td><b>Объедки с приёма {{krivin|Кривина}}.</b> Сытный завтрак: +1 Лицо сверх отдыха.</td></tr></table></div>
<h3>{{lavovoe|Лавовое озеро}}</h3>
<div class="tbl"><table><tr><th>к6</th><th>Событие</th></tr>
<tr><td>1</td><td><b>{{kamnyuki|Камнюки}} обиделись.</b> 2 камнюка, обычные: Лицо 3, броня 2, валун — 5к6 на 5+, цель Опрокинута; защита 3к6.</td></tr>
<tr><td>2</td><td><b>{{lavan|Лаван}}</b> кидается с острова. Мелкие камнюки — 3к6 на 4+, два броска за ход по разным целям на средней дистанции; сам не подходит.</td></tr>
<tr><td>3</td><td><b>Жар.</b> Дозорные Разварены; спящие — нет.</td></tr>
<tr><td>4</td><td><b>Пескарь {{edgar|Эдгара}}</b> несёт письмо камнюкам. Отдать — камнюки добрее (подготовка к общению с ними); прочитать — узнать, о чём Эдгар их просит.</td></tr>
<tr><td>5</td><td><b>{{maska|Маска}} блеснула на острове.</b> Теперь видно, где она лежит: подготовка к поиску на острове.</td></tr>
<tr><td>6</td><td><b>Тёплая ночь.</b> Все сухие — Влажный снят; утром +1 Лицо сверх отдыха.</td></tr></table></div>
<h3>{{ugodya|Грязевые угодья}}</h3>
<div class="tbl"><table><tr><th>к6</th><th>Событие</th></tr>
<tr><td>1</td><td><b>{{gryazuny|Грязуны}} атакуют потоками грязи</b> — приняли кого-то за замаскированного мигуна. 2 на путника, мелочь: Лицо 1, обмазать — 3к6 на 5+, цель Неуклюжа; защита 2к6. Кокнуть их нельзя, колупнуть — можно. Хамон — отходят.</td></tr>
<tr><td>2</td><td><b>{{megune|Мигуны}} и грязуны</b> воюют рядом. Вспышки: все Ошарашены на первый ход утром; можно не вмешиваться.</td></tr>
<tr><td>3</td><td><b>{{boba|Боба}}</b> — грязун под видом бобыля — лезет к стоянке. Распознать — Чутьё на 2 успеха. Кто попытается его кокнуть, получает грязевой поток: урон 1 и Ошарашен.</td></tr>
<tr><td>4</td><td><b>{{mopsosviny|Мопсосвины}} с {{buldogzer|бульдогзером}}.</b> Шумно, но мирно: договориться (Механика или Бобылеведение, 1 успех) — починят одну вещь.</td></tr>
<tr><td>5</td><td><b>{{fantasmogor|Дядюшка Фантасмогор}}</b> донимает грязунов: хочет в угодья за рецептами. Предлагает работу за кукичи.</td></tr>
<tr><td>6</td><td><b>Обрывок рецепта {{radomir|гнома Радомира}}</b> торчит из грязи. Один рецепт [[q-brew|варева]] на выбор ведущего.</td></tr></table></div>`},

{id:"pr-seals",sec:"print",st:"ok",t:"Ведомость печатей",lead:"Общий лист на группу, с двух сторон: слева цели, сверху имена путников. Клетки квадратные — под печать. Три печати — новый уровень.",b:`
<p>Печатайте на одном листе с двух сторон (переворот по длинному краю). Клетки — 15×15 мм, пунктирный круг 12 мм — ориентир для печати. У общих целей вместо клеток — одна широкая в рамке: одна печать на всех.</p>
<div data-print="seals"></div>
<p>Правила — [[q-growth]].</p>`},

{id:"pr-rel",sec:"print",st:"ok",t:"Отношение зазеркальцев",lead:"Общий лист на группу: кто из зазеркальцев как к вам относится. Отмечайте карандашом.",b:`
<div data-print="rel"></div>
<p>Правила — [[q-attitude]].</p>`},

{id:"worlds",sec:"base",st:"ok",t:"Два мира",lead:"Игра идёт в реальном Петербурге и в Зазеркалье. У каждого мира своя сторона листа.",b:`
<p>Персонажи — обычные люди, которые попадают в Зазеркалье через порталы ПВЗ: зеркало за ширмой. Большая часть правил одинакова в обоих мирах. Различаются названия навыков, характеристика, на которую опирается навык, вещи, деньги и трек урона.</p>
<div class="tbl"><table><tr><th></th><th>Реальный мир (сторона А)</th><th>Зазеркалье (сторона Я)</th></tr>
<tr><td>Имя</td><td>настоящее</td><td>зазеркальное, вписывается в игре</td></tr>
<tr><td>Характеристики</td><td colspan="2">общие — [[stats]]</td></tr>
<tr><td>Навыки</td><td>обычные названия</td><td>зазеркальные названия — [[skills]]</td></tr>
<tr><td>Уровни навыков</td><td colspan="2">общие — [[levels]]</td></tr>
<tr><td>Трек урона</td><td>[[health|Здоровье]]</td><td>[[face|Лицо]]</td></tr>
<tr><td>Трек сил</td><td>[[fatigue|Усталость]]</td><td>[[fatigue|Разваристость]]</td></tr>
<tr><td>Деньги и вещи</td><td>рубли, инвентарь</td><td>кукичи, пожитки</td></tr></table></div>
<p>Как персонаж переходит между мирами: [[enter]] и [[wake]].</p>`},

{id:"excluded",sec:"base",st:"ok",t:"Исключено из кампании",lead:"Персонажи и вещи из видео, которых в кампании нет.",b:`
<ul><li><b>Подмыхан и его нектар</b> — не используются. Его место у прохода в запретную пустыню занял Бутыльон — [[q-desert]].</li></ul>
<p>Если в тексте видео или в атласе попадётся что-то из этого списка, считайте, что этого нет. Список пополняется ведущим.</p>`},
{id:"stats",sec:"base",st:"ok",t:"Характеристики",lead:"Шесть характеристик от 1 до 5 (у противников может быть больше). Значение характеристики — это число кубиков в броске.",b:`
<div class="tbl"><table><tr><th>Характеристика</th><th>Сокр.</th><th>Что описывает</th></tr>
<tr><td>Крепость</td><td>КР</td><td>сила, выносливость; задаёт [[health|Здоровье]] и [[face|Лицо]]</td></tr>
<tr><td>Прыть</td><td>ПР</td><td>ловкость, скорость, реакция</td></tr>
<tr><td>Смекалка</td><td>СМ</td><td>ум, логика, расчёт</td></tr>
<tr><td>Чутьё</td><td>ЧУ</td><td>внимательность, интуиция, нюх</td></tr>
<tr><td>Обаяние</td><td>ОБ</td><td>умение договариваться и нравиться</td></tr>
<tr><td>Странность</td><td>СТ</td><td>насколько персонаж «не отсюда»; заклинательная характеристика — пул для [[odd-rules|странностей]]</td></tr></table></div>
<p>Характеристики общие для обоих миров. Без навыка их бросают как [[bare|голую характеристику]].</p>`},

{id:"skills",sec:"base",st:"ok",t:"Навыки",lead:"Шестнадцать навыков. У каждого два названия и две опорные характеристики — по одной на мир.",b:`
<p>Навык один и тот же в обоих мирах, но в Зазеркалье он может опираться на другую характеристику. Уровень навыка общий: см. [[levels]].</p>
<div class="tbl"><table><tr><th>Реальный мир</th><th>Хар.</th><th>Зазеркалье</th><th>Хар.</th></tr>${SK.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</table></div>
<p class="note">Соблазнение заменило Массаж; зазеркальная пара осталась прежней — Щекотка.</p>`},

{id:"levels",sec:"base",st:"ok",t:"Уровни навыков",lead:"Уровень от 0 до 3 задаёт, какой результат на кубике считается успехом.",b:`
<div class="tbl"><table><tr><th>Уровень</th><th>Название</th><th>Успех на кубике</th></tr>
<tr><td>0</td><td>не умею</td><td>6</td></tr><tr><td>1</td><td>знаком</td><td>5–6</td></tr><tr><td>2</td><td>умею</td><td>4–6</td></tr><tr><td>3</td><td>мастер</td><td>4–6, шестёрка = два успеха</td></tr></table></div>
<p>Уровень общий для обеих сторон листа: Мастеровитость 2 означает и Колупание 2. Временно поднять уровень можно [[prep|подготовкой]].</p>
<p>Мастерство (уровень 3) дают только учителя — см. [[q-growth]]. Оно отличается от уровня 2 только на задачах, где нужно больше одного успеха — см. [[odds]].</p>`},

{id:"enter",sec:"mirror",st:"ok",t:"Вход через ПВЗ",lead:"В Зазеркалье попадают только вечером — через зеркало за ширмой в примерочной ПВЗ.",b:`
<div class="rule"><p>Войти можно только вечером. Днём зеркало примерочной — просто зеркало.</p></div>
<p>Порталы разбросаны по всему Петербургу, но открываются единицам. Стучать бесполезно: Поленыч сам выходит из зеркала за теми, кому путь открыт. Его дружеский жест — преклонить колено.</p>
<p>Персонаж уходит в зеркало целиком; в реальном мире на его месте никто не остаётся. Как это выглядит для работника — [[pvz-worker]]. Вещи, которые он несёт, [[items|отражаются]].</p>
<p>Обратно возвращаются только утром — [[wake|через сон]].</p>`},

{id:"wake",sec:"mirror",st:"ok",t:"Возвращение через сон",lead:"Чтобы вернуться, нужно уснуть в Зазеркалье с намерением проснуться. Утром персонаж выходит из того же зеркала ПВЗ, через которое вошёл, — выспавшимся.",b:`
<div class="rule"><p>Сон-возвращение — отдельное действие, а не [[rest|отдых]]. Отдыхать в Зазеркалье можно сколько угодно, не покидая его.</p></div>
<ul><li><b>Куда:</b> в тот же ПВЗ и из того же зеркала, через которое персонаж [[enter|вошёл]].</li>
<li><b>Когда:</b> утром следующего дня — см. [[time]].</li>
<li><b>В каком состоянии:</b> выспавшимся — наяву это полноценная ночь сна.</li></ul>
<h3>Уточнения</h3>
<ul><li>В безопасном месте персонаж засыпает без броска. В опасном — проверка Сноходчества на 1 успех; при провале уснуть не получается.</li>
<li>Безликий проснуться не может: сон его не отражает — см. [[faceless]]. Существа Зазеркалья через сон тоже не уходят — см. [[q-exit]].</li>
<li>Если персонажи засыпают порознь, каждый выходит из зеркала сам по себе; в Зазеркалье остаются только те, кто не спит.</li></ul>`},

{id:"time",sec:"mirror",st:"ok",t:"Время между мирами",lead:"Вечером вошёл — утром вышел. Сколько бы ни прошло в Зазеркалье, наяву проходит одна ночь.",b:`
<p>Персонаж может провести в Зазеркалье хоть неделю — наяву он отсутствует ровно одну ночь, с вечера до утра. Всё это время его нет нигде: ни дома, ни на связи.</p>
<p>Пока персонаж не [[wake|вернулся]], наяву длится та самая ночь. Застрять в Зазеркалье (например, [[faceless|без лица]]) — значит, что утро для него не наступает.</p>`},

{id:"pvz-worker",sec:"mirror",st:"ok",t:"Взгляд работника ПВЗ",lead:"Вечером клиент зашёл в примерочную и не вышел. Утром кто-то вышел из примерочной, хотя ПВЗ только открылся.",b:`
<p>Никакого двойника на месте персонажа не остаётся. Работник просто видит то, что видит:</p>
<ul><li><b>Первые разы</b> он решает, что клиент выбежал, пока он отвернулся, или что ему показалось.</li>
<li><b>Потом</b> начинает относиться к этим клиентам подозрительно: присматривается к примерочной, задаёт вопросы, может что-то предпринять.</li></ul>
<p>Работник ПВЗ — сквозной персонаж реального мира, чьё отношение к группе меняется от визита к визиту. Механика — [[q-pvz]].</p>
<p>Своё отражение персонаж может призвать сам — это отдельная тема: [[q-reflection]].</p>`},

{id:"items",sec:"mirror",st:"ok",t:"Отражённые вещи",lead:"Вещи переходят вместе с персонажем, но превращаются в свой зазеркальный аналог.",b:`
<p>Что именно получится из вещи, решает ведущий. Принцип — вещь остаётся «собой», но в логике Зазеркалья.</p>
<div class="tbl"><table><tr><th>Наяву</th><th>В Зазеркалье (примеры)</th></tr>
<tr><td>рубли</td><td>пакичи</td></tr><tr><td>телефон</td><td>свой пескарь: носит записки, но может свернуть на запах кухни</td></tr>
<tr><td>ключи</td><td>ключ от чего-то другого — неизвестно чего</td></tr><tr><td>проездной</td><td>билет на караван Птозного Эдгара</td></tr>
<tr><td>зонт</td><td>укрытие от громиков</td></tr><tr><td>шоколадка</td><td>скип — лакомство синих ящеров</td></tr></table></div>
<p>Полный список вещей, которые игроки берут с собой, — [[gear-home]].</p>
<h3>Обратный путь</h3>
<p>При [[wake|возвращении]] обратно отражаются только вещи, которые персонаж держал, засыпая. Всё остальное остаётся в Зазеркалье, а наяву эти вещи пропадают.</p>`},

{id:"daynight",sec:"order",st:"ok",t:"День и темнота",lead:"В Зазеркалье сменяются светлое время и темнота. Днём за миром смотрит Оно, в темноте — Она.",b:`
<div class="rule"><p><b>Сцена</b> — эпизод в одном месте с одной целью; <b>сессия</b> — одна встреча за столом. Где кончается сцена, когда сменяются день и темнота — решает ведущий.</p>
<p>Смену объявляет ведущий — например, раз в несколько сцен или после [[rest|отдыха]]. Отдыхать можно в любое время суток.</p></div>
<p>От времени суток зависит, чей [[oversight|надзор]] действует и насколько [[night|опасна темнота]]. Сон-[[wake|возвращение]] выводит персонажа наяву всегда утром, в какое бы время суток Зазеркалья он ни уснул.</p>`},

{id:"oversight",sec:"order",st:"ok",t:"Метки надзора",lead:"У каждого персонажа две шкалы по три клетки — Оно и Она. Три метки — наказание.",b:`
<div class="tbl"><table><tr><th></th><th>Оно</th><th>Она</th></tr>
<tr><td>Когда смотрит</td><td>в светлое время</td><td>в темноте</td></tr>
<tr><td>За что метка</td><td colspan="2">за [[misdeeds|проступок]], совершённый в его / её время</td></tr>
<tr><td>Три метки</td><td>ссылка в [[all-down|сладкий хлев]]</td><td>к Видусу — цыплёнком в чак-чак</td></tr></table></div>
<ul><li>Если персонаж старается совершить проступок незаметно, он бросает Хождение в копытах на 1 успех. Успех — метки нет.</li>
<li>После наказания шкала обнуляется.</li>
<li>[[faceless|Безликому]] метки не ставятся: Оно и Она его не узнают.</li>
<li>Шкалы есть только на стороне Я [[sheet|листа]]: наяву никто не надзирает.</li></ul>
<p class="note">Из лора: Оно никого не держит в хлеву вечно — «кто-то пробыл там всего пару секунд и даже хочет обратно». Цыплёнок в чак-чаке побеждает, если сумеет выбраться.</p>`},

{id:"misdeeds",sec:"order",st:"ok",t:"Проступки",lead:"Оно и Она карают за пустяки из своих списков. Настоящие злодейства — кража, драка — не их дело: с ними разбирается сам мир.",b:`
<h3>Перед Оно (светлое время)</h3>
<ul><li>ходьба на руках</li><li>поклонение сыру</li><li>сквернописьменность</li><li>поедание уравнения времени</li><li>уклонение от появления перед Истуканусом</li><li>кинуть сыр в небо — ничто не может быть желтее Оно (но если рядом громики, Оно отвлечётся на них и забудет)</li><li>смотреть на Оно в небе дольше пяти секунд — оно присмотрится в ответ. По вторникам можно, если только вторник не бешбармачный ({{p241|абзац 241}}, {{p24|24}})</li></ul>
<h3>Перед Ею (темнота)</h3>
<ul><li>щекотка — Она считает её слишком пустяковым испытанием и времяпровождением</li><li>прочие пустяковые занятия — по решению ведущего</li></ul>
<p>Списки пополняет ведущий. Принцип: проступок — это что-то нелепое или пустяковое, а не опасное. За проступок ставится [[oversight|метка надзора]].</p>`},

{id:"night",sec:"order",st:"ok",t:"Опасности темноты",lead:"В темноте Зазеркалье становится опаснее.",b:`
<ul><li><b>Агрессивные</b> — те, у кого это сказано в карточке (бобыли, пустынные бобыли, зубцы, жвачники, осы, ягодники, коленыч, многоликий Филипп, Боба), — бросают на 1 кубик больше во [[opposed|встречных бросках]].</li>
<li>Появляется жадность на лайке: рядом с ней замедляются и останавливаются катушки. Прогоняют её подводным Гошей или кукичами.</li>
<li>Выходит сырный Джо — днём он прячется от Оно.</li>
<li>Некоторые места открыты только в темноте, например подпольный щекоточный клуб — прямо под носом у Её.</li></ul>
<p>Дозор на [[rest-watch|отдыхе]] — сложность +1.</p>`},

{id:"odd-rules",sec:"odd",st:"ok",t:"Как работают странности",lead:"Странность — заклинательная характеристика. С её помощью персонаж совершает странности: от лёгкого провала сквозь землю до призыва собственного отражения.",b:`
<div class="rule"><p>Бросок: пул — Странность, успех на 5–6, как у [[bare|голой характеристики]]. Нужно набрать сложность странности (1–3 успеха). Каждая попытка стоит 1 Разваристость (наяву — Усталость), получилось или нет. Если шкала уже на 6, платят 1 Лицом (наяву — Здоровьем).</p></div>
<ul><li><b>Подготовка</b> работает как обычно: ритуал, нужный предмет или место силы дают +1 к уровню — успех на 4–6 ([[prep]]).</li>
<li><b>Наяву</b> странности работают, но реальность сопротивляется: сложность +1.</li>
<li><b>Против существа</b> странность бросается [[opposed|встречно]]: цель бросает указанную характеристику, эффект срабатывает, если у тебя больше успехов и набрана сложность.</li>
<li><b>Сверх сложности.</b> У некоторых странностей лишние успехи усиливают эффект — это написано в описании.</li>
<li><b>Отдача.</b> По общему правилу провал — просто «не вышло» ([[outcome]]). Если у странности есть отдача, она срабатывает при провале.</li>
<li><b>Тип действия</b> указан у каждой странности: основное, движение или реакция — см. [[act-turn]]. <b>Длительность:</b> мгновенно, раунд или до конца сцены — указано в описании.</li>
<li><b>Проступки.</b> Некоторые странности — проступки перед Оно или Ею ([[misdeeds]]).</li></ul>
<h3>Каталог — 40 странностей</h3><ul><li>[[odd-fight|Бой и власть]] — 11</li><li>[[odd-guard|Защита]] — 5</li><li>[[odd-move|Перемещение]] — 5</li><li>[[odd-help|Поддержка]] — 5</li><li>[[odd-word|Слово и облик]] — 6</li><li>[[odd-know|Знание]] — 4</li><li>[[odd-special|Особые]] — 4</li></ul>`},

{id:"odd-learn",sec:"odd",st:"ok",t:"Как учатся странностям",lead:"На старте персонаж не знает ни одной странности. Им учатся по ходу игры у зазеркальцев.",b:`
<ul><li><b>Старт:</b> 0 странностей.</li>
<li><b>Максимум:</b> столько странностей, сколько очков в [[stats|Странности]].</li>
<li><b>Учителя:</b> у каждой странности в каталоге указан, кто ей учит. Найти учителя и убедить его — уже приключение.</li>
<li><b>Плата — услуга,</b> а не кукичи: Сатор Арепыч попросит помочь с охраной имения, Магога — три шага, синие ящеры — шалость. Так же учителя дают мастерство — третий уровень навыка ([[q-growth]]).</li></ul>
<p><b>Забыть странность</b> можно, чтобы выучить новую, когда достигнут максимум: старая уходит, место освобождается.</p>`},
{id:"odd-fight",sec:"odd",st:"ok",t:"Бой и власть",lead:"Атакующие и подчиняющие странности.",b:`
<div class="tbl"><table><tr><th>Странность</th><th>Слож.</th><th>Тип и эффект</th><th>Учитель</th><th>Абзац</th></tr><tr><td><b>Клокочущий запах</b></td><td>1</td><td><i class="atype at-main">основное</i>Встречный бросок против Крепости цели на ближней или средней дистанции. Каждый лишний успех — 1 урон. До конца сцены бобыли считают тебя своим, а Сатор Арепыч — бобылем.</td><td>бобыли</td><td>5</td></tr><tr><td><b>Кокнуть издалека</b></td><td>2</td><td><i class="atype at-main">основное</i>Коканье на средней дистанции, пул — Странность. Урон — лишние успехи во встречном броске; бобыля кокает как обычное Коканье.</td><td>Вальтасар</td><td>35</td></tr><tr><td><b>Впиться в печень</b></td><td>2</td><td><i class="atype at-main">основное</i>Язык выстреливает на среднюю дистанцию: встречный против Прыти цели. Урон — лишние успехи, и цель [[cond-weak|Разварена]]. Отдача: язык прилипает — до конца раунда ты не можешь говорить.</td><td>н'ясортеп</td><td>12</td></tr><tr><td><b>Анекдот Гузлика</b></td><td>1</td><td><i class="atype at-main">основное</i>Цели, способные смеяться, бросают Чутьё против твоих успехов; проигравшие [[cond-bind|Ошарашены]]. Целей — 1 + каждый успех сверх сложности.</td><td>Гузлик</td><td>173</td></tr><tr><td><b>Похомить</b></td><td>2</td><td><i class="atype at-main">основное</i>Касание: цель [[cond-weak|Колосится]] до конца сцены; с успехом сверх сложности ещё и [[cond-weak|Разварена]]. Пацаноидов похомить нельзя.</td><td>Пахомий</td><td>16</td></tr><tr><td><b>Захват речи</b></td><td>3</td><td><i class="atype at-main">основное</i>Цель на ближней или средней дистанции [[cond-bind|Заполиплена]] до конца раунда: говорит только то, что говоришь ты, и не может применять странности. Отдача: до отдыха ты говоришь чужим голосом.</td><td>полипы — через большого Диму</td><td>45</td></tr><tr><td><b>Укрощение Григорьев</b></td><td>2</td><td><i class="atype at-main">основное</i>Неразумное существо выполняет простые команды до конца сцены. Если перед этим не извинился — сложность +1.</td><td>цирк Фантасмогора</td><td>173</td></tr><tr><td><b>Лицо Видуса</b></td><td>2</td><td><i class="atype at-main">основное</i>Мелкие существа на ближней и средней дистанции (калачи, ягодники, петухи) разбегаются. Один крупный противник бросает Странность против твоих успехов; проиграв, [[cond-bind|Ошарашен]]. Отдача: сфальшивил — метка Её.</td><td>Видус</td><td>114</td></tr><tr><td><b>Ходьба на руках</b></td><td>1</td><td><i class="atype at-move">движение</i>Твоё движение — на руках. Ноги свободны: до конца сцены ты [[cond-buff|Раскрепощён]]. Днём это проступок перед Оно. {{shnekishmyak|Шнеки-Шмяк}} принимает идущего на руках за своего и пропускает в трубы.</td><td>Птозный Эдгар</td><td>173, 220</td></tr><tr><td><b>Брунявый марш</b></td><td>3</td><td><i class="atype at-main">основное</i>Вызвать марш поперёк прохода или участка шириной до средней дистанции: до конца сцены его никто не может пересечь — ни враги, ни ты.</td><td>братья Мишеневы</td><td>111</td></tr><tr><td><b>Расщепить атом</b></td><td>3</td><td><i class="atype at-main">основное</i>Уничтожить неживой предмет размером до двери. Отдача: 1 урон тебе.</td><td>синие ящеры — в награду за шалость</td><td>61</td></tr></table></div><p class="note">Общие правила — [[odd-rules]]. «Абзац» — номер эпизода во вкладке «Текст» атласа. Сложности и эффекты поправим по итогам игры.</p>`},

{id:"odd-guard",sec:"odd",st:"ok",t:"Защита",lead:"Странности, которые спасают от урона и плена. «Реакция» — применяется в ответ, вне своего хода.",b:`
<div class="tbl"><table><tr><th>Странность</th><th>Слож.</th><th>Тип и эффект</th><th>Учитель</th><th>Абзац</th></tr><tr><td><b>Сократить вершины</b></td><td>1</td><td><i class="atype at-react">реакция</i>На атаку по тебе: каждый успех снимает 1 урон. Вне боя — пролезть в щель шириной с ладонь.</td><td>Магога</td><td>104</td></tr><tr><td><b>Провалиться сквозь землю</b></td><td>2</td><td><i class="atype at-react">реакция</i>Избежать атаки целиком или под землёй переместиться на среднюю дистанцию. Отдача: застрял по пояс — [[cond-bind|Ошарашен]].</td><td>Магога</td><td>104</td></tr><tr><td><b>Выворачивание</b></td><td>2</td><td><i class="atype at-react">реакция</i>Немедленно выскользнуть из хватки, пут, ловушки или клетки. До конца сцены ты [[cond-buff|Вывернут]].</td><td>кожник — в сладком хлеву</td><td>173</td></tr><tr><td><b>Отрастить раковину</b></td><td>2</td><td><i class="atype at-main">основное</i>До конца сцены ты [[cond-buff|В раковине]].</td><td>говорящие холмы</td><td>152</td></tr><tr><td><b>Окумекиться</b></td><td>2</td><td><i class="atype at-react">реакция</i>Когда Лицо или Здоровье падает до 0: встаёшь с 1. Раз за сцену.</td><td>Сатор Арепыч — видел это тысячи раз</td><td>121</td></tr></table></div><p class="note">Общие правила — [[odd-rules]]. «Абзац» — номер эпизода во вкладке «Текст» атласа. Сложности и эффекты поправим по итогам игры.</p>`},

{id:"odd-move",sec:"odd",st:"ok",t:"Перемещение",lead:"Как попасть туда, куда не пускают.",b:`
<div class="tbl"><table><tr><th>Странность</th><th>Слож.</th><th>Тип и эффект</th><th>Учитель</th><th>Абзац</th></tr><tr><td><b>Зависнуть в воздухе</b></td><td>2</td><td><i class="atype at-move">движение</i>Взлететь вместо движения. До конца сцены ты [[cond-buff|Паришь]]: достать тебя можно только со средней или дальней дистанции. Отдача: падаешь — 1 урон.</td><td>Магога</td><td>104</td></tr><tr><td><b>Прыжки с кротами</b></td><td>1</td><td><i class="atype at-move">движение</i>Вместо обычного движения — прыжок на среднюю дистанцию или на высоту дерева, до любого дупла.</td><td>цирк Фантасмогора</td><td>173</td></tr><tr><td><b>Удлинить отросток</b></td><td>1</td><td><i class="atype at-main">основное</i>Дотянуться на среднюю дистанцию: взять предмет или ударить Дракой. Успех сверх сложности — на дальнюю дистанцию. Отдача: отросток не втягивается — [[cond-weak|Неуклюж]] до отдыха.</td><td>автор объявления на бесхозном камне</td><td>93</td></tr><tr><td><b>Вихрь</b></td><td>3</td><td><i class="atype at-main">основное</i>Пара вихрей переносит всю группу в любую видимую точку на дальней дистанции. Рассеивается от толчка: если до перехода кого-то из группы атаковали, не срабатывает.</td><td>профессор Игорь Диод</td><td>140</td></tr><tr><td><b>Растягивание дырок</b></td><td>2</td><td><i class="atype at-main">основное</i>Растянуть любую дырку — в сыре, заборе, стене, сети — до размера прохода. Дырку от двери — сложность 3: проход в осколок ещё того Зазеркалья.</td><td>Сырный Джо</td><td>173</td></tr></table></div><p class="note">Общие правила — [[odd-rules]]. «Абзац» — номер эпизода во вкладке «Текст» атласа. Сложности и эффекты поправим по итогам игры.</p>`},

{id:"odd-help",sec:"odd",st:"ok",t:"Поддержка",lead:"Лечение и помощь себе и союзникам.",b:`
<div class="tbl"><table><tr><th>Странность</th><th>Слож.</th><th>Тип и эффект</th><th>Учитель</th><th>Абзац</th></tr><tr><td><b>Шепоток</b></td><td>1</td><td><i class="atype at-main">основное</i>Восстановить союзнику 1 Лицо (наяву — Здоровье) за каждый успех. Потерянное лицо не возвращает.</td><td>доктор Лист</td><td>157</td></tr><tr><td><b>Игра на подмышках</b></td><td>2</td><td><i class="atype at-main">основное</i>Союзники на ближней дистанции [[cond-buff|Воодушевлены]].</td><td>цирк Фантасмогора</td><td>173</td></tr><tr><td><b>Быть себе битубисасом</b></td><td>1</td><td><i class="atype at-react">реакция</i>Перед своей проверкой: ты сам себе подготовка на эту проверку.</td><td>Кловунец</td><td>177</td></tr><tr><td><b>Гуттаперчивость</b></td><td>1</td><td><i class="atype at-main">основное</i>Нужен гриб. До конца сцены ты [[cond-buff|Гуттаперчив]].</td><td>Идибикс</td><td>120</td></tr><tr><td><b>Ведьмин смех</b></td><td>1</td><td><i class="atype at-main">основное</i>Осветить смехом всё вокруг на средней дистанции: до конца сцены ты [[cond-buff|Светишься]], светобоязненные уходят.</td><td>орден босых ведьм</td><td>26</td></tr></table></div><p class="note">Общие правила — [[odd-rules]]. «Абзац» — номер эпизода во вкладке «Текст» атласа. Сложности и эффекты поправим по итогам игры.</p>`},

{id:"odd-word",sec:"odd",st:"ok",t:"Слово и облик",lead:"Общение, обман и чужие лица.",b:`
<div class="tbl"><table><tr><th>Странность</th><th>Слож.</th><th>Тип и эффект</th><th>Учитель</th><th>Абзац</th></tr><tr><td><b>Сальто природы</b></td><td>1</td><td><i class="atype at-move">движение</i>Твоё движение — сальто. Зазеркальцы признают тебя своим: до конца сцены ты [[cond-buff|Свой]].</td><td>Магога</td><td>104</td></tr><tr><td><b>Волнистая речь</b></td><td>1</td><td><i class="atype at-main">основное</i>Сказанное понимают только выбранные слушатели. Отдача: понимают все, кроме выбранных.</td><td>Орлундий — «лишь среди волн он может быть собой»</td><td>1, 72</td></tr><tr><td><b>Показать голос</b></td><td>1</td><td><i class="atype at-main">основное</i>Твой голос становится видимым: можно говорить без звука, под водой, сквозь шум — до дальней дистанции.</td><td>таинственный незнакомец</td><td>1</td></tr><tr><td><b>Сменить лицо</b></td><td>2</td><td><i class="atype at-main">основное</i>До конца сцены принять облик увиденного существа: внешне не отличить, подготовка к Лицедейству. Отдача: многоликий Филипп узнаёт, где ты.</td><td>Епень</td><td>188</td></tr><tr><td><b>Тонкий феодал</b></td><td>1</td><td><i class="atype at-main">основное</i>Иллюзия, будто феодал появился везде: пугливые бегут, остальные [[cond-bind|Напуганы]]. Рвётся от первого касания.</td><td>Фубоня</td><td>77, 85</td></tr><tr><td><b>Кислое касание</b></td><td>1</td><td><i class="atype at-main">основное</i>Касанием сделать еду или существо кислым до отдыха (<i>до следующего обеда</i>): этого никто не захочет есть (Михаил и Баранча отстанут), существо становится [[cond-weak|Кислым]].</td><td>Борька</td><td>95</td></tr></table></div><p class="note">Общие правила — [[odd-rules]]. «Абзац» — номер эпизода во вкладке «Текст» атласа. Сложности и эффекты поправим по итогам игры.</p>`},

{id:"odd-know",sec:"odd",st:"ok",t:"Знание",lead:"Узнать то, что скрыто.",b:`
<div class="tbl"><table><tr><th>Странность</th><th>Слож.</th><th>Тип и эффект</th><th>Учитель</th><th>Абзац</th></tr><tr><td><b>Вдохнуть сказку</b></td><td>3</td><td><i class="atype at-main">основное</i>Ведущий честно говорит, чем закончится текущая сцена или затея, если ничего не менять. Раз за сессию.</td><td>братья Мишеневы — помнят ветер, разносивший сказки</td><td>84</td></tr><tr><td><b>Вчерашний сон</b></td><td>2</td><td><i class="atype at-main">основное</i>Узнать вчерашний сон существа, которого касаешься: что его тревожит и чего оно хочет.</td><td>горбатый крупоед</td><td>25</td></tr><tr><td><b>Отпустить тень</b></td><td>2</td><td><i class="atype at-main">основное</i>Тень уходит на сцену: разведывает всё до дальней дистанции (ты видишь её глазами) или несёт до трёх пожитков. Отдача: тень не вернулась до отдыха — −1 кубик к Хождению в копытах.</td><td>братья Мишеневы — помнят тени, ходившие отдельно</td><td>84</td></tr><tr><td><b>Чужие голоса</b></td><td>1</td><td><i class="atype at-main">основное</i>Увидеть следы голосов, звучавших здесь за последний час: кто и что говорил.</td><td>Рудло — боится незваных ушей</td><td>59</td></tr></table></div><p class="note">Общие правила — [[odd-rules]]. «Абзац» — номер эпизода во вкладке «Текст» атласа. Сложности и эффекты поправим по итогам игры.</p>`},

{id:"odd-special",sec:"odd",st:"ok",t:"Особые",lead:"Странности, которые меняют правила игры.",b:`
<div class="tbl"><table><tr><th>Странность</th><th>Слож.</th><th>Тип и эффект</th><th>Учитель</th><th>Абзац</th></tr><tr><td><b>Повторить шаг</b></td><td>3</td><td><i class="atype at-react">реакция</i>Сразу после любого броска — своего или чужого: отменить его и перебросить. Отдача: шаг повторяет тебя — ты [[cond-bind|В петле]].</td><td>неизвестно — говорят, это след дегенератора</td><td>76</td></tr><tr><td><b>Призвать отражение</b></td><td>2</td><td><i class="atype at-main">основное</i>Творят в Зазеркалье: из примерочной ПВЗ наяву выходят двойники всех, кто вошёл через него вместе с тобой, и проживают за вас ночь — работник ничего не заподозрит. Альтернативное использование — двойник на раунд: ты [[cond-buff|С двойником]]. Отдача: отражение что-то натворило (ведущий бросает к6).</td><td>Поленыч</td><td>50</td></tr><tr><td><b>Разбудить дверь</b></td><td>3</td><td><i class="atype at-main">основное</i>Дырка от двери на сцену ведёт в осколок ещё того Зазеркалья или в сон спящего рядом существа.</td><td>пальчик медаль — с подвохом</td><td>84, 91</td></tr><tr><td><b>Кинуть сыр в небо</b></td><td>1</td><td><i class="atype at-main">основное</i>Нужен сыр. Если рядом громики — они уходят, и Оно не ставит метку. Если громиков нет — метка Оно.</td><td>Сырный Джо</td><td>193</td></tr></table></div><p class="note">Общие правила — [[odd-rules]]. «Абзац» — номер эпизода во вкладке «Текст» атласа. Сложности и эффекты поправим по итогам игры.</p>`},

{id:"cond-rules",sec:"cond",st:"ok",t:"Как работают состояния",lead:"Состояние — временный эффект на персонаже или противнике: ослабление, помеха, недуг или усиление.",b:`
<ul><li><b>Длительность</b> указана у каждого состояния: ход, раунд, сцена, до отдыха или пока не снимут особым средством.</li>
<li><b>Одно и то же состояние не складывается</b>: повторное наложение только продлевает его. Исключение — Разварен у противника, он копится до −2.</li>
<li><b>Разные состояния складываются</b>: Колосится и Разварен вместе дают −3 кубика (пул не меньше одного).</li>
<li><b>Снятие.</b> Почти всё снимает [[rest|отдых]] или конец сцены. [[cond-ill|Недуги]] снимает только лечение.</li>
<li><b>Противники</b> не имеют трека Разваристости — для них Разварен работает иначе (см. [[cond-weak]], [[q-foes]]).</li>
<li><b>На листе</b> состояния отмечают карандашом на полях.</li></ul>
<h3>Разделы</h3><ul><li>[[cond-weak]] — 6</li><li>[[cond-bind]] — 6</li><li>[[cond-ill]] — 4</li><li>[[cond-buff]] — 10</li></ul>`},

{id:"cond-weak",sec:"cond",st:"ok",t:"Ослабления",lead:"Состояния, которые снижают пул или мешают отдельным навыкам.",b:`
<div class="tbl"><table><tr><th>Состояние</th><th>Эффект</th><th>Длится / снимает</th><th>Откуда</th></tr><tr><td><b>Разварен</b><br><small>наяву — Устал</small></td><td>Игрок: +1 Разваристость (наяву — Усталость). Противник: −1 кубик ко всем броскам; накапливается до −2.</td><td>до конца сцены (у противника); у игрока — как трек: снимает [[rest|отдых]]</td><td>Впиться в печень, изнурение</td></tr><tr><td><b>Колосится</b></td><td>−1 кубик ко всем броскам</td><td>до конца сцены</td><td>Похомить, вялость, дурман</td></tr><tr><td><b>Неуклюж</b></td><td>−1 кубик к Прыти и навыкам на Прыти</td><td>пока не уйдёт помеха; отдых</td><td>длинный отросток, тяжёлая ноша, мокрая одежда</td></tr><tr><td><b>Кислый</b></td><td>−1 кубик к навыкам на Обаянии; тебя никто не съест</td><td>до отдыха (<i>до следующего обеда</i>)</td><td>Кислое касание, Борька</td></tr><tr><td><b>Красные уши</b></td><td>[[misdeeds|Проступки]] в темноте замечены без броска; −1 кубик к Обману</td><td>до конца сцены</td><td>мысли о щекотке, смущение</td></tr><tr><td><b>Влажный</b></td><td>громики отстают; портрет Алевтины смывается; огонь не горит, бумага раскисает</td><td>пока не высохнешь</td><td>громики, болото, дождь</td></tr></table></div>`},

{id:"cond-bind",sec:"cond",st:"ok",t:"Сковывания",lead:"Состояния, которые лишают хода, движения или странностей.",b:`
<div class="tbl"><table><tr><th>Состояние</th><th>Эффект</th><th>Длится / снимает</th><th>Откуда</th></tr><tr><td><b>Заполиплен</b></td><td>нельзя применять [[odd-rules|странности]]; говоришь только то, что велит наложивший (или молчишь)</td><td>до конца раунда, если не сказано иное</td><td>Захват речи, полипы</td></tr><tr><td><b>Опутан</b></td><td>нет движения; −1 кубик к атакам и защите. Если держат колупанием — вырваться основным действием: Крепость против Колупания держащего</td><td>Вывернут; Колупание или Мастеровитость на 1 успех; помощь союзника</td><td>струны Сатора Арепыча, сети, ловушки</td></tr><tr><td><b>Опрокинут</b></td><td>встать — это твоё [[act-move|движение]]; атаки по тебе с ближней дистанции +1 кубик</td><td>встать</td><td>Ванька Буран, коленыч, падение</td></tr><tr><td><b>Ошарашен</b></td><td>в следующий ход нет основного действия и реакции</td><td>один ход</td><td>хохот (Анекдот Гузлика), Лицо Видуса, застрял по пояс, окумекивание</td></tr><tr><td><b>Напуган</b></td><td>нельзя приблизиться к источнику страха; −1 кубик к атакам по нему</td><td>до конца сцены; снимает Икоту</td><td>тонкий феодал, Лицо Видуса, жуткие зазеркальцы</td></tr><tr><td><b>В петле</b></td><td>пропускаешь ходы, пока не выбросишь хотя бы один успех Странности</td><td>—</td><td>отдача Повторить шаг</td></tr></table></div>`},

{id:"cond-ill",sec:"cond",st:"ok",t:"Недуги",lead:"Болезни. Отдых их не снимает — нужно лечение.",b:`
<div class="tbl"><table><tr><th>Недуг</th><th>Эффект</th><th>Лечение</th><th>Откуда и где</th></tr><tr><td><b>Пуча</b></td><td>−1 кубик к Чутью ({{glaznye|глазным яблокам}} — −2)</td><td>тщательный жимпаж: Коканье или Знахарство, 1 успех</td><td>всё, у чего есть глаза; только в Зазеркалье</td></tr><tr><td><b>Простуда</b></td><td>говоришь волнисто — тебя видят, но не слышат; −1 кубик к навыкам на Обаянии</td><td>бурлешка и отдых</td><td>забыл надеть бурлешку; в обоих мирах</td></tr><tr><td><b>Ангина ламантинов</b></td><td>как простуда, но заразна: в конце сцены союзник на ближней дистанции бросает Крепость, при провале заражается</td><td>только доктор Лист</td><td>заразившиеся; только в Зазеркалье</td></tr><tr><td><b>Икота</b></td><td>−1 кубик к Хождению в копытах (наяву — к Скрытности)</td><td>испуг: состояние Напуган снимает Икоту</td><td>многоликий Филипп, нервы; в обоих мирах</td></tr></table></div>
<p>Простуда и икота бывают и наяву; пуча и ангина ламантинов — только в Зазеркалье.</p>`},

{id:"cond-buff",sec:"cond",st:"ok",t:"Усиления",lead:"Полезные состояния — от союзников, странностей и обстоятельств.",b:`
<div class="tbl"><table><tr><th>Состояние</th><th>Эффект</th><th>Длится / снимает</th><th>Откуда</th></tr><tr><td><b>Подготовлен</b></td><td>+1 к уровню навыка на одну проверку; на уровне 3 — +1 кубик</td><td>одна проверка</td><td>[[prep|подготовка]], Быть себе битубисасом</td></tr><tr><td><b>Воодушевлён</b></td><td>+1 кубик к следующему броску</td><td>один бросок</td><td>Игра на подмышках</td></tr><tr><td><b>Раскрепощён</b></td><td>+1 кубик к атакам на ближней дистанции</td><td>до конца сцены</td><td>Ходьба на руках, кураж</td></tr><tr><td><b>Гуттаперчив</b></td><td>[[prep|подготовка]] к проверкам Прыти и Чак-чаку; падения не наносят урона</td><td>до конца сцены</td><td>Гуттаперчивость (грибы Идибикса)</td></tr><tr><td><b>Вывернут</b></td><td>нельзя схватить, связать или колупнуть; снимает Опутан</td><td>до конца сцены</td><td>Выворачивание</td></tr><tr><td><b>В раковине</b></td><td>[[act-defense|броня]] 2 — не складывается с другой, берётся лучшая; Коканье не действует</td><td>до конца сцены</td><td>Отрастить раковину, скорлупа, латы</td></tr><tr><td><b>Парит</b></td><td>достать можно только со средней или дальней дистанции</td><td>до конца сцены</td><td>Зависнуть в воздухе</td></tr><tr><td><b>Свой</b></td><td>подготовка к общению с зазеркальцами; майонезные тётеньки не придираются</td><td>до конца сцены</td><td>Сальто природы</td></tr><tr><td><b>Светится</b></td><td>темнота вокруг на средней дистанции не даёт противникам +1 кубик</td><td>до конца сцены</td><td>Ведьмин смех, светлячки</td></tr><tr><td><b>С двойником</b></td><td>первая атака по тебе приходится в двойника</td><td>один раунд</td><td>Призвать отражение</td></tr></table></div>`},

{id:"gear-rules",sec:"gear",st:"ok",t:"Как работают предметы",lead:"Предметы дают подготовку, накладывают состояния или делают что-то особенное. У каждого есть цена в кукичах и аналог в реальном мире.",b:`
<ul><li><b>Вещи из дома</b> переходят через зеркало [[items|отражёнными]]: у каждой есть зазеркальный аналог — [[gear-home]].</li>
<li><b>Эффект</b> чаще всего — [[prep|подготовка]] к навыку или [[cond-rules|состояние]]. Подготовка не складывается: два предмета на одну проверку дают всё равно +1.</li>
<li><b>Цена</b> — сколько предмет стоит в кукичах, если купить или продать его в Зазеркалье. Ориентиры: мелочь — 1–5, полезная вещь — 6–15, редкость — 20–40, сокровище — от 50.</li>
<li><b>Пакичи</b> меняются на кукичи: 1 пакич = 2 кукича (у честного менялы; остальные дают «хорошо если пять половин»).</li>
<li><b>Монеты.</b> Бумажные деньги за зеркалом становятся пакичами, а любые монеты — кукичами, огрызками яблок (1 монета = 1 кукич). Обратно кукичи превращаются только в шоколадные монеты: заработать наяву на Зазеркалье нельзя.</li>
<li><b>Предметы с зарядом</b> («раз за сцену», «раз между отдыхами») восстанавливаются [[rest|отдыхом]].</li></ul>
<p>Каталоги: [[gear-weapons]] — 11, [[gear-home]] — 17, [[gear-shop]] — 19, [[gear-potions]] — 6.</p>`},

{id:"gear-home",sec:"gear",st:"ok",t:"Вещи из дома",lead:"Что игроки берут с собой и во что это превращается за зеркалом.",b:`
<div class="tbl"><table><tr><th>Предмет</th><th>Аналог наяву</th><th>Кукичи</th><th>Эффект</th></tr><tr><td><b>Свой пескарь</b></td><td>телефон</td><td>15</td><td>Носит записки другим путникам и знакомым зазеркальцам — так группа держит связь, разойдясь. Доставка — бросок Чутья пескаря (2к6) на 1 успех; провал — записка оказывается в имении Кривина. Не [[q-companions|спутник]]: места спутника не занимает, в бою не участвует. «Разряжается» — устаёт и до отдыха не летает.</td></tr><tr><td><b>Ключ от чего-то другого</b></td><td>ключи</td><td>10</td><td>Раз за сессию открывает любой замок, дверь или сундук. Что за дверью — решает ведущий. Даёт подготовку к странности Разбудить дверь.</td></tr><tr><td><b>Пакичи</b></td><td>рубли (бумажные)</td><td>1 пакич = 2 кукича</td><td>Деньги Зазеркалья. Меняются на кукичи у менял; Фантасмогор берёт только кукичи.</td></tr><tr><td><b>Кукичи</b></td><td>любые монеты (мешочек золота, мелочь)</td><td>1 монета = 1 кукич</td><td>Любые монеты за зеркалом становятся кукичами. Обратно кукичи превращаются только в шоколадные монеты.</td></tr><tr><td><b>Благородный пакет</b></td><td>органайзер для настольной игры</td><td>15</td><td>Оживает [[q-companions|спутником]] и занимает его место. «Хранение»: +3 строки пожитков; то, что лежит в пакете, нельзя украсть или выбить (Казимиру не достать). Подготовка к Сыворотке общества. Другие пакеты охотно в него запрыгивают.</td></tr><tr><td><b>Шапец-распределитель</b></td><td>распределяющая шляпа</td><td>50</td><td>Говорящий шапец: все свойства [[gear-shop|шапца]]. Раз за сессию распределяет: из двух вариантов (путей, ответов, дверей) честно называет, какой лучше, — как вопрос Истукануса, только с подсказкой. Не действует на дядю Егоню.</td></tr><tr><td><b>Банка сопения</b></td><td>повербанк</td><td>12</td><td>Заряжена сопением толстомясочки. Раз между отдыхами — снять 1 Разваристость.</td></tr><tr><td><b>Двенадцатикрапинчатые стёкла</b></td><td>очки</td><td>8</td><td>Видишь лишние крапинки: [[prep|подготовка]] к Чутью, чтобы распознать самозванца (осы под видом калачей, горный краб, синий ящер). Защищают от [[cond-ill|Пучи]].</td></tr><tr><td><b>Фляга влаги</b></td><td>вода</td><td>3 (в пустыне — 15)</td><td>Облиться — стать [[cond-weak|Влажным]]: громики отстают. Смывает портрет Алевтины. В запретной пустыне — лучший подарок Бутыльону: [[prep|подготовка]], чтобы он одолжил воду ([[q-desert]]).</td></tr><tr><td><b>Хрустящие огуски</b></td><td>чипсы</td><td>2</td><td>Съесть — снять [[cond-weak|Колосится]]. Ими можно задобрить толстомясочку и мелкую живность: подготовка к Бобылеведению.</td></tr><tr><td><b>Скип</b></td><td>шоколадка</td><td>30</td><td>Любимое лакомство синих ящеров, дозволенное только отличившимся. Синий ящер за него выполнит одну просьбу или выдаст одну шалость сородичей.</td></tr><tr><td><b>Писало летописца</b></td><td>карандаш</td><td>5</td><td>Написанное им не стирается. [[prep|Подготовка]] к Летописи при записях. Днём каждая надпись — бросок Прыти на 1 успех, иначе это сквернописьменность и метка Оно.</td></tr><tr><td><b>Жабец</b></td><td>фигурка лягушки</td><td>6</td><td>Оживает [[q-companions|спутником]] и занимает его место. Сторожит: персонажа нельзя застать врасплох. Квакнет по команде — Акакий и другие пугливые [[cond-bind|Напуганы]]. Подготовка к Чак-чаку.</td></tr><tr><td><b>Жабий шапец</b></td><td>панамка в виде лягушки</td><td>40</td><td>Символ статуса. На носителя не хочется замахиваться: первая атака по нему в сцене −1 кубик. Бутыльон одалживает воду без броска ([[q-desert]]), петухи поют серенады, Алевтина уважает. Раз за сцену — подготовка к проверке на Обаянии. Не действует на дядю Егоню.</td></tr><tr><td><b>Последняя ложка Понполомео</b></td><td>позолоченная фигурная ложка с кристалликом</td><td>100 (столько даст Понполомео)</td><td>Ей не хватает коллекции сеньора Понполомео — Казимир будет охотиться за ней. Раз за сессию ею можно зачерпнуть немного неосязаемого — эха, смеха, тени, сна — и унести с собой.</td></tr><tr><td><b>Копыта</b></td><td>кроссовки</td><td>10</td><td>Как у босых ведьм: не оставляешь следов. [[prep|Подготовка]] к Хождению в копытах.</td></tr><tr><td><b>Светлячок в коробке</b></td><td>зажигалка</td><td>6</td><td>Открыть коробку — до конца сцены ты [[cond-buff|Светишься]]. Выпущенный светлячок врезается в ближайшую деревяшку и отвлекает кого-то на ход. Пуст до отдыха.</td></tr></table></div>
<p>Кокалка (расчёска), нож-многоножка (швейцарский нож) и тянучая петля (резинка для волос) — в [[gear-weapons|оружии]].</p>
<p class="note">Список составлен по ответам игроков. Аналог наяву — что персонаж принёс; вещь [[wake|возвращается]] обратно, только если он держал её, засыпая.</p>`},

{id:"gear-shop",sec:"gear",st:"ok",t:"Лавка Зазеркалья",lead:"Вещи, которые можно купить, выменять или найти в Зазеркалье. Аналог наяву — во что вещь превратится, если унести её домой.",b:`
<div class="tbl"><table><tr><th>Предмет</th><th>Аналог наяву</th><th>Кукичи</th><th>Эффект</th></tr><tr><td><b>Бурлешка</b></td><td>шапка</td><td>5</td><td>Защищает от [[cond-ill|Простуды]] — «говорила мать надеть бурлешку». В осколке ещё того Зазеркалья носить не заставляют.</td></tr><tr><td><b>Войлочные катышки</b></td><td>катышки со свитера</td><td>2</td><td>Шаг первый против разъярённого коленыча: бросить ему — он, может быть, кинется тереться. Пакет охотно их хранит.</td></tr><tr><td><b>Сыр от Джо</b></td><td>сыр</td><td>2</td><td>Откупиться от ягодников, приманить кокшу, кинуть в небо (странность). Иногда сам убегает.</td></tr><tr><td><b>Мёд</b></td><td>мёд</td><td>3</td><td>Угостить подводного Гошу — поможет против многоликого Филиппа. Ингредиент [[q-brew|варева]].</td></tr><tr><td><b>Хамон</b></td><td>сыровяленая колбаса</td><td>6</td><td>Задобрить грязуна: [[prep|подготовка]] к Колупанию грязунов.</td></tr><tr><td><b>Свежий укроп</b></td><td>пучок укропа</td><td>1</td><td>Пропуск за третий поворот у колбасного стража.</td></tr><tr><td><b>Золотая открытка с розами</b></td><td>открытка</td><td>5</td><td>Откупиться от майонезной тётеньки — она не сочтёт тебя странным.</td></tr><tr><td><b>Морковные пятки</b></td><td>морковка</td><td>2</td><td>Классика высокой кухни. Подарок на приём у Кривина — [[prep|подготовка]] к Сыворотке общества. Ингредиент [[q-brew|варева]].</td></tr><tr><td><b>Хрычи</b></td><td>маленькая тыква</td><td>2</td><td>Зрелые хрычи с огорода бабы Жули; гремучее древо их любит. Ингредиент [[q-brew|варева]].</td></tr><tr><td><b>Зеленика</b></td><td>крыжовник</td><td>1</td><td>Ягода сумеречной рощи; Акакий варит из неё компот. Ингредиент [[q-brew|варева]].</td></tr><tr><td><b>Гриб</b></td><td>шампиньон</td><td>1</td><td>Обычный лесной гриб — смотри, чтобы Идибикс не увязался. Ингредиент [[q-brew|варева]].</td></tr><tr><td><b>Пыль с ног босой ведьмы</b></td><td>молотый перец</td><td>10</td><td>Душистая приправа: [[prep|подготовка]] к Варению.</td></tr><tr><td><b>Гыча</b></td><td>суп в термосе</td><td>8</td><td>Варево бабы Жули. Миска — снять 2 Разваристости.</td></tr><tr><td><b>Кашка для запоминания</b></td><td>глицин</td><td>8</td><td>Съесть — до конца сцены [[prep|подготовка]] к Летописи и проверкам на запоминание.</td></tr><tr><td><b>Склянка от босой ведьмы</b></td><td>пузырёк зелёнки</td><td>15</td><td>Целебная жидкость из логова под Кривой горой: восстановить 1 Лицо. Ведьмы продают её неохотно.</td></tr><tr><td><b>Перо совян</b></td><td>перо из подушки</td><td>30</td><td>Ценится в определённых кругах. Продать, подкупить, но совяне такого не простят.</td></tr><tr><td><b>Слюда</b></td><td>фольга от шоколадки</td><td>3</td><td>Её приносят приручённые кокши. Товар для обмена.</td></tr><tr><td><b>Скорлупка</b></td><td>фисташковая скорлупа</td><td>4</td><td>Мелочь для всех, сокровище для Эпикантуса и Михаила — их внимание обеспечено. Ингредиент [[q-brew|варева]].</td></tr><tr><td><b>Шапец</b></td><td>любой головной убор</td><td>40</td><td>Как жабий шапец: главное в нём — уверенность. Свойства те же.</td></tr></table></div>
<p>Струны Сатора Арепыча и глазное молоко — в [[gear-weapons|оружии]].</p>`},

{id:"gear-weapons",sec:"gear",st:"ok",t:"Оружие",lead:"Чем бьют, бросают и опутывают. У оружия нет бонуса к урону — у каждого своё свойство.",b:`
<div class="rule"><p>Урон — лишние успехи во [[opposed|встречном броске]] ([[damage]]). Оружие даёт не урон, а свойство. Навык: рукопашное — Драка (в Зазеркалье Коканье), броски — Спорт (в Зазеркалье Чак-чак).</p></div>
<div class="tbl"><table><tr><th>Оружие</th><th>Аналог наяву</th><th>Кукичи</th><th>Дистанция</th><th>Навык</th><th>Свойство</th></tr><tr><td><b>Кокалка</b></td><td>расчёска</td><td>8</td><td>ближняя</td><td>Драка / Коканье</td><td>Хорошая кокалка: [[prep|подготовка]] к Коканью. Можно щекотать (подготовка к Щекотке), но щекотка — проступок перед Её.</td></tr><tr><td><b>Нож-многоножка</b></td><td>швейцарский нож</td><td>20</td><td>ближняя</td><td>Драка / Коканье</td><td>Выкован в логове Вальтасара: [[prep|подготовка]] к Колупанию и Мастеровитости. Проворный: украденный или выбитый, к концу сцены сам возвращается к владельцу.</td></tr><tr><td><b>Тянучая петля</b></td><td>резинка для волос</td><td>4</td><td>ближняя</td><td>Спорт / Чак-чак</td><td>Вместо урона цель [[cond-bind|Опутана]] до конца раунда. Подготовка к странности Удлинить отросток.</td></tr><tr><td><b>Струны Сатора Арепыча</b></td><td>гитарные струны</td><td>25</td><td>ближняя</td><td>Драка / Коканье</td><td>Выдержат даже Михаила. Опутать: при попадании вместо урона цель [[cond-bind|Опутана]].</td></tr><tr><td><b>Перо Золотого Какаду</b></td><td>павлинье перо</td><td>не продаётся</td><td>ближняя</td><td>Соблазнение / Щекотка</td><td>Ритуальное перо босых ведьм: [[prep|подготовка]] к Щекотке. Владельца ищет орден.</td></tr><tr><td><b>Палка Мишеневых</b></td><td>трость</td><td>6</td><td>средняя</td><td>Драка / Коканье</td><td>Длинная: бьёт на средней дистанции. Братья Мишеневы готовят такие к приходу круглого Толика.</td></tr><tr><td><b>Мелкие камнюки</b></td><td>камушки</td><td>1 за горсть</td><td>средняя</td><td>Спорт / Чак-чак</td><td>Бросок. Горсть — три броска. Камнюки лавового озера обижаются, если узнают.</td></tr><tr><td><b>Глазное молоко</b></td><td>глазные капли</td><td>3</td><td>средняя</td><td>Спорт / Чак-чак</td><td>Обрызгать: гречневые калачи разбегаются без броска; остальных калачей раззадоривает.</td></tr><tr><td><b>Подводный Гоша</b></td><td>аквариумная рыбка</td><td>не продаётся — угости мёдом</td><td>средняя</td><td>Спорт / Чак-чак</td><td>Кинуть: многоликий Филипп или жадность на лайке отступают без броска. Гоша возвращается в ближайший резервуар; второй раз за сцену не полетит.</td></tr><tr><td><b>Сковородка</b></td><td>сковородка</td><td>10</td><td>ближняя</td><td>Драка / Коканье</td><td>Пробитие: урон сверх нуля Лица (наяву — Здоровья) переходит в Разваристость (наяву — Усталость).</td></tr><tr><td><b>Молот Алевтины</b></td><td>кувалда</td><td>не продаётся</td><td>ближняя</td><td>Драка / Коканье</td><td>Тяжёлый: попадание [[cond-bind|опрокидывает]] цель, но ты [[cond-weak|Неуклюж]], пока держишь его. Алевтина ищет свой молот.</td></tr></table></div>
<p class="note">«Не продаётся» — добывается только в приключении. [[distance|Дистанции]] — ближняя, средняя, дальняя.</p>`},
{id:"gear-potions",sec:"gear",st:"ok",t:"Зелья Вальтасара",lead:"Вальтасар варит зелья с разными эффектами. Каждое — на один раз.",b:`
<div class="tbl"><table><tr><th>Зелье</th><th>Аналог наяву</th><th>Кукичи</th><th>Эффект</th></tr><tr><td><b>Зелье распознавания мигунов</b></td><td>газировка «Байкал»</td><td>12</td><td>До конца сцены отличаешь мигуна, замаскированного под бобыля.</td></tr><tr><td><b>Зелье дальнего коканья</b></td><td>энергетик</td><td>15</td><td>Один раз — Коканье на средней дистанции.</td></tr><tr><td><b>Зелье планов синих ящеров</b></td><td>растворимый кофе</td><td>20</td><td>Ведущий раскрывает одну ближайшую шалость синих ящеров.</td></tr><tr><td><b>Зелье бега</b></td><td>изотоник</td><td>10</td><td>До конца сцены ты бежишь быстрее глазастой пиццы: уйти от погони без броска.</td></tr><tr><td><b>Зелье от ангины ламантинов</b></td><td>леденцы от горла</td><td>15</td><td>До конца сессии иммунитет к [[cond-ill|Ангине ламантинов]].</td></tr><tr><td><b>Зелье парения над слизнями</b></td><td>конфеты «Птичье молоко»</td><td>5</td><td>Действует только на голубей. Вальтасар продаёт его охотно.</td></tr></table></div>
<p class="note">Из абзацев 35 и 43 видео. Зелье парения над слизнями действует только на голубей — и Вальтасар об этом не предупреждает.</p>
<p>Эти же зелья можно сварить самим, зная рецепт, — [[q-brew]].</p>`},

{id:"roll",sec:"check",st:"ok",t:"Бросок",lead:"Бросаете столько к6, сколько очков в характеристике навыка, и считаете успехи.",b:`
<div class="rule"><p>Пул = значение характеристики, на которую опирается навык в текущем мире. Каждый кубик не ниже порога [[levels|уровня навыка]] — один успех.</p></div>
<p>Пример: Даня в Зазеркалье чинит бульдогзер. Механика опирается на Смекалку (4), уровень Техники/Механики 3. Бросает 4к6, успех на 4–6, шестёрки считаются дважды.</p>
<p>Сколько успехов нужно, задаёт [[difficulty]]. Что получилось — [[outcome]]. Пул может уменьшить [[fatigue|Усталость]].</p>`},

{id:"difficulty",sec:"check",st:"ok",t:"Сложность",lead:"Сложность — это число успехов, которое нужно набрать.",b:`
<div class="tbl"><table><tr><th>Нужно успехов</th><th>Задача</th></tr><tr><td>1</td><td>обычное дело</td></tr><tr><td>2</td><td>трудное</td></tr><tr><td>3</td><td>почти невозможное</td></tr></table></div>
<p>Большинство проверок требуют одного успеха. Насколько реальны трудные задачи для разных персонажей — [[odds]].</p>`},

{id:"outcome",sec:"check",st:"ok",t:"Исход проверки",lead:"Набрал нужное число успехов — успех. Не набрал — провал.",b:`
<div class="rule"><p>Промежуточных исходов («успех с ценой», «почти получилось») в базовых правилах нет.</p></div>
<p>Если ситуации нужен особый результат — степень успеха, частичный успех, цена, — это прописывается в описании самой ситуации, а не общим правилом.</p>
<p>«Вытянуть» неудачный бросок можно [[reroll|перебросом]] — он доступен всем. Кроме него — свой [[q-bitubis|битубисас]] раз за сессию и странность «Повторить шаг» ([[odd-special]]).</p>
<p class="note">Почему так: обычные проверки требуют одного успеха. Если разрешить успех на один меньше, игроки будут проходить их автоматически, тратя Усталость, и ходить разваренными.</p>`},

{id:"bare",sec:"check",st:"ok",t:"Голая характеристика",lead:"Когда навык не подходит — выдержать, увернуться, учуять — бросают одну характеристику.",b:`
<div class="rule"><p>Пул = значение характеристики, успех на 5–6.</p></div>
<p>По шансам это то же самое, что навык уровня 1. Примеры: Крепостью выдерживают беспощадный массаж тёти Вари, Прытью уходят от коленыча, Чутьём не дают себя заболтать говорящим холмам.</p>`},

{id:"prep",sec:"check",st:"ok",t:"Подготовка",lead:"Подготовленный персонаж получает +1 к уровню навыка на эту проверку, но не выше 3.",b:`
<div class="rule"><p>Подготовка — это подходящий предмет, сделанная заранее подготовка или нужная помощь другого игрока.</p></div>
<p>Помощь другого игрока работает только через подготовку: отдельного правила «помочь кубиком» нет, и последствия провала не делятся.</p>
